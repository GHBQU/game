<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谁是小宇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background:#1a1a2e;
            color:#fff;
            padding:20px;
            max-width:980px;
            margin:0 auto;
        }
        .box{
            background:#272942;
            border-radius:12px;
            padding:24px;
            margin:15px 0;
        }
        button{
            background:#4158d0;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:8px;
            margin:5px;
            cursor:pointer;
            font-size:15px;
        }
        button:disabled{
            background:#444;
            color:#888;
            cursor:not-allowed;
        }
        .night{
            background:#0f1020 !important;
        }
        .player-card{
            display:inline-block;
            background:#353859;
            padding:12px;
            border-radius:10px;
            margin:6px;
            min-width:110px;
            text-align:center;
        }
        .dead{
            opacity:0.35;
            text-decoration:line-through;
        }
        h1{
            text-align:center;
            color:#ffdddd;
        }
        .setting-row{
            margin:8px 0;
        }
        input{
            padding:6px;
            width:60px;
            font-size:16px;
            border-radius:6px;
            border:none;
        }
        .identity-box{
            background:#202240;
            padding:40px 30px;
            border-radius:14px;
            text-align:center;
            font-size:20px;
            margin:10px 0;
            min-height:220px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }
        .identity-role{
            font-size:32px;
            margin:20px 0;
            color:#ffe082;
        }
        .tip{
            color:#ffbcbc;
            margin:10px 0;
        }
        .preview{
            background:#202240;
            padding:14px;
            border-radius:8px;
            margin:10px 0;
            font-size:14px;
            line-height:1.8;
        }
        .preview .off{
            color:#888;
            text-decoration:line-through;
        }
        .night-info{
            background:#2a2c4a;
            padding:14px;
            border-radius:8px;
            margin:10px 0;
            font-size:16px;
        }
        .role-reveal{
            background:#202240;
            padding:20px;
            border-radius:10px;
            margin:10px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 谁是小宇</h1>
    <div class="box">
        <div id="start-area">
            <p>自定义各角色数量，<b>填 0 代表本局不出场</b><br/>
            🐺小宇=狼人 | 👮老师=警长 | 💊班长=女巫<br/>
            🔍科代表=预言家 | 🎯嘉豪=猎人 | 🙏大佛=守卫 | 📖普通同学=平民<br/>
            嘉豪：被刀/被投出局开枪带人，被毒不能开枪。<br/>
            大佛：每晚守护1人，被守护者免疫狼刀，不能连续两晚守同一人。</p>

            <div class="setting-row">
                <label>🐺小宇：</label>
                <input id="cntXiaoyu" type="number" min="0" max="10" value="4" oninput="updatePreview()">
            </div>
            <div class="setting-row">
                <label>👮老师：</label>
                <input id="cntTeacher" type="number" min="0" max="10" value="1" oninput="updatePreview()">
            </div>
            <div class="setting-row">
                <label>💊班长：</label>
                <input id="cntMonitor" type="number" min="0" max="10" value="1" oninput="updatePreview()">
            </div>
            <div class="setting-row">
                <label>🔍科代表：</label>
                <input id="cntRep" type="number" min="0" max="10" value="1" oninput="updatePreview()">
            </div>
            <div class="setting-row">
                <label>🎯嘉豪：</label>
                <input id="cntJiahao" type="number" min="0" max="10" value="1" oninput="updatePreview()">
            </div>
            <div class="setting-row">
                <label>🙏大佛：</label>
                <input id="cntDafo" type="number" min="0" max="10" value="1" oninput="updatePreview()">
            </div>
            <div class="setting-row">
                <label>📖普通同学：</label>
                <input id="cntStudent" type="number" min="0" max="10" value="0" oninput="updatePreview()">
            </div>
            <div class="preview" id="preview"></div>
            <div class="tip" id="sumTip"></div>
            <br>
            <button onclick="startGame()">开始游戏</button>
        </div>

        <div id="game-area" style="display:none;">
            <h3 id="phase-text">游戏阶段</h3>
            <div id="identity-view"></div>
            <div id="player-list"></div>
            <div id="action-area"></div>
        </div>
    </div>

<script>
const ROLE = {
    XIAOYU:"xiaoyu",
    TEACHER:"teacher",
    MONITOR:"monitor",
    REP:"rep",
    JIAHAO:"jiahao",
    DAFO:"dafo",
    STUDENT:"student"
}
let game = {
    players:[],
    phase:"identity",
    identityIndex:0,
    identityRevealed:false,
    nightCount:1,
    isMonitorHasHeal:true,
    isMonitorHasPoison:true,
    deadTonight:null,
    poisonedId:null,
    guardId:null,
    lastGuardId:null,
    gameOver:false,
    winner:null
}
const roleNameMap = {
    "xiaoyu":"🐺小宇",
    "teacher":"👮老师(警长)",
    "monitor":"💊班长(女巫)",
    "rep":"🔍科代表(预言家)",
    "jiahao":"🎯嘉豪(猎人)",
    "dafo":"🙏大佛(守卫)",
    "student":"📖普通同学"
}

function updatePreview(){
    const c = readCounts();
    const total = c.xiaoyu + c.teacher + c.monitor + c.rep + c.jiahao + c.dafo + c.student;
    document.getElementById("sumTip").innerText = `总人数：${total}`;

    const rows = [
        ["🐺小宇", c.xiaoyu],
        ["👮老师", c.teacher],
        ["💊班长", c.monitor],
        ["🔍科代表", c.rep],
        ["🎯嘉豪", c.jiahao],
        ["🙏大佛", c.dafo],
        ["📖普通同学", c.student]
    ];
    let html = "角色构成：<br/>";
    rows.forEach(r=>{
        if(r[1] > 0){
            html += `&nbsp;&nbsp;${r[0]} × ${r[1]}<br/>`;
        }else{
            html += `<span class="off">&nbsp;&nbsp;${r[0]} × 0（不出场）</span><br/>`;
        }
    });
    document.getElementById("preview").innerHTML = html;
}

function readCounts(){
    return {
        xiaoyu: Number(document.getElementById("cntXiaoyu").value)||0,
        teacher: Number(document.getElementById("cntTeacher").value)||0,
        monitor: Number(document.getElementById("cntMonitor").value)||0,
        rep: Number(document.getElementById("cntRep").value)||0,
        jiahao: Number(document.getElementById("cntJiahao").value)||0,
        dafo: Number(document.getElementById("cntDafo").value)||0,
        student: Number(document.getElementById("cntStudent").value)||0
    };
}

function startGame(){
    const c = readCounts();
    const total = c.xiaoyu + c.teacher + c.monitor + c.rep + c.jiahao + c.dafo + c.student;

    if(total <3 || total>11){
        alert("总人数必须 3-11 人！请调整角色数量");
        return;
    }
    if(c.xiaoyu <=0){
        alert("至少要有1个小宇！");
        return;
    }

    game = {
        players:[],
        phase:"identity",
        identityIndex:0,
        identityRevealed:false,
        nightCount:1,
        isMonitorHasHeal:true,
        isMonitorHasPoison:true,
        deadTonight:null,
        poisonedId:null,
        guardId:null,
        lastGuardId:null,
        gameOver:false,
        winner:null
    }

    const rolePool = [];
    for(let i=0;i<c.xiaoyu;i++) rolePool.push(ROLE.XIAOYU);
    for(let i=0;i<c.teacher;i++) rolePool.push(ROLE.TEACHER);
    for(let i=0;i<c.monitor;i++) rolePool.push(ROLE.MONITOR);
    for(let i=0;i<c.rep;i++) rolePool.push(ROLE.REP);
    for(let i=0;i<c.jiahao;i++) rolePool.push(ROLE.JIAHAO);
    for(let i=0;i<c.dafo;i++) rolePool.push(ROLE.DAFO);
    for(let i=0;i<c.student;i++) rolePool.push(ROLE.STUDENT);

    for(let i=rolePool.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [rolePool[i],rolePool[j]] = [rolePool[j],rolePool[i]];
    }
    for(let i=0;i<total;i++){
        game.players.push({
            id:i,
            name:`玩家${i+1}`,
            role:rolePool[i],
            alive:true
        })
    }
    document.getElementById("start-area").style.display="none";
    document.getElementById("game-area").style.display="block";
    renderGame();
    showIdentityView();
}

function showIdentityView(){
    game.phase = "identity";
    const idx = game.identityIndex;
    const progress = Math.min(idx + 1, game.players.length);
    document.getElementById("phase-text").innerText = `📋查看身份阶段（${progress}/${game.players.length}）`;

    if(idx >= game.players.length){
        game.phase = "night";
        document.getElementById("identity-view").innerHTML = "";
        renderGame();
        nightXiaoyuAction();
        return;
    }
    const p = game.players[idx];

    if(!game.identityRevealed){
        let html = `<div class="identity-box">
            <h3>⚠️其他人请闭眼！</h3>
            <p style="margin:16px 0;font-size:22px;">现在轮到：${p.name}</p>
            <p style="color:#aaa;font-size:14px;margin-bottom:16px;">确认周围没人偷看后，点击下方按钮</p>
            <button onclick="revealIdentity()">查看我的身份</button>
        </div>`;
        document.getElementById("identity-view").innerHTML = html;
    }else{
        let html = `<div class="identity-box">
            <h3>🔒${p.name}，你的身份是</h3>
            <div class="identity-role">${roleNameMap[p.role]}</div>
            <p style="color:#aaa;font-size:14px;margin-bottom:16px;">记住后点击下方按钮，交给下一位玩家</p>
            <button onclick="nextIdentity()">下一位玩家</button>
        </div>`;
        document.getElementById("identity-view").innerHTML = html;
    }
    document.getElementById("action-area").innerHTML = "";
    document.getElementById("player-list").innerHTML = "";
}

window.revealIdentity = function(){
    game.identityRevealed = true;
    showIdentityView();
}

window.nextIdentity = function(){
    game.identityIndex +=1;
    game.identityRevealed = false;
    showIdentityView();
}

function renderGame(){
    const phaseText = document.getElementById("phase-text");
    if(game.phase==="night"){
        document.body.classList.add("night");
        phaseText.innerText = `🌙第${game.nightCount}晚（夜晚行动）`;
    }else if(game.phase==="vote"){
        document.body.classList.remove("night");
        phaseText.innerText = `🗳️白天投票放逐阶段`;
    }else if(game.phase==="day"){
        document.body.classList.remove("night");
        phaseText.innerText = `☀️白天`;
    }
    let plHtml = "";
    game.players.forEach(p=>{
        let cls = p.alive?"player-card":"player-card dead";
        plHtml += `<div class="${cls}">${p.name}<br/>${p.alive?"✅存活":"💀已出局"}</div>`
    })
    document.getElementById("player-list").innerHTML = plHtml;
}

function getAlivePlayers(){
    return game.players.filter(p=>p.alive);
}

function nightXiaoyuAction(){
    if(game.gameOver) return;
    const alive = getAlivePlayers();
    const aliveXiaoyu = alive.filter(p=>p.role===ROLE.XIAOYU);
    if(aliveXiaoyu.length===0){
        checkWin();
        return;
    }
    const targets = alive.filter(p=>p.role!==ROLE.XIAOYU);
    if(targets.length===0){
        checkWin();
        return;
    }
    let html = `<h4>🐺小宇阵营，请选择今晚袭击的玩家</h4>`;
    targets.forEach(t=>{
        html += `<button onclick="xiaoyuKill(${t.id})">${t.name}</button>`
    })
    document.getElementById("action-area").innerHTML = html;
}

window.xiaoyuKill = function(pid){
    game.deadTonight = pid;
    nightDafoAction();
}

function nightDafoAction(){
    if(game.gameOver) return;
    const alive = getAlivePlayers();
    const dafo = alive.find(p=>p.role===ROLE.DAFO);
    if(!dafo){
        game.guardId = null;
        nightMonitorAction();
        return;
    }
    let html = `<h4>🙏大佛（守卫），请选择今晚守护的玩家</h4>`;
    html += `<div class="night-info">不能连续两晚守同一人${game.lastGuardId!==null?"（上一晚守的是："+game.players.find(x=>x.id===game.lastGuardId).name+"）":""}</div>`;
    alive.forEach(t=>{
        if(game.lastGuardId !== null && t.id === game.lastGuardId) return;
        html += `<button onclick="dafoGuard(${t.id})">${t.name}</button>`
    })
    document.getElementById("action-area").innerHTML = html;
}

window.dafoGuard = function(pid){
    game.guardId = pid;
    nightMonitorAction();
}

function nightMonitorAction(){
    if(game.gameOver) return;
    const alive = getAlivePlayers();
    const monitor = alive.find(p=>p.role===ROLE.MONITOR);
    if(!monitor){
        game.poisonedId=null;
        nightRepAction();
        return;
    }
    const victim = game.players.find(x=>x.id===game.deadTonight);
    const isGuarded = (game.guardId !== null && game.deadTonight === game.guardId);
    let html = `<h4>💊班长（女巫）行动</h4>`;
    html += `<div class="night-info">今晚被袭击：${victim?victim.name:"无人"}${isGuarded?"（已被大佛守护，无需救）":""}</div>`;
    html += `<button onclick="monitorSkip()">跳过行动</button>`;
    if(game.isMonitorHasHeal && victim && !isGuarded){
        html += `<button onclick="monitorHeal()">使用解药救${victim.name}</button>`
    }
    if(game.isMonitorHasPoison){
        html += `<br/><p style="margin-top:10px;">使用毒药毒杀：</p>`;
        alive.forEach(t=>{
            html += `<button onclick="monitorPoison(${t.id})">${t.name}</button>`
        })
    }
    document.getElementById("action-area").innerHTML = html;
}

window.monitorSkip = function(){
    game.poisonedId = null;
    nightRepAction();
}
window.monitorHeal = function(){
    game.isMonitorHasHeal = false;
    game.deadTonight = null;
    game.poisonedId = null;
    nightRepAction();
}
window.monitorPoison = function(pid){
    game.isMonitorHasPoison = false;
    game.poisonedId = pid;
    nightRepAction();
}

function nightRepAction(){
    if(game.gameOver) return;
    const alive = getAlivePlayers();
    const rep = alive.find(p=>p.role===ROLE.REP);
    if(!rep){
        endNight();
        return;
    }
    let html = `<h4>🔍科代表（预言家），选择查验一名玩家身份</h4>`;
    alive.forEach(t=>{
        if(t.id!==rep.id){
            html += `<button onclick="repCheck(${t.id})">${t.name}</button>`
        }
    })
    document.getElementById("action-area").innerHTML = html;
}

window.repCheck = function(pid){
    const target = game.players.find(x=>x.id===pid);
    const isXiaoyu = target.role === ROLE.XIAOYU;
    let html = `<div class="night-info">
        🔍科代表查验了 <b>${target.name}</b><br/>
        结果：<b style="color:${isXiaoyu?'#ff6b6b':'#6bff6b'};font-size:20px;">${isXiaoyu?"❗是小宇！":"✅不是小宇"}</b>
    </div>`;
    html += `<button onclick="endNight()">天亮了</button>`;
    document.getElementById("action-area").innerHTML = html;
}

function endNight(){
    let jiahaoNeedShoot = false;
    let nightDeathText = "";
    const isGuarded = (game.guardId !== null && game.deadTonight === game.guardId);

    if(game.deadTonight!==null){
        const victim = game.players.find(x=>x.id===game.deadTonight);
        if(isGuarded){
            nightDeathText += `${victim.name} 被大佛守护，躲过了狼刀。`;
        }else{
            victim.alive = false;
            nightDeathText += `${victim.name} 倒在了夜里。`;
            if(victim.role === ROLE.JIAHAO && game.poisonedId !== victim.id){
                jiahaoNeedShoot = true;
            }
        }
    }else{
        nightDeathText += "今晚无人被袭击。";
    }
    if(game.poisonedId !== null){
        const poisonTarget = game.players.find(x=>x.id===game.poisonedId);
        poisonTarget.alive = false;
        nightDeathText += ` ${poisonTarget.name} 被毒药毒死。`;
    }

    game.lastGuardId = game.guardId;
    game.guardId = null;
    game.deadTonight = null;

    checkWin();
    if(game.gameOver) return;
    if(jiahaoNeedShoot){
        renderGame();
        jiahaoShoot();
        return;
    }
    game.phase = "day";
    renderGame();
    let html = `<div class="night-info">☀️天亮了。${nightDeathText}</div>`;
    html += `<button onclick="startVote()">开始投票</button>`;
    document.getElementById("action-area").innerHTML = html;
}

function jiahaoShoot(){
    const alive = getAlivePlayers();
    let html = `<h4>🎯嘉豪（猎人）死亡，可以开枪带走一名存活玩家！</h4>`;
    alive.forEach(t=>{
        html += `<button onclick="jiahaoFire(${t.id})">${t.name}</button>`
    })
    document.getElementById("action-area").innerHTML = html;
}
window.jiahaoFire = function(pid){
    const target = game.players.find(x=>x.id===pid);
    target.alive = false;
    checkWin();
    if(game.gameOver) return;
    game.phase = "day";
    renderGame();
    let html = `<div class="night-info">🎯嘉豪开枪带走了 ${target.name}！</div>`;
    html += `<button onclick="startVote()">开始投票</button>`;
    document.getElementById("action-area").innerHTML = html;
}

function startVote(){
    game.phase = "vote";
    renderGame();
    const alive = getAlivePlayers();
    let html = `<h4>🗳️投票放逐：选出你怀疑是小宇的人</h4>`;
    alive.forEach(t=>{
        html += `<button onclick="voteTarget(${t.id})">${t.name}</button>`
    })
    document.getElementById("action-area").innerHTML = html;
}

window.voteTarget = function(pid){
    const target = game.players.find(x=>x.id===pid);
    target.alive = false;
    if(target.role === ROLE.JIAHAO){
        checkWin();
        if(game.gameOver) return;
        renderGame();
        jiahaoShoot();
        return;
    }
    checkWin();
    if(game.gameOver) return;
    game.nightCount++;
    game.phase = "night";
    game.poisonedId = null;
    renderGame();
    nightXiaoyuAction();
}

function checkWin(){
    const alive = getAlivePlayers();
    const aliveXiaoyu = alive.filter(p=>p.role===ROLE.XIAOYU).length;
    const aliveGood = alive.filter(p=>p.role!==ROLE.XIAOYU).length;
    if(aliveXiaoyu===0){
        game.gameOver=true;
        game.winner="good";
    }else if(aliveXiaoyu >= aliveGood){
        game.gameOver=true;
        game.winner="xiaoyu";
    }
    if(game.gameOver){
        showGameOver();
    }
}

function showGameOver(){
    let resText;
    if(game.winner==="good"){
        resText = "🎉好人阵营胜利！小宇已经被全部揪出来！";
    }else{
        resText = "💀小宇获得胜利！好人全部沦陷！";
    }
    let roleList = `<div class="role-reveal"><h4>【全部玩家身份】</h4>`;
    game.players.forEach(p=>{
        roleList += `<p>${p.name}: ${roleNameMap[p.role]} ${p.alive?"":"💀"}</p>`;
    })
    roleList += `</div>`;
    document.getElementById("action-area").innerHTML = `<h2>${resText}</h2>${roleList}<button onclick="location.reload()">重新开局</button>`;
    renderGame();
}

updatePreview();
</script>
</body>
</html>
