  };
};

G.sys.newGame = function (seed) {
  const st = G.sys.makeState();
  st.seed = seed || Math.floor(Math.random() * 1e9);
  G.state = st;
  st.map = G.world.genOverworld(st.seed);
  st.maps.over = st.map;
  st.homeMap = G.world.genInterior(1);
  st.player = G.ent.newPlayer(st.map.spawn.x, st.map.spawn.y);
  G.ent.resetPlayerStats(st.player);
  // 初始物品
  const start = [['hoe', 1], ['can', 1], ['axe', 1], ['pick', 1], ['sword', 1], ['rod', 1], ['seed_turnip', 12], ['bread', 3], ['chest', 1]];
  start.forEach(([id, n]) => { st.inv[G.sys.firstFree(st.inv)] = { id, n }; });
  st.selected = 0;
  G.sys.refreshQuests();
  G.world.reveal(st.map, st.map.spawn.x / 16, st.map.spawn.y / 16, 12);
  G.ent.buildNpcs();
  G.ent.clearEnemies();
  st.started = true;
  G.ui.hideTitle();
  G.sys.refreshLights();
  G.ui.toast('第 1 天 · 春 · 你继承了星野农庄');
  G.ui.openDialogue(G.data.dialogue.intro.map((t) => ({ speaker: '', text: t })), [], () => {
    st.flags.intro = true;
  });
  G.sys.save();
};

/* ---------------- 背包 ---------------- */
G.sys.firstFree = function (inv) { return inv.findIndex((s) => !s); };
G.sys.count = function (id) {
  return G.state.inv.reduce((sum, s) => sum + (s && s.id === id ? s.n : 0), 0);
};
G.sys.give = function (id, n = 1, silent = false) {
  const st = G.state;
  const item = G.data.items[id];
  if (!item) return false;
  if (item.stack !== 1) {
    let left = n;
    for (const s of st.inv) if (s && s.id === id && s.n < item.stack) {
      const add = Math.min(left, item.stack - s.n); s.n += add; left -= add;
      if (!left) break;
    }
    while (left > 0) {
      const slot = G.sys.firstFree(st.inv);
      if (slot < 0) break;
      const add = Math.min(left, item.stack);
      st.inv[slot] = { id, n: add }; left -= add;
    }
    if (left > 0) G.ui.toast('背包满了，' + item.name + ' ×' + left + ' 掉在地上', 'warn');
  } else {
    const slot = G.sys.firstFree(st.inv);
    if (slot < 0) { G.ui.toast('背包满了', 'warn'); return false; }
    st.inv[slot] = { id, n: 1 };
  }
  if (id.startsWith('shard') && st.story) {
    if (!st.story.shardList.includes(id)) {
      st.story.shardList.push(id);
      st.story.shards = st.story.shardList.length;
      G.ui.toast('获得 ' + item.name + '！去星之祭坛吧', 'gold');
    }
  } else if (!silent) {
    G.ui.toast('获得 ' + item.name + (n > 1 ? ' ×' + n : ''));
  }
  G.ui.refresh();
  return true;
};

G.sys.remove = function (id, n = 1) {
  const st = G.state;
  let left = n;
  for (let i = 0; i < st.inv.length && left > 0; i++) {
    const s = st.inv[i];
    if (!s || s.id !== id) continue;
    const take = Math.min(s.n, left);
    s.n -= take; left -= take;
    if (s.n <= 0) st.inv[i] = null;
  }
  G.ui.refresh();
  return left === 0;
};

G.sys.selItem = function () {
  const s = G.state.inv[G.state.selected];
  return s ? G.data.items[s.id] : null;
};
G.sys.selSlot = function () { return G.state.inv[G.state.selected]; };

/* ---------------- 时间 ---------------- */
G.time = {
  MIN_PER_SEC: 2.0,
  update(dt) {
    const st = G.state;
    if (!st.started || st.paused) return;
    st.minute += dt * this.MIN_PER_SEC;
    if (st.minute >= 26 * 60) { st.minute = 26 * 60; G.sys.passOut(); }
  },
  hour() { return G.state.minute / 60; },
  isNight() { const h = this.hour(); return h < 6.5 || h >= 19; },
  isDark() { const h = this.hour(); return h < 6 || h >= 19.5; },
  str() {
    const m = Math.floor(G.state.minute);
    return G.pad(Math.floor(m / 60) % 24) + ':' + G.pad(m % 60);
  },
  lightAlpha() {
    const h = this.hour();
    if (h >= 7 && h <= 17) return 0;
    if (h >= 18 && h < 20) return (h - 18) / 2 * 0.66;
    if (h >= 20 || h < 4) return 0.66;
    if (h >= 4 && h < 6) return 0.66 * (1 - (h - 4) / 2);
    return 0;
  },
};

/* 季节与天气 */
G.time.seasonData = () => G.data.seasons[G.state.season];
G.time.dayOfSeason = () => ((G.state.day - 1) % G.sys.SEASON_DAYS) + 1;

G.sys.rollWeather = function () {
  const st = G.state;
  const season = G.data.seasons[st.season].id;
  const r = Math.random();
  if (season === 'winter') {
    if (r < 0.45) return 'snow';
    if (r < 0.7) return 'cloudy';
    if (r < 0.85) return 'fog';
    return 'sunny';
  }
  if (season === 'spring') {
    if (r < 0.32) return 'rain';
    if (r < 0.6) return 'cloudy';
    return 'sunny';
  }
  if (season === 'summer') {
    if (r < 0.18) return 'storm';
    if (r < 0.38) return 'rain';
    if (r < 0.55) return 'cloudy';
    return 'sunny';
  }
  if (r < 0.3) return 'rain';
  if (r < 0.65) return 'cloudy';
  if (r < 0.8) return 'fog';
  return 'sunny';
};

/* ---------------- 农耕 ---------------- */
G.sys.cropStage = function (plot) {
  if (!plot || !plot.crop) return 0;
  const crop = G.data.crops[plot.crop];
  const grow = crop.grow;
  const t = [0, Math.ceil(grow / 3), Math.ceil(grow * 2 / 3), grow];
  let stage = 0;
  for (let i = 1; i < t.length; i++) if (plot.growth >= t[i]) stage = i;
  return stage;
};

G.sys.isRipe = function (plot) { return plot && plot.crop && G.sys.cropStage(plot) >= 3; };

G.sys.till = function (tx, ty) {
  const st = G.state, p = st.player;
  if (!G.world.canTill(st.map, tx, ty)) { G.ui.toast('这里开垦不了', 'warn'); return false; }
  if (p.stamina < 5) { G.ui.toast('太累了，先吃点东西', 'warn'); G.audio.play('error'); return false; }
  const idx = ty * st.map.w + tx;
  if (st.map.farm.get(idx)) { G.ui.toast('这块地已经开垦过了'); return false; }
  st.map.farm.set(idx, { tilled: true, wet: false, growth: 0, crop: null, regrow: 0 });
  p.stamina -= 5;
  p.actionLock = 0.18;
  G.audio.play('till');
  G.fx.burst(tx * 16 + 8, ty * 16 + 12, '#6b4a2f', 5);
  G.ui.refresh();
  G.sys.tutorial('till');
  return true;
};

G.sys.water = function (tx, ty) {
  const st = G.state, p = st.player;
  if (p.stamina < 4) { G.ui.toast('太累了', 'warn'); return false; }
  const plots = [];
  const wide = st.perks.fastWater;
  for (let dy = wide ? -1 : 0; dy <= (wide ? 1 : 0); dy++) for (let dx = wide ? -1 : 0; dx <= (wide ? 1 : 0); dx++) {
    const plot = G.world.farmAt(st.map, tx + dx, ty + dy);
    if (plot && plot.tilled) plots.push(plot);
  }
  if (!plots.length) { G.ui.toast('这里没有耕地', 'warn'); return false; }
  plots.forEach((pl) => { pl.wet = true; });
  p.stamina -= 4 * (plots.length > 1 ? 0.5 : 1);
  G.audio.play('water');
  G.fx.burst(tx * 16 + 8, ty * 16 + 10, '#7fc4e8', 6);
  G.sys.tutorial('water');
  G.ui.refresh();
  return true;
};

G.sys.plant = function (tx, ty, itemId) {
  const st = G.state;
  const plot = G.world.farmAt(st.map, tx, ty);
  const item = G.data.items[itemId];
  if (!plot || !plot.tilled) { G.ui.toast('要先开垦这块地', 'warn'); return false; }
  if (plot.crop) { G.ui.toast('这里已经种着作物了', 'warn'); return false; }
  const crop = G.data.crops[item.crop];
  if (!crop) return false;
  const seasonId = G.data.seasons[st.season].id;
  if (!crop.seasons.includes(seasonId)) G.ui.toast(crop.name + '不适合在' + G.data.seasons[st.season].name + '天种植，可能不会长大', 'warn');
  plot.crop = crop.id; plot.growth = 0; plot.regrow = 0;
  G.sys.remove(itemId, 1);
  G.audio.play('plant');
  G.fx.burst(tx * 16 + 8, ty * 16 + 13, '#7fb45a', 5);
  G.sys.tutorial('plant');
  G.ui.refresh();
  return true;
};

G.sys.harvest = function (tx, ty) {
  const st = G.state;
  const plot = G.world.farmAt(st.map, tx, ty);
  if (!plot || !plot.crop) return false;
  if (!G.sys.isRipe(plot)) { G.ui.toast('还没成熟呢'); return false; }
  const crop = G.data.crops[plot.crop];
  let yieldN = crop.yield[0] + Math.floor(Math.random() * (crop.yield[1] - crop.yield[0] + 1));
  if (st.perks.greenThumb && Math.random() < 0.25) yieldN++;
  const itemId = crop.icon;
  G.sys.give(itemId, yieldN, true);
  G.ui.toast('收获 ' + crop.name + ' ×' + yieldN);
  G.audio.play('harvest');
  G.fx.burst(tx * 16 + 8, ty * 16 + 8, '#e8c07a', 8);
  st.stats.harvests++;
  st.quests.harvested++;
  G.sys.gainXp(6);
  G.sys.tutorial('harvest');
  if (crop.regrow) {
    plot.growth = Math.max(0, crop.grow - crop.regrow);
    plot.wet = false;
  } else {
    plot.crop = null; plot.growth = 0;
  }
  G.ui.refresh();
  return true;
};

/* ---------------- 动作 ---------------- */
G.sys.targetTile = function () {
  const st = G.state;
  const m = st.mouseWorld;
  if (m && !G.input.touch.active) {
    const tx = Math.floor(m.x / 16), ty = Math.floor(m.y / 16);
    const p = st.player;
    if (Math.hypot(tx * 16 + 8 - p.x, ty * 16 + 8 - p.y) < 112) return { tx, ty, fromMouse: true };
  }
  const p = st.player;
  let fx = p.face.x, fy = p.face.y;
  if (!fx && !fy) fy = 1;
  const d = st.selected !== null && G.sys.selItem() && G.sys.selItem().tool === 'axe' ? 1.0 : 1.0;
  return { tx: Math.floor((p.x + fx * 14 * d) / 16), ty: Math.floor((p.y + fy * 14 * d) / 16), fromMouse: false };
};

G.sys.primaryAction = function () {
  const st = G.state;
  if (!st.started || G.ui.isModalOpen()) return;
  if (st.fishing) { G.sys.fishClick(); return; }
  const p = st.player, slot = G.sys.selSlot(), item = slot ? G.data.items[slot.id] : null;
  if (p.dead) return;
  if (p.atkCd > 0) return;
  const t = G.sys.targetTile();
  p.face.x = t.tx * 16 + 8 - p.x > 6 ? 1 : t.tx * 16 + 8 - p.x < -6 ? -1 : p.face.x;
  p.face.y = t.ty * 16 + 8 - p.y > 6 ? 1 : t.ty * 16 + 8 - p.y < -6 ? -1 : p.face.y;
  if (Math.abs(t.tx * 16 + 8 - p.x) > Math.abs(t.ty * 16 + 8 - p.y)) { p.dir = t.tx * 16 + 8 > p.x ? 'right' : 'left'; p.face = { x: p.dir === 'right' ? 1 : -1, y: 0 }; }
  else { p.dir = t.ty * 16 + 8 > p.y ? 'down' : 'up'; p.face = { x: 0, y: p.dir === 'down' ? 1 : -1 }; }

  if (!item) { G.sys.swing([], 3); return; }

  if (item.tool === 'sword') {
    G.sys.swingAttack();
    return;
  }
  if (item.tool === 'hoe') {
    if (p.useCd > 0) return;
    p.useCd = 0.28;
    G.sys.till(t.tx, t.ty);
    G.sys.swing([], 0);
    return;
  }
  if (item.tool === 'can') {
    if (p.useCd > 0) return;
    p.useCd = 0.25;
    G.sys.water(t.tx, t.ty);
    G.sys.swing([], 0);
    return;
  }
  if (item.tool === 'axe' || item.tool === 'pick') {
    if (p.useCd > 0) return;
    p.useCd = 0.28;
    const o = G.sys.findObjForTool(t.tx, t.ty, item.tool);
    if (o) G.sys.hitObject(o, item.tool);
    else G.sys.swing([], 0);
    return;
  }
  if (item.tool === 'rod') {
    G.sys.tryFish(t.tx, t.ty);
    return;
  }
  if (item.cat === 'seed') {
    if (p.useCd > 0) return;
    p.useCd = 0.3;
    G.sys.plant(t.tx, t.ty, item.id);
    return;
  }
  if (item.cat === 'place') {
    if (p.useCd > 0) return;
    p.useCd = 0.3;
    G.sys.placeItem(item, t.tx, t.ty);
    return;
  }
  if (item.cat === 'food') { G.sys.eat(item.id); return; }
  // 空挥
  G.sys.swingAttack(4);
};

/* 纯动作挥动（工具使用时播放，不造成伤害） */
G.sys.swing = function (tiles, kind) {
  const p = G.state.player;
  p.swing = 0.22;
  const fx = p.face.x || (p.dir === 'right' ? 1 : p.dir === 'left' ? -1 : 0);
  const fy = p.face.y || (p.dir === 'down' ? 1 : p.dir === 'up' ? -1 : 0);
  p.swingAng = Math.atan2(fy, fx || 0.001);
  G.audio.play('swing');
};

G.sys.swingAttack = function (dmgBase) {
  const st = G.state, p = st.player;
  if (p.atkCd > 0) return;
  const item = G.sys.selItem();
  const atk = dmgBase || (item && item.atk) || 4;
  p.atkCd = item && item.tool === 'sword' ? 0.42 : 0.5;
  p.swing = 0.22;
  const fx = p.face.x || (p.dir === 'right' ? 1 : p.dir === 'left' ? -1 : 0);
  const fy = p.face.y || (p.dir === 'down' ? 1 : p.dir === 'up' ? -1 : 0);
  p.swingAng = Math.atan2(fy, fx || 0.001);
  G.audio.play('swing');
  if (p.stamina > 3) p.stamina -= 2.5;
  G.fx.slash ? G.fx.slash(p.x, p.y, p.swingAng) : null;
  let hitAny = false;
  G.ent.enemies.forEach((e) => {
    const dx = e.x - p.x, dy = (e.y - 8) - (p.y - 8);
    const d = Math.hypot(dx, dy);
    if (d > 34 + e.radius) return;
    const dot = (dx * fx + dy * fy) / (d || 1);
    if (dot < 0.2 && d > 22) return;
    const critChance = 0.08 + 0.12 * (st.perks.crit || 0);
    const crit = Math.random() < critChance;
    let dmg = atk * (1 + 0.18 * (st.perks.warrior || 0)) * (st.perks.starBlessed ? 1.15 : 1);
    dmg = Math.round(dmg * (crit ? 2 : 1) * (0.95 + Math.random() * 0.1));
    const kx = (dx / (d || 1)) * 12, ky = (dy / (d || 1)) * 12;
    G.ent.damageEnemy(e, dmg, kx, ky, crit);
    hitAny = true;
  });
  // 割草/灌木
  const t = G.sys.targetTile();
  const o = G.world.objAt(st.map, t.tx, t.ty);
  if (o && (o.type === 'bush') && dmgBase) { /* 剑砍灌木 */ }
  return hitAny;
};

G.sys.findObjForTool = function (tx, ty, tool) {
  const st = G.state;
  const p = st.player;
  let best = null, bd = 40;
  for (const o of st.map.objs) {
    if (!o.def.tool || o.def.tool !== tool) continue;
    const d = Math.hypot(o.x - p.x, (o.y - 8) - p.y);
    const td = Math.hypot(o.tx * 16 + 8 - (tx * 16 + 8), o.ty * 16 + 8 - (ty * 16 + 8));
    if (td < 20 && d < 48) {
      if (d < bd) { bd = d; best = o; }
    }
  }
  return best;
};

G.sys.hitObject = function (o, tool) {
  const st = G.state, p = st.player;
  const power = (tool === 'axe' ? (G.sys.hasTool('axe2') ? 2 : 1) : 1) + 0;
  if (o.type === 'bush') return G.sys.harvestBush(o);
  o.hp -= power;
  G.audio.play(tool === 'axe' ? 'chop' : 'mine');
  G.fx.burst(o.x, o.y - 14, tool === 'axe' ? '#8a5f3c' : '#9a958f', 6);
  st.player.stamina = Math.max(0, st.player.stamina - (tool === 'axe' ? 6 : 8));
  if (o.hp > 0) { G.fx.shake = 2; return; }
  G.sys.dropObjectLoot(o);
  G.world.removeObj(st.map, o);
  G.fx.shake = 4;
  G.ui.refresh();
};

G.sys.hasTool = function (id) { return G.sys.count(id) > 0 || G.state.inv.some((s) => s && s.id === id); };

G.sys.dropObjectLoot = function (o) {
  const st = G.state;
  const rnd = G.rand;
  if (o.type === 'tree' || o.type === 'pine') {
    let n = 2 + Math.floor(Math.random() * 3) + (o.type === 'pine' ? 0 : 0);
    if (st.perks.lumber) n++;
    G.fx.dropItem(o.x, o.y - 10, 'wood', n);
    if (Math.random() < 0.4) G.fx.dropItem(o.x, o.y - 6, 'fiber', 1);
    if (st.perks.forager && Math.random() < 0.5) G.fx.dropItem(o.x, o.y - 4, 'fiber', 1);
    st.stats.wood += n;
  } else if (o.type === 'stump' || o.type === 'crate') {
    G.fx.dropItem(o.x, o.y - 8, 'wood', 2);
  } else if (o.type === 'rock') {
    G.fx.dropItem(o.x, o.y - 8, 'stone', 2 + Math.floor(Math.random() * 2) + (st.perks.miner ? 1 : 0));
    if (Math.random() < 0.18) G.fx.dropItem(o.x, o.y - 4, 'coal', 1);
    st.stats.mined++;
  } else if (o.type === 'ore') {
    const type = o.ore || 'copper';
    let n = 1 + Math.floor(Math.random() * 2) + (st.perks.miner && Math.random() < 0.5 ? 1 : 0);
    G.fx.dropItem(o.x, o.y - 8, type, n);
    if (Math.random() < 0.25) G.fx.dropItem(o.x, o.y - 4, 'stone', 1);
    st.stats.mined++;
    G.sys.gainXp(4);
  } else if (o.type === 'cactus') {
    G.fx.dropItem(o.x, o.y - 8, 'fiber', 3);
  }
};

G.sys.placeItem = function (item, tx, ty) {
  const st = G.state, p = st.player;
  const map = st.map;
  const objType = item.place;
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return false;
  const g = G.world.tileGround(map, tx, ty);
  if (g === G.world.GT.WATER || g === G.world.GT.WALL || g === G.world.GT.ROCK) { G.ui.toast('这里放不下', 'warn'); return false; }
  if (G.world.isSolid(map, tx, ty) || G.world.objAt(map, tx, ty)) { G.ui.toast('这里被占住了', 'warn'); return false; }
  if (map.farm.get(ty * map.w + tx) && !map.farm.get(ty * map.w + tx).crop) { /* 允许覆盖耕地？不允许 */ G.ui.toast('别放在耕地上', 'warn'); return false; }
  if (Math.hypot(tx * 16 + 8 - p.x, ty * 16 + 8 - p.y) > 60) { G.ui.toast('太远了', 'warn'); return false; }
  G.world.addObj(map, objType, tx, ty, {});
  G.sys.remove(item.id, 1);
  G.sys.refreshLights();
  G.audio.play('plant');
  G.fx.dust(tx * 16 + 8, ty * 16 + 12);
  G.ui.refresh();
  return true;
};

/* ---------------- 交互 ---------------- */
G.sys.interact = function () {
  const st = G.state, p = st.player;
  if (!st.started || G.ui.isModalOpen() || st.fishing) return;
  // 先看脚下耕地
  const t = G.sys.targetTile();
  const plot = G.world.farmAt(st.map, t.tx, t.ty);
  if (plot && plot.crop && G.sys.isRipe(plot)) { G.sys.harvest(t.tx, t.ty); return; }
  // 附近的 NPC
  const npc = G.ent.npcs.find((n) => !n.hidden && Math.hypot(n.x - p.x, n.y - p.y) < 42);
  if (npc) { G.sys.talkTo(npc.id); return; }
  // 附近物件
  const o = G.sys.findInteractable();
  if (o) { G.sys.useObject(o); return; }
  G.ui.toast('这里没有什么可以互动的');
};

G.sys.findInteractable = function () {
  const st = G.state, p = st.player;
  let best = null, bd = 46;
  for (const o of st.map.objs) {
    if (!o.def.interact) continue;
    const d = Math.hypot(o.x - p.x, (o.y - 10) - p.y);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
};

G.sys.useObject = function (o) {
  const st = G.state;
  switch (o.type) {
    case 'house':
      if (o.door === false) return;
      G.sys.enterHome(); break;
    case 'hut':
      G.ui.openDialogue([{ speaker: '屋内', text: '门锁着。窗台上有一盆开得正好的花。' }]); break;
    case 'shopStall':
      G.ui.openShop(); break;
    case 'chest': G.sys.openChest(o); break;
    case 'bed': G.ui.confirmSleep(); break;
    case 'kitchen': G.ui.openCraft('home'); break;
    case 'campfire': G.ui.openCraft('campfire'); break;
    case 'workbench': G.ui.openCraft('workbench'); break;
    case 'shrine': G.sys.useShrine(o); break;
    case 'entrance': G.sys.enterDungeon(1); break;
    case 'stairsDown': G.sys.enterDungeon((st.map.floor || 1) + 1); break;
    case 'stairsUp':
      if (st.map.dungeon) {
        if (st.map.floor > 1 && st.map.floor < 8) G.sys.enterDungeon(st.map.floor - 1);
        else G.sys.exitDungeon();
      }
      break;
    case 'sign': G.ui.openDialogue([{ speaker: '', text: o.text || '木牌上的字被雨水冲淡了。' }]); break;
    case 'bush': G.sys.harvestBush(o); break;
    case 'mushroom': case 'forage':
      if (o.ready === false) { G.ui.toast('这里已经被采过了'); break; }
      G.sys.give(o.item || 'berry', 1 + (G.state.perks.forager ? 1 : 0), true);
      G.ui.toast('采到 ' + G.data.items[o.item || 'berry'].name);
      G.audio.play('pickup');
      G.world.removeObj(st.map, o);
      G.sys.gainXp(2); break;
    case 'sprinkler': G.ui.toast('洒水器：每天清晨会自动浇灌周围的耕地'); break;
    case 'scarecrow': G.ui.toast('稻草人盯着田野，乌鸦不敢落下'); break;
    case 'well': G.ui.toast('井水冰凉。你洗了把脸，精神了一点。'); st.player.stamina = Math.min(st.player.maxStamina, st.player.stamina + 6); break;
    case 'door':
      if (o.exit) G.sys.exitHome();
      break;
    case 'flower': {
      G.sys.give('moonflower', 1, true);
      G.ui.toast('你摘下一朵花');
      G.world.removeObj(st.map, o);
      break;
    }
    default: G.ui.toast('没什么特别的');
  }
};

G.sys.harvestBush = function (o) {
  if (o.ready === false) { G.ui.toast('浆果还没长出来'); return; }
  const n = 1 + (G.state.perks.forager ? 1 : 0) + (Math.random() < 0.3 ? 1 : 0);
  G.sys.give('berry', n, true);
  G.ui.toast('采到野莓 ×' + n);
  o.ready = false; o.regrowDay = G.state.day + 2;
  G.audio.play('harvest');
  G.sys.gainXp(3);
};

G.sys.openChest = function (o) {
  const st = G.state;
  if (o.opened) { G.ui.toast('箱子已经空了'); return; }
  o.opened = true;
  let loot = o.loot;
  if (!loot) {
    loot = [{ id: 'wood', n: 3 }, { id: 'copper', n: 1 }];
    if (Math.random() < 0.2) loot.push({ id: 'salve', n: 1 });
  }
  if (o.special && st.story) { }
  const names = [];
  loot.forEach((l) => {
    if (l.id && G.data.items[l.id]) {
      G.sys.give(l.id, l.n, true);
      names.push(G.data.items[l.id].name + ' ×' + l.n);
    }
  });
  G.audio.play('coin');
  G.fx.burst(o.x, o.y - 10, '#f2c14e', 12);
  G.ui.openDialogue([{ speaker: '箱子', text: '里面装着：' + (names.join('、') || '一些尘土') }]);
  G.sys.gainXp(6);
  G.ui.refresh();
};

G.sys.useShrine = function (o) {
  const st = G.state;
  if (st.story.restored) {
    G.ui.openDialogue([{ speaker: '星之祭坛', text: '祭坛安静地亮着。田野的风穿过石缝，像有人在轻声呼吸。' }]);
    return;
  }
  if (st.story.shards >= 3) {
    st.story.restored = true;
    st.story.shardList = [];
    st.perks.starBlessed = 1;
    st.player.maxHp += 30; st.player.maxStamina += 30;
    st.player.hp = st.player.maxHp; st.player.stamina = st.player.maxStamina;
    G.audio.play('bell');
    G.fx.burst(o.x, o.y - 20, '#8fe6ff', 30);
    G.ui.showEnding();
    G.sys.save();
    return;
  }
  G.ui.openDialogue([
    { speaker: '星之祭坛', text: '石台上有三个凹槽。你把收集到的碎片放上去——还差 ' + (3 - st.story.shards) + ' 块。' },
    { speaker: '星之祭坛', text: '风之碎片沉睡在裂谷之底，土之碎片埋在沙丘旧城，心之碎片落在雪线之上。' },
  ]);
};

/* ---------------- NPC / 社交 ---------------- */
G.sys.affectionAdd = function (id, n) {
  const st = G.state;
  const npcCfg = G.data.npcs[id];
  const gain = Math.round(n * (1 + 0.5 * (st.perks.charisma ? 1 : 0)));
  st.npcs[id].affection = G.clamp(st.npcs[id].affection + gain, 0, 100);
  if (n > 0) G.fx.float(st.player.x, st.player.y - 26, '+' + gain + ' 好感', '#ff9ecb');
};

G.sys.talkTo = function (id) {
  const st = G.state, cfg = G.data.npcs[id], rel = st.npcs[id];
  const d = G.data.dialogue[id] || {};
  let lines = [];
  const married = st.family.married && id === 'leah';
  if (id === 'leah') {
    if (married) lines = d.married.slice();
    else if (rel.affection >= 70) lines = d.close.slice();
    else if (rel.affection >= 30) lines = d.friend.slice();
    else lines = d.stranger.slice();
  } else {
    if (rel.affection >= 60) lines = (d.close || d.friend || d.stranger).slice();
    else if (rel.affection >= 25) lines = (d.friend || d.stranger).slice();
    else lines = (d.stranger || ['……']).slice();
  }
  const first = !rel.met;
  rel.met = true;
  if (!rel.talked) {
    rel.talked = true;
    G.sys.affectionAdd(id, 3);
    G.sys.gainXp(3, true);
  }
  if (st.quests.talkedToday === undefined) st.quests.talkedToday = 0;
  st.quests.talkedToday++;
  const options = [];
  if (id === 'leah' && !married && rel.affection >= 70 && st.family.houseLevel >= 2 && st.gold >= 1000) {
    options.push({ label: '向她求婚（1000 金）', action: () => G.sys.marry() });
  }
  if (!married && rel.affection >= 60 && !st.family.married) {
    options.push({ label: '送一份礼物', action: () => G.ui.openGift(id) });
  } else if (!st.npcs[id].gifted) {
    options.push({ label: '送一份礼物', action: () => G.ui.openGift(id) });
  }
  if (id === 'chen') options.push({ label: '打开商店', action: () => G.ui.openShop() });
  G.ui.openDialogue(lines.map((t) => ({ speaker: cfg.name, text: t })), options);
  if (first) G.sys.gainXp(5, true);
  G.sys.tutorial('talk');
};

G.sys.gift = function (npcId, itemId) {
  const st = G.state, cfg = G.data.npcs[npcId], rel = st.npcs[npcId];
  if (rel.gifted) { G.ui.toast('今天已经送过礼物了', 'warn'); return; }
  if (!G.sys.count(itemId)) return;
  G.sys.remove(itemId, 1);
  rel.gifted = true;
  st.stats.gifts++;
  const love = (cfg.favorite || []).includes(itemId);
  const like = (cfg.like || []).includes(itemId);
  const item = G.data.items[itemId];
  G.sys.affectionAdd(npcId, love ? 15 : like ? 8 : 3);
  G.audio.play('coin');
  const lines = love ? (G.data.dialogue[npcId].giftLove || ['……谢谢，我很喜欢。']) : like ? (G.data.dialogue[npcId].giftLike || ['谢谢。']) : (G.data.dialogue[npcId].giftMeh || ['谢谢。']);
  G.ui.openDialogue([{ speaker: cfg.name, text: G.pick(lines) + '（' + item.name + '）' }]);
  G.ui.closePanel();
};

G.sys.marry = function () {
  const st = G.state;
  if (st.family.married) return;
  if (st.gold < 1000) { G.ui.toast('金币不够', 'warn'); return; }
  st.gold -= 1000;
  st.family.married = true;
  st.family.loveDays = 0;
  st.family.mood = 100;
  st.npcs.leah.affection = Math.max(90, st.npcs.leah.affection);
  G.ent.buildNpcs();
  G.audio.play('bell');
  G.fx.burst(st.player.x, st.player.y - 20, '#ff9ecb', 26);
  G.ui.openDialogue([
    { speaker: '莉娅', text: G.pick(G.data.dialogue.leah.marry) },
    { speaker: '你们', text: '小屋的灯亮到很晚。从今天起，农场有了第二个人的脚步声。' },
    { speaker: '提示', text: '莉娅会每天清晨帮你浇水。记得在晚餐时留一份食物——家里会饿的。' },
  ]);
  G.sys.save();
};

G.sys.upgradeHouse = function () {
  const st = G.state;
  const lv = st.family.houseLevel;
  if (lv >= 3) { G.ui.toast('房子已经是庄园了'); return; }
  const cost = lv === 1 ? { wood: 30, stone: 20, gold: 1200 } : { wood: 60, stone: 45, gold: 3000 };
  if (st.gold < cost.gold || G.sys.count('wood') < cost.wood || G.sys.count('stone') < cost.stone) {
    G.ui.toast('材料不够：需要 木材 ' + cost.wood + ' / 石头 ' + cost.stone + ' / ' + cost.gold + ' 金', 'warn');
    return;
  }
  st.gold -= cost.gold;
  G.sys.remove('wood', cost.wood); G.sys.remove('stone', cost.stone);
  st.family.houseLevel++;
  st.homeMap = G.world.genInterior(st.family.houseLevel);
  const home = st.maps.over.objs.find((o) => o.type === 'house');
  if (home) home.level = st.family.houseLevel;
  G.audio.play('level');
  G.ui.toast('房子升级到 ' + (lv + 1) + ' 级！', 'gold');
  G.sys.save();
};

/* ---------------- 钓鱼 ---------------- */
G.sys.tryFish = function (tx, ty) {
  const st = G.state, p = st.player;
  const g = G.world.tileGround(st.map, tx, ty);
  if (g !== G.world.GT.WATER) { G.ui.toast('要对着水面钓鱼', 'warn'); return false; }
  if (p.stamina < 8) { G.ui.toast('太累了，甩不动竿', 'warn'); return false; }
  p.stamina -= 8;
  const night = G.time.isNight();
  const luck = st.perks.fisher ? 12 : 0;
  st.fishing = { t: 0, dur: 2.2, pos: 0, dir: 1, zone: 0.36 - luck / 100, width: 0.22 + luck / 100, done: false, caught: false };
  G.audio.play('splash');
  G.ui.toast('浮标落水了…');
  return true;
};

G.sys.updateFishing = function (dt) {
  const st = G.state;
  if (!st.fishing) return;
  const f = st.fishing;
  f.t += dt;
  f.zone = 0.42 + Math.sin(f.t * 1.4) * 0.22;
  if (!f.done) {
    f.pos += f.dir * dt * 1.35;
    if (f.pos > 1) { f.pos = 1; f.dir = -1; }
    if (f.pos < 0) { f.pos = 0; f.dir = 1; }
  }
};

G.sys.fishClick = function () {
  const st = G.state, f = st.fishing;
  if (!f || f.done) return;
  f.done = true;
  const inZone = Math.abs(f.pos - f.zone) < f.width;
  const near = Math.abs(f.pos - f.zone) < f.width + 0.08;
  if (inZone) {
    f.caught = true;
    const night = G.time.isNight();
    const table = night ? [['eel', 0.35], ['trout', 0.4], ['fish', 0.25]] : [['fish', 0.6], ['trout', 0.32], ['eel', 0.08]];
    let r = Math.random(), id = 'fish';
    for (const [fid, p] of table) { if (r < p) { id = fid; break; } r -= p; }
    G.sys.give(id, 1, true);
    st.stats.fish++;
    st.quests.fished++;
    G.ui.toast('钓到了 ' + G.data.items[id].name + '！', 'gold');
    G.audio.play('harvest');
    G.sys.gainXp(8);
    G.sys.tutorial('fish');
  } else if (near) {
    G.ui.toast('差一点，鱼跑了');
    G.audio.play('splash');
  } else {
    G.ui.toast('什么都没钓到');
    G.audio.play('splash');
  }
  setTimeout(() => { st.fishing = null; G.ui.refresh(); }, 900);
};

/* ---------------- 吃 ---------------- */
G.sys.eat = function (id) {
  const st = G.state, p = st.player, item = G.data.items[id];
  if (!item || item.cat !== 'food') return;
  if (!G.sys.count(id)) return;
  if (p.hp >= p.maxHp && p.hunger > 92 && p.stamina > p.maxStamina - 5) { G.ui.toast('现在不饿'); return; }
  G.sys.remove(id, 1);
  const mul = 1 + 0.35 * (st.perks.glutton ? 1 : 0);
  p.hunger = Math.min(100, p.hunger + (item.hunger || 8) * mul);
  if (item.hp) p.hp = Math.min(p.maxHp, p.hp + item.hp * mul);
  if (item.energy) p.stamina = Math.min(p.maxStamina, p.stamina + item.energy * mul);
  G.audio.play('eat');
  G.fx.float(p.x, p.y - 22, '+' + Math.round((item.hunger || 8) * mul) + ' 饱食', '#8fd18a');
  G.fx.heart ? null : null;
  G.ui.refresh();
};

/* ---------------- 等级 / 天赋 ---------------- */
G.sys.gainXp = function (n, silent = false) {
  const st = G.state;
  st.xp += n;
  if (!silent) G.fx.float(st.player.x, st.player.y - 30, '+' + n + ' XP', '#8fe6ff');
  while (st.xp >= st.xpNeed) {
    st.xp -= st.xpNeed;
    st.level++;
    st.xpNeed = Math.round(st.xpNeed * 1.35);
    st.perkPoints++;
    st.pendingPerks.push(1);
    st.player.maxHp += 3;
    st.player.hp = Math.min(st.player.maxHp, st.player.hp + 5);
    G.audio.play('level');
    G.ui.toast('升到 ' + st.level + ' 级！选择一项天赋', 'gold');
    G.ui.openPerks();
  }
  G.ui.refresh();
};

G.sys.learnPerk = function (id) {
  const st = G.state;
  const def = G.data.perkById[id];
  if (!def) return;
  if (st.perkPoints <= 0) return;
  st.perkPoints--;
  st.pendingPerks.pop();
  st.perks[id] = (st.perks[id] || 0) + 1;
  if (id === 'stamina') { st.player.maxStamina += 20; st.player.stamina = st.player.maxStamina; }
  if (id === 'starBlessed') { st.player.maxHp += 30; st.player.maxStamina += 30; }
  G.audio.play('level');
  G.ui.toast('学会天赋：' + def.name, 'gold');
  G.ui.refresh();
  G.ui.closePanel();
  if (st.pendingPerks.length) setTimeout(() => G.ui.openPerks(), 400);
};

/* ---------------- 任务 ---------------- */
G.sys.refreshQuests = function () {
  const st = G.state;
  const q = st.quests;
  while (q.list.length < 3) {
    const pool = G.data.questPool.filter((t) => !q.list.some((a) => a.template === t.type + '_' + (t.item || t.target || t.n)));
    const t = pool.length ? G.pick(pool) : G.pick(G.data.questPool);
    const quest = Object.assign({}, t, {
      id: 'q' + (q.nextId++), template: t.type + '_' + (t.item || t.target || t.n), progress: 0, claimed: false,
    });
    if (t.type === 'deliver') quest.progress = 0;
    q.list.push(quest);
  }
};

G.sys.questProgress = function (quest) {
  const st = G.state;
  switch (quest.type) {
    case 'kill': return st.quests.kills[quest.target] || 0;
    case 'deliver': case 'gather': return G.sys.count(quest.item);
    case 'fish': return st.quests.fished;
    case 'harvest': return st.quests.harvested;
    default: return 0;
  }
};

G.sys.claimQuest = function (quest) {
  const st = G.state;
  const prog = G.sys.questProgress(quest);
  if (prog < quest.n) { G.ui.toast('还没完成呢', 'warn'); return; }
  if (quest.type === 'deliver') {
    if (!G.sys.remove(quest.item, quest.n)) { G.ui.toast('材料不足', 'warn'); return; }
  }
  st.gold += quest.gold;
  G.sys.gainXp(quest.xp);
  st.stats.questsDone++;
  st.quests.goldEarned += quest.gold;
  quest.claimed = true;
  st.quests.list = st.quests.list.filter((q) => q !== quest);
  G.sys.refreshQuests();
  G.audio.play('coin');
  G.ui.toast('任务完成：+' + quest.gold + ' 金，+' + quest.xp + ' XP', 'gold');
  G.ui.refresh();
};

/* ---------------- 教程 ---------------- */
G.sys.tutorialSteps = [
  { key: 'till', text: '用锄头开垦一块土地（靠近屋前的菜畦）' },
  { key: 'plant', text: '选中芜菁种子，点在耕地上播种' },
  { key: 'water', text: '浇水壶给种下的作物浇水' },
  { key: 'sleep', text: '回到屋里，在床边按 E 睡一觉' },
  { key: 'harvest', text: '第二天，收获成熟的芜菁' },
  { key: 'talk', text: '和莉娅聊聊天（她住在农舍东边的小屋）' },
  { key: 'kill', text: '夜里或野外遇到怪物，用剑击败一只' },
];
G.sys.tutorial = function (key) {

    G.ui.toast('✓ ' + G.sys.tutorialSteps[st.tutorial.step].text);
  }

/* ---------------- 天数推进 ---------------- */
G.sys.sleep = function () {
  const st = G.state;
  if (st.player.dead) return;
  G.ui.closePanel();
  st.fade = 1;
  setTimeout(() => {
    G.sys.advanceDay(true);
    st.fade = 0;
  }, 380);
};

G.sys.passOut = function () {
  const st = G.state;
  if (st.passOuting) return;
  st.passOuting = true;
  G.ui.toast('你撑不住，在野外睡着了……', 'warn');
  setTimeout(() => {
    const lost = Math.floor(st.gold * 0.1);
    st.gold -= lost;
    st.player.hunger = Math.max(0, st.player.hunger - 20);
    G.sys.advanceDay(false);
    st.passOuting = false;
    if (lost) G.ui.toast('醒来发现丢了 ' + lost + ' 金', 'warn');
  }, 500);
};

G.sys.advanceDay = function (slept) {
  const st = G.state;
  const farmMap = st.maps.over || st.map;
  st.stats.days++;
  st.day++;
  if ((st.day - 1) % G.sys.SEASON_DAYS === 0) {
    st.season = (st.season + 1) % 4;
    if (st.season === 0) st.year++;
    G.ui.toast('季节更替：' + G.data.seasons[st.season].name + '天到了');
    // 非当季作物枯萎
    farmMap.farm.forEach((plot) => {
      if (!plot.crop) return;
      const crop = G.data.crops[plot.crop];
      const seasonId = G.data.seasons[st.season].id;
      if (!crop.seasons.includes(seasonId)) { plot.crop = null; plot.growth = 0; }
    });
  }
  // 作物生长
  const seasonId = G.data.seasons[st.season].id;
  farmMap.farm.forEach((plot) => {
    if (plot.crop) {
      const crop = G.data.crops[plot.crop];
      if (crop.seasons.includes(seasonId) && (plot.wet || st.weather === 'rain' || st.weather === 'storm' || st.weather === 'snow')) {
        if (plot.growth < crop.grow) plot.growth++;
      }
    }
  });
  // 清晨浇水重置
  farmMap.farm.forEach((plot) => { plot.wet = false; });
  if (st.tomorrow === 'rain' || st.tomorrow === 'storm') {
    farmMap.farm.forEach((plot) => { if (plot.tilled) plot.wet = true; });
  }
  farmMap.objs.filter((o) => o.type === 'sprinkler').forEach((o) => {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const plot = G.world.farmAt(farmMap, o.tx + dx, o.ty + dy);
      if (plot && plot.tilled) plot.wet = true;
    }
  });
  // 配偶帮忙浇水
  if (st.family.married && st.family.mood > 35) {
    const plots = [...farmMap.farm.values()].filter((p) => p.crop);
    for (let i = 0; i < Math.min(6, plots.length); i++) plots[i].wet = true;
    if (plots.length) G.ui.toast('莉娅帮你浇了 ' + Math.min(6, plots.length) + ' 块地');
  }
  // 孩子帮忙
  if (st.family.child && st.family.childAge >= 15) {
    const plots = [...farmMap.farm.values()].filter((p) => p.crop && !p.wet);
    for (let i = 0; i < Math.min(3, plots.length); i++) plots[i].wet = true;
  }
  // 家庭消耗
  if (st.family.married) {
    st.family.loveDays++;
    const members = 2 + (st.family.child ? 1 : 0);
    let needed = members;
    const foods = st.inv.filter((s) => s && G.data.items[s.id] && G.data.items[s.id].cat === 'food').sort((a, b) => (G.data.items[a.id].hunger || 0) - (G.data.items[b.id].hunger || 0));
    let fed = 0;
    while (needed > 0 && foods.length) {
      const s = foods[0];
      const take = Math.min(s.n, needed);
      s.n -= take; needed -= take; fed += take;
      if (s.n <= 0) { const idx = st.inv.indexOf(s); if (idx >= 0) st.inv[idx] = null; foods.shift(); }
    }
    if (needed > 0) {
      st.family.mood = Math.max(0, st.family.mood - 14);
      if (!st.familyHungryWarned) { G.ui.toast('家里的食物不够，大家有点失落……', 'warn'); st.familyHungryWarned = true; }
    } else {
      st.family.mood = Math.min(100, st.family.mood + 6);
      st.familyHungryWarned = false;
    }
    if (!st.family.child && st.family.loveDays >= 12 && st.npcs.leah.affection >= 85) {
      st.family.child = true;
      st.family.childAge = 0;
      st.family.mood = 100;
      G.ui.toast('莉娅告诉你一个好消息：家里要多一个小生命了。', 'gold');
      G.audio.play('bell');
    }
    if (st.family.child) {
      st.family.childAge++;
      if (st.family.childAge === 7) G.ui.toast('孩子会走路了，摇摇晃晃地追着鸡跑');
      if (st.family.childAge === 15) { G.ui.toast('孩子长大了些，会帮你去田里浇水'); st.family.mood = Math.min(100, st.family.mood + 10); }
    }
  }
  // 重置每日状态
  Object.keys(st.npcs).forEach((id) => { st.npcs[id].talked = false; st.npcs[id].gifted = false; });
  st.quests.talkedToday = 0;
  // 灌木/采集物恢复
  farmMap.objs.forEach((o) => {
    if (o.type === 'bush' && o.ready === false && o.regrowDay <= st.day) o.ready = true;
  });
  if (!st.forageSpawned) st.forageSpawned = {};
  // 状态恢复
  st.player.hp = Math.min(st.player.maxHp, st.player.hp + (slept ? 70 : 25));
  st.player.stamina = st.player.maxStamina + (st.perks.earlyBird ? 15 : 0);
  st.player.maxStamina = 100 + 20 * (st.perks.stamina || 0) + (st.perks.starBlessed ? 30 : 0);
  st.player.stamina = Math.min(st.player.stamina, st.player.maxStamina);
  st.player.hunger = Math.max(slept ? 55 : 30, st.player.hunger - 12);
  st.minute = 6 * 60;
  st.weather = st.tomorrow;
  st.tomorrow = G.sys.rollWeather();
  st.enteredDay = (st.enteredDay || 0) + 1;
  G.ent.clearEnemies();
  G.ent.drops = [];
  // 若在屋里睡觉则留在屋里
  if (!st.map.interior) {
    // 从野外回家
    if (st.map.dungeon) G.sys.exitDungeon(true);
  }
  G.sys.save();
  G.ui.refresh();
  G.ui.dayBanner();
  G.sys.tutorial('sleep');
};

/* ---------------- 地图切换 ---------------- */
G.sys.enterHome = function () {
  const st = G.state;
  if (!st.homeMap) st.homeMap = G.world.genInterior(st.family.houseLevel);
  st.outsidePos = { x: st.player.x, y: st.player.y, map: st.map };
  st.map = st.homeMap;
  st.player.x = st.map.spawn.x; st.player.y = st.map.spawn.y;
  st.player.dir = 'up';
  G.ent.clearEnemies();
  G.sys.refreshLights();
  G.ent.buildNpcs();
  G.render.snapCamera();
  G.render.drawMinimap(false);
  G.audio.play('door');
  G.ui.toast('回到家');
};

G.sys.exitHome = function () {
  const st = G.state;
  const over = st.maps.over;
  st.map = over;
  const home = over.objs.find((o) => o.type === 'house');
  if (home) { st.player.x = home.x; st.player.y = home.y + 18; }
  G.ent.buildNpcs();
  G.sys.refreshLights();
  G.render.snapCamera();
  G.render.drawMinimap(false);
  G.audio.play('door');
};

G.sys.enterDungeon = function (floor) {
  const st = G.state;
  floor = G.clamp(floor, 1, 8);
  if (!st.dungeons[floor]) st.dungeons[floor] = G.world.genDungeon(st.seed, floor);
  st.outsideDungeon = { x: st.player.x, y: st.player.y };
  st.map = st.dungeons[floor];
  st.map.floor = floor;
  st.player.x = st.map.spawn.x; st.player.y = st.map.spawn.y;
  st.player.dir = 'up';
  G.ent.clearEnemies();
  G.ent.buildNpcs();
  G.ent.enemies = [];
  G.ent.spawnTimer = 1.2;
  if (floor === 8 && !st.map.bossDead) {
    const boss = G.ent.makeEnemy('boss', st.map.bossTile.tx * 16 + 8, st.map.bossTile.ty * 16 + 8);
    boss.aggro = false;
    G.ent.enemies.push(boss);
    G.ent.bossSpawned = true;
  }
  st.flags.dungeonFloor = floor;
  st.flags.deepest = Math.max(st.flags.deepest, floor);
  G.render.snapCamera();
  G.ui.toast('裂谷 · 第 ' + floor + ' 层' + (floor === 8 ? ' · 空洞之王' : ''));
  G.audio.play('door');
  G.render.drawMinimap(false);
  G.ui.refresh();
};

G.sys.exitDungeon = function (silent) {
  const st = G.state;
  st.map = st.maps.over;
  const entrance = st.map.objs.find((o) => o.type === 'entrance');
  if (entrance) { st.player.x = entrance.x; st.player.y = entrance.y + 20; }
  st.flags.dungeonFloor = 0;
  G.ent.clearEnemies();
  G.ent.buildNpcs();
  if (!silent) { G.audio.play('door'); G.ui.toast('你回到了地面'); }
  G.sys.refreshLights();
  G.render.snapCamera();
  G.render.drawMinimap(false);
};

G.sys.onBossDefeated = function () {
  const st = G.state;
  st.flags.bossDead = true;
  const map = st.map;
  if (map && map.dungeon && map.floor === 8) {
    map.bossDead = true;
    G.ui.toast('空洞之王崩解了。祭坛的第一块碎片在宝箱里。', 'gold');
    G.audio.play('bell');
    G.fx.shake = 14;
  }
};

/* ---------------- 死亡 ---------------- */
G.sys.onPlayerDeath = function () {
  const st = G.state, p = st.player;
  p.dead = true;
  p.hp = 0;
  G.audio.play('roar');
  G.ui.deathScreen();
  setTimeout(() => {
    const lost = Math.floor(st.gold * 0.1);
    st.gold -= lost;
    st.map = st.maps.over;
    const home = st.maps.over.objs.find((o) => o.type === 'house');
    p.x = home ? home.x : st.maps.over.spawn.x;
    p.y = home ? home.y + 20 : st.maps.over.spawn.y;
    p.hp = Math.round(p.maxHp * 0.6);
    p.stamina = 30; p.hunger = Math.max(10, p.hunger - 20);
    p.dead = false;
    G.ent.clearEnemies();
    G.sys.refreshLights();
    st.minute += 60;
    G.ui.closeDeath();
    G.ui.toast('你在农舍前醒来' + (lost ? '，丢了 ' + lost + ' 金' : ''), 'warn');
  }, 1600);
};

/* ---------------- 光源 ---------------- */
G.sys.refreshLights = function () {
  const st = G.state, map = st.map;
  if (!map) return;
  map.lights = [];
  map.objs.forEach((o) => {
    if (o.type === 'torch') map.lights.push({ x: o.x, y: o.y - 12, r: 46, flicker: true });
    if (o.type === 'campfire') map.lights.push({ x: o.x, y: o.y - 10, r: 74, flicker: true });
    if (o.type === 'shrine') map.lights.push({ x: o.x, y: o.y - 26, r: 60, color: '#8fe6ff' });
  });
};

/* ---------------- 存档 ---------------- */
G.sys.save = function () {
  const st = G.state;
  if (!st.started) return;
  try {
    const data = {
      v: 1, seed: st.seed, day: st.day, season: st.season, year: st.year, minute: st.minute,
      weather: st.weather, tomorrow: st.tomorrow, gold: st.gold, selected: st.selected,
      inv: st.inv, player: { hp: st.player.hp, maxHp: st.player.maxHp, stamina: st.player.stamina, maxStamina: st.player.maxStamina, hunger: st.player.hunger, x: st.player.x, y: st.player.y },
      npcs: st.npcs, family: st.family, quests: st.quests, story: st.story, tutorial: st.tutorial,
      level: st.level, xp: st.xp, xpNeed: st.xpNeed, perks: st.perks, perkPoints: st.perkPoints,
      stats: st.stats, flags: st.flags,
      map: G.world.serialize(st.maps.over),
      explored: G.world.rleEncode(st.maps.over.explored),
      homeLevel: st.family.houseLevel,
    };
    localStorage.setItem(G.sys.SAVE_KEY, JSON.stringify(data));
    st.lastSave = Date.now();
  } catch (e) { console.warn('save failed', e); }
};

G.sys.hasSave = function () {
  try { return !!localStorage.getItem(G.sys.SAVE_KEY); } catch (e) { return false; }
};

G.sys.load = function () {
  let data;
  try { data = JSON.parse(localStorage.getItem(G.sys.SAVE_KEY)); } catch (e) { return false; }
  if (!data) return false;
  const st = G.sys.makeState();
  G.state = st;
  st.seed = data.seed;
  st.map = G.world.genOverworld(st.seed);
  st.maps.over = st.map;
  G.world.applySave(st.map, data.map);
  if (data.explored) st.map.explored = G.world.rleDecode(data.explored, st.map.w * st.map.h);
  st.homeMap = G.world.genInterior(data.homeLevel || 1);
  st.player = G.ent.newPlayer(st.map.spawn.x, st.map.spawn.y);
  Object.assign(st.player, data.player || {});
  st.inv = data.inv || st.inv;
  st.gold = data.gold ?? 150;
  st.selected = data.selected || 0;
  st.minute = data.minute || 360;
  st.day = data.day || 1; st.season = data.season || 0; st.year = data.year || 1;
  st.weather = data.weather || 'sunny'; st.tomorrow = data.tomorrow || 'sunny';
  st.npcs = data.npcs || st.npcs;
  st.family = Object.assign(st.family, data.family || {});
  st.quests = Object.assign(st.quests, data.quests || {});
  st.story = Object.assign(st.story, data.story || {});
  st.tutorial = Object.assign(st.tutorial, data.tutorial || {});
  st.level = data.level || 1; st.xp = data.xp || 0; st.xpNeed = data.xpNeed || 80;
  st.perks = data.perks || {}; st.perkPoints = data.perkPoints || 0;
  st.stats = Object.assign(st.stats, data.stats || {});
  st.flags = Object.assign(st.flags, data.flags || {});
  st.started = true;
  G.ent.buildNpcs();
  G.ent.clearEnemies();
  G.sys.refreshLights();
  G.sys.refreshQuests();
  G.ui.hideTitle();
  G.ui.refresh();
  G.ui.toast('继续第 ' + st.day + ' 天的生活');
  return true;
};

G.sys.resetSave = function () {
  try { localStorage.removeItem(G.sys.SAVE_KEY); } catch (e) { }
};


/* ===== js/60_render.js ===== */
/* =========================================================
   星野农庄 — 60 渲染：地形 / 物件排序 / 光照 / 天气 / 小地图
   ========================================================= */
G.render = {};

G.art.tint = function (src, color) {
  const key = (src.__tintKey || (src.__tintKey = Math.random().toString(36).slice(2))) + color;
  if (!G.art._tintCache) G.art._tintCache = {};
  if (G.art._tintCache[key]) return G.art._tintCache[key];
  const c = G.art.newCanvas(src.width, src.height);
  c.x.drawImage(src, 0, 0);
  c.x.globalCompositeOperation = 'source-atop';
  c.x.fillStyle = color;
  c.x.fillRect(0, 0, c.width, c.height);
  G.art._tintCache[key] = c.c;
  return c.c;
};

G.render.init = function () {
  const canvas = document.getElementById('game');
  canvas.width = G.W; canvas.height = G.H;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  this.canvas = canvas; this.ctx = ctx;
  this.cam = { x: 0, y: 0 };
  this.light = G.art.newCanvas(G.W, G.H);
  this.weatherP = [];
  this.stars = [];
  for (let i = 0; i < 60; i++) this.stars.push({ x: Math.random() * G.W, y: Math.random() * G.H * 0.5, a: Math.random(), s: Math.random() < 0.3 ? 2 : 1 });
  G.input.init(canvas);
  this.minimap = document.getElementById('minimap');
  this.minimapCtx = this.minimap.getContext('2d');
  this.minimapCtx.imageSmoothingEnabled = false;
  this.mapFull = document.getElementById('mapCanvas') || document.createElement('canvas');
  this.mapFull.width = 480; this.mapFull.height = 480;
  this.mapFullCtx = this.mapFull.getContext('2d');
  this.time = 0;
};

G.render.resizeUI = function () { };

G.render.update = function (dt) {
  const st = G.state;
  this.time += dt;
  if (!st.started || !st.map) return;
  const p = st.player;
  const targetX = G.clamp(p.x - G.W / 2, 0, st.map.w * 16 - G.W);
  const targetY = G.clamp(p.y - G.H / 2 - 6, 0, st.map.h * 16 - G.H);
  this.cam.x = G.lerp(this.cam.x, targetX, Math.min(1, dt * 8));
  this.cam.y = G.lerp(this.cam.y, targetY, Math.min(1, dt * 8));
  if (st.map.w * 16 < G.W) this.cam.x = (st.map.w * 16 - G.W) / 2;
  if (st.map.h * 16 < G.H) this.cam.y = (st.map.h * 16 - G.H) / 2;
  st.mouseWorld = { x: G.input.mouse.x + this.cam.x, y: G.input.mouse.y + this.cam.y };
  this.updateWeather(dt);
};

G.render.updateWeather = function (dt) {
  const st = G.state;
  const type = st.weather;
  const count = type === 'rain' || type === 'storm' ? 110 : type === 'snow' ? 70 : type === 'fog' ? 8 : 0;
  while (this.weatherP.length < count) {
    this.weatherP.push({
      x: Math.random() * G.W, y: Math.random() * G.H,
      vy: type === 'snow' ? 18 + Math.random() * 22 : 220 + Math.random() * 120,
      vx: type === 'snow' ? Math.sin(Math.random() * 6) * 8 : -12,
      life: Math.random(), size: type === 'snow' ? 1 + Math.random() * 2 : 1,
    });
  }
  this.weatherP.forEach((p) => {
    p.y += p.vy * dt; p.x += p.vx * dt + (type === 'snow' ? Math.sin(this.time + p.y * 0.05) * 6 * dt : 0);
    if (p.y > G.H) { p.y = -6; p.x = Math.random() * G.W; }
    if (p.x < -4) p.x = G.W + 4;
  });
  if (type === 'storm' && Math.random() < dt * 0.35) { this.lightning = 0.22; G.fx.shake = 4; }
  if (this.lightning) this.lightning -= dt;
};

G.render.snapCamera = function () {
  const st = G.state;
  if (!st.map) return;
  const maxX = Math.max(0, st.map.w * 16 - G.W);
  const maxY = Math.max(0, st.map.h * 16 - G.H);
  this.cam.x = G.clamp(st.player.x - G.W / 2, 0, maxX);
  this.cam.y = G.clamp(st.player.y - G.H / 2 - 6, 0, maxY);
};

/* ---------------- 主渲染 ---------------- */
G.render.draw = function () {
  const st = G.state, ctx = this.ctx;
  ctx.fillStyle = '#0d0a12'; ctx.fillRect(0, 0, G.W, G.H);
  if (!st.started || !st.map) return;
  const map = st.map;
  let shakeX = 0, shakeY = 0;
  if (G.fx.shake > 0) { shakeX = G.rand(G.fx.shake, -G.fx.shake); shakeY = G.rand(G.fx.shake, -G.fx.shake); }
  const camX = Math.round(this.cam.x + shakeX), camY = Math.round(this.cam.y + shakeY);

  ctx.save();
  ctx.translate(-camX, -camY);

  this.drawTerrain(ctx, map, camX, camY);
  this.drawFarm(ctx, map, camX, camY);

  const drawables = [];
  const view = { x0: camX - 64, y0: camY - 80, x1: camX + G.W + 64, y1: camY + G.H + 80 };
  map.objs.forEach((o) => {
    if (o.x < view.x0 || o.x > view.x1 || o.y < view.y0 || o.y > view.y1) return;
    drawables.push({ y: o.y, kind: 'obj', o });
  });
  G.ent.enemies.forEach((e) => {
    if (e.x < view.x0 || e.x > view.x1 || e.y < view.y0 || e.y > view.y1) return;
    drawables.push({ y: e.y, kind: 'enemy', e });
  });
  G.ent.npcs.forEach((n) => {
    if (n.hidden || n.x < view.x0 || n.x > view.x1 || n.y < view.y0 || n.y > view.y1) return;
    drawables.push({ y: n.y, kind: 'npc', n });
  });
  G.ent.drops.forEach((d) => {
    if (d.x < view.x0 || d.x > view.x1 || d.y < view.y0 || d.y > view.y1) return;
    drawables.push({ y: d.y, kind: 'drop', d });
  });
  drawables.push({ y: st.player.y, kind: 'player' });
  G.ent.projectiles.forEach((pr) => {
    if (pr.x < view.x0 || pr.x > view.x1 || pr.y < view.y0 || pr.y > view.y1) return;
    drawables.push({ y: pr.y, kind: 'proj', pr });
  });
  drawables.sort((a, b) => a.y - b.y);

  drawables.forEach((d) => {
    if (d.kind === 'obj') this.drawObject(ctx, d.o);
    else if (d.kind === 'enemy') this.drawEnemy(ctx, d.e);
    else if (d.kind === 'npc') this.drawNpc(ctx, d.n);
    else if (d.kind === 'drop') this.drawDrop(ctx, d.d);
    else if (d.kind === 'player') this.drawPlayer(ctx, st.player);
    else if (d.kind === 'proj') this.drawProjectile(ctx, d.pr);
  });

  this.drawFx(ctx);
  this.drawTarget(ctx, st);
  ctx.restore();

  this.drawTint(ctx, map);
  this.drawLighting(ctx, map, camX, camY);
  this.drawWeather(ctx);
  this.drawNightStars(ctx);
  this.drawFishing(ctx);
  this.drawVignette(ctx);
  if (st.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + st.fade + ')'; ctx.fillRect(0, 0, G.W, G.H); }
};

/* ---------------- 地形 ---------------- */
G.render.drawTerrain = function (ctx, map, camX, camY) {
  const T = G.art.tiles, GT = G.world.GT;
  const tx0 = Math.floor(camX / 16), ty0 = Math.floor(camY / 16);
  const tx1 = Math.ceil((camX + G.W) / 16), ty1 = Math.ceil((camY + G.H) / 16);
  const waterFrame = Math.floor(this.time * 4) % 3;
  const season = G.data.seasons[G.state.season].id;
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) continue;
      const g = map.ground[ty * map.w + tx];
      const i = ty * map.w + tx;
      const px = tx * 16, py = ty * 16;
      let img = null;
      if (g === GT.GRASS) {
        let v = (tx * 31 + ty * 17) % 4;
        if (season === 'winter') img = T.snow;
        else img = T.grass[Math.abs(v)];
        // 雪天草地泛白
        if (season === 'winter' && map.biome[i] !== G.world.BIOME.WATER) img = T.snow;
      } else if (g === GT.DIRT) img = T.dirt;
      else if (g === GT.PATH) {
        // 小径：草地底 + 一条蜿蜒的土路，避免方格状广场
        ctx.drawImage(season === 'winter' ? T.snow : T.grass[(tx * 31 + ty * 17) % 4], px, py);
        const isP = (dx, dy) => {
          const nx = tx + dx, ny = ty + dy;
          if (nx < 0 || ny < 0 || nx >= map.w || ny >= map.h) return false;
          return map.ground[ny * map.w + nx] === GT.PATH;
        };
        ctx.fillStyle = '#b29a77';
        ctx.fillRect(px + 3, py + 3, 10, 10);
        ctx.fillStyle = '#b29a77';
        if (isP(-1, 0)) ctx.fillRect(px, py + 3, 5, 10);
        if (isP(1, 0)) ctx.fillRect(px + 11, py + 3, 5, 10);
        if (isP(0, -1)) ctx.fillRect(px + 3, py, 10, 5);
        if (isP(0, 1)) ctx.fillRect(px + 3, py + 11, 10, 5);
        if (isP(-1, -1)) ctx.fillRect(px + 1, py + 1, 5, 5);
        if (isP(1, -1)) ctx.fillRect(px + 10, py + 1, 5, 5);
        if (isP(-1, 1)) ctx.fillRect(px + 1, py + 10, 5, 5);
        if (isP(1, 1)) ctx.fillRect(px + 10, py + 10, 5, 5);
        // 外侧一圈深色土边
        ctx.fillStyle = '#957d5d';
        if (!isP(-1, 0)) ctx.fillRect(px + 3, py + 3, 1, 10);
        if (!isP(1, 0)) ctx.fillRect(px + 12, py + 3, 1, 10);
        if (!isP(0, -1)) ctx.fillRect(px + 3, py + 3, 10, 1);
        if (!isP(0, 1)) ctx.fillRect(px + 3, py + 12, 10, 1);
        ctx.fillStyle = '#c7b08b';
        ctx.fillRect(px + 4 + (tx % 3), py + 4 + (ty % 3), 3, 1);
        ctx.fillStyle = '#8a7154';
        ctx.fillRect(px + 7 + (tx % 2), py + 8 + (ty % 2), 2, 1);
        continue;
      } else if (g === GT.SAND) img = T.sand;
      else if (g === GT.SAND) img = T.sand;
      else if (g === GT.SNOW) img = T.snow;
      else if (g === GT.ROCK) img = T.rock;
      else if (g === GT.WATER) img = T.water[waterFrame];
      else if (g === GT.CAVE) img = T.caveFloor;
      else if (g === GT.WALL) img = map.dungeon ? T.caveWall : (T.interiorWall || T.caveWall);
      else if (g === GT.WOOD) img = T.woodFloor;
      else if (g === GT.STONE) img = T.stoneFloor;
      if (img) ctx.drawImage(img, px, py);
      // 冬季草地叠霜
      if (season === 'winter' && g === GT.GRASS) {
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(px, py, 16, 16);
      }
      // 水岸泡沫
      if (g === GT.WATER) {
        const up = ty > 0 ? map.ground[i - map.w] : GT.WATER;
        const down = ty < map.h - 1 ? map.ground[i + map.w] : GT.WATER;
        const left = tx > 0 ? map.ground[i - 1] : GT.WATER;
        const right = tx < map.w - 1 ? map.ground[i + 1] : GT.WATER;
        ctx.fillStyle = 'rgba(200,235,250,0.55)';
        if (up !== GT.WATER) ctx.fillRect(px, py, 16, 1);
        if (down !== GT.WATER) ctx.fillRect(px, py + 15, 16, 1);
        if (left !== GT.WATER) ctx.fillRect(px, py, 1, 16);
        if (right !== GT.WATER) ctx.fillRect(px + 15, py, 1, 16);
        if (up !== GT.WATER) { ctx.fillStyle = 'rgba(200,235,250,0.9)'; ctx.fillRect(px + (waterFrame * 5) % 12, py + 1, 3, 1); }
      }
      // 洞穴地面点苔
      if (g === GT.CAVE && (tx * 7 + ty * 3) % 23 === 0) {
        ctx.fillStyle = '#5f5a4a'; ctx.fillRect(px + 6, py + 7, 2, 1);
      }
    }
  }
  // 装饰
  map.deco.forEach((d) => {
    if (d.x * 16 < camX - 16 || d.x * 16 > camX + G.W + 16 || d.y * 16 < camY - 16 || d.y * 16 > camY + G.H + 16) return;
    let img = null, ox = 0, oy = 0;
    if (d.s === 'tuft') { img = G.art.s.tuft; ox = (d.o % 3) * 2; oy = 8; }
    else if (d.s === 'pebble') { img = G.art.s.pebble; ox = 5; oy = 5; }
    else if (d.s === 'snowPuff') { img = G.art.s.snowPuff; ox = 4; oy = 6; }
    if (img) ctx.drawImage(img, d.x * 16 + ox, d.y * 16 + oy);
  });
};

/* ---------------- 农田 ---------------- */
G.render.drawFarm = function (ctx, map, camX, camY) {
  if (map.farm.size === 0) return;
  const plots = G.art.tiles.farm, wetPlots = G.art.tiles.farmWet;
  const isFarm = (tx, ty) => map.farm.has(ty * map.w + tx);
  map.farm.forEach((plot, idx) => {
    const tx = idx % map.w, ty = Math.floor(idx / map.w);
    const px = tx * 16, py = ty * 16;
    if (px < camX - 16 || px > camX + G.W || py < camY - 16 || py > camY + G.H) return;
    if (plot.tilled) {
      const v = (tx * 3 + ty * 5) % 3;
      ctx.drawImage(plot.wet ? wetPlots[v] : plots[v], px, py);
      // 与草地相接的边缘长一点草，弱化田块的棋盘感
      ctx.fillStyle = '#5f8a4a';
      if (!isFarm(tx, ty - 1)) { ctx.fillRect(px + 1, py, 4, 1); ctx.fillRect(px + 8, py, 5, 1); }
      if (!isFarm(tx, ty + 1)) { ctx.fillRect(px + 2, py + 15, 4, 1); ctx.fillRect(px + 10, py + 15, 4, 1); }
      if (!isFarm(tx - 1, ty)) { ctx.fillRect(px, py + 3, 1, 3); ctx.fillRect(px, py + 10, 1, 3); }
      if (!isFarm(tx + 1, ty)) { ctx.fillRect(px + 15, py + 4, 1, 3); ctx.fillRect(px + 15, py + 11, 1, 3); }
    }
    if (plot.crop) {
      const crop = G.data.crops[plot.crop];
      const stage = G.sys.cropStage(plot);
      const img = G.art.s.crop[crop.id][stage];
      const bob = stage === 3 ? Math.round(Math.sin(this.time * 3 + tx) * 1) : 0;
      ctx.drawImage(img, px, py + 16 - 24 + bob);
      if (stage === 3 && Math.floor(this.time * 2 + tx + ty) % 3 === 0) {
        ctx.fillStyle = 'rgba(255,240,180,0.9)';
        ctx.fillRect(px + 4, py + 6, 1, 1); ctx.fillRect(px + 11, py + 9, 1, 1);
      }
    }
  });
};

/* ---------------- 物件 ---------------- *//* ---------------- 物件 ---------------- */
G.render.objSprite = function (o) {
  const A = G.art.s;
  const night = G.time.isNight();
  switch (o.type) {
    case 'tree': return A.tree[o.variant || 0];
    case 'pine': return A.pine[o.variant || 0];
    case 'stump': return A.stump;
    case 'rock': return A.rock[o.variant || 0];
    case 'ore': return A.ore[o.ore || 'copper'];
    case 'bush': return o.ready === false ? A.bush : A.bushBerry;
    case 'cactus': return A.cactus;
    case 'flower': return A['flower' + ((o.variant || 0) % 4)];
    case 'mushroom': return A.mushroom;
    case 'forage': return o.item === 'honey' ? A.honey : A.berryItem;
    case 'house': return A.house[night ? 1 : 0][(o.level || 1) - 1];
    case 'hut': return A.hut;
    case 'shopStall': return A.shopStall;
    case 'well': return A.well;
    case 'shrine': return A.shrine;
    case 'entrance': return A.entrance;
    case 'chest': return o.opened ? A.chestOpen : A.chest;
    case 'bed': return A.bed;
    case 'kitchen': return A.kitchen;
    case 'table': return A.table;
    case 'rug': return A.rug;
    case 'pot': return A.pot;
    case 'sign': return A.sign;
    case 'stairsDown': return A.stairsDown;
    case 'stairsUp': return A.stairsUp;
    case 'fence': return A.fence;
    case 'torch': return A.torch[Math.floor(this.time * 6) % 2];
    case 'sprinkler': return A.sprinkler;
    case 'scarecrow': return A.scarecrow;
    case 'workbench': return A.workbench;
    case 'campfire': return A.campfire[Math.floor(this.time * 7) % 3];
    case 'pillar': return A.pillar;
    case 'crate': return A.crate;
    case 'door': return A.door;
    default: return null;
  }
};

G.render.drawObject = function (ctx, o) {
  const img = this.objSprite(o);
  if (!img) return;
  const def = o.def;
  // 影子
  if (o.type !== 'rug') {
    ctx.fillStyle = 'rgba(20,14,20,0.22)';
    const sw = Math.min(def.w + 4, 26);
    ctx.beginPath();
    ctx.ellipse(o.x, o.y - 1, sw / 2, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.drawImage(img, Math.round(o.x - def.w / 2), Math.round(o.y - def.h));
  // 樹木结果提示
  if (o.type === 'bush' && o.ready !== false && Math.sin(this.time * 2 + o.tx) > 0) {
    ctx.fillStyle = '#ffe066'; ctx.fillRect(o.x + 6, o.y - 14, 1, 1);
  }
};

/* ---------------- 玩家 / NPC / 敌人 ---------------- */
G.render.drawShadow = function (ctx, x, y, w) {
  ctx.fillStyle = 'rgba(20,14,20,0.28)';
  ctx.beginPath();
  ctx.ellipse(x, y, w / 2, 2.6, 0, 0, Math.PI * 2);
  ctx.fill();
};

G.render.drawPlayer = function (ctx, p) {
  const A = G.art.s;
  const frame = p.animFrame || 0;
  const dir = p.dir;
  let sprite;
  if (dir === 'left') sprite = A.player['side'][frame];
  else if (dir === 'right') sprite = A.player['side'][frame];
  else sprite = A.player[dir][frame];
  const bob = p.moving && frame === 1 ? 1 : 0;
  this.drawShadow(ctx, p.x, p.y + 1, 12);
  // 工具挥动
  if (p.swing > 0) {
    const ang = p.swingAng || 0;
    const prog = 1 - p.swing / 0.22;
    ctx.strokeStyle = 'rgba(255,245,200,0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y - 6, 16, ang - 0.7 + prog * 1.4, ang - 0.3 + prog * 1.4);
    ctx.stroke();
  }
  ctx.save();
  if (dir === 'left') {
    ctx.translate(p.x + 8, p.y - 22 - bob);
    ctx.scale(-1, 1);
    ctx.drawImage(sprite, 0, 0);
  } else {
    ctx.drawImage(sprite, Math.round(p.x - 8), Math.round(p.y - 22 - bob));
  }
  ctx.restore();
  if (p.hurtT > 0) {
    ctx.fillStyle = 'rgba(255,80,80,' + (p.hurtT * 0.35) + ')';
    ctx.fillRect(p.x - 8, p.y - 23, 16, 24);
  }
  if (p.hunger < 20) {
    ctx.fillStyle = '#ffd166'; ctx.font = '7px sans-serif';
    ctx.fillText('饿', p.x - 3, p.y - 27);
  }
};

G.render.drawNpc = function (ctx, n) {
  const A = G.art.s;
  const dir = n.dir || 'down';
  const side = dir === 'left' || dir === 'right';
  const key = side ? 'side' : (dir === 'up' ? 'up' : 'down');
  const frames = n.id === 'kid' ? A.kid[key] : (A.npc[n.id] ? A.npc[n.id][key] : A.player[key]);
  const fi = Math.floor(n.animT || 0) % 3;
  const sprite = (frames && (frames[fi] || frames[0])) || A.player.down[0];
  this.drawShadow(ctx, n.x, n.y + 1, 12);
  if (dir === 'left') {
    ctx.save(); ctx.translate(n.x + 8, n.y - 22); ctx.scale(-1, 1); ctx.drawImage(sprite, 0, 0); ctx.restore();
  } else {
    ctx.drawImage(sprite, Math.round(n.x - 8), Math.round(n.y - 22));
  }
  const cfg = G.data.npcs[n.id];
  if (cfg) {
    ctx.font = '7px sans-serif';
    ctx.fillStyle = 'rgba(20,16,22,0.75)';
    const tw = ctx.measureText(cfg.name).width;
    ctx.fillRect(n.x - tw / 2 - 3, n.y - 38, tw + 6, 10);
    ctx.fillStyle = '#f4e7c0';
    ctx.fillText(cfg.name, n.x - tw / 2, n.y - 31);
    const rel = G.state.npcs[n.id];
    if (rel && !rel.talked) {
      ctx.fillStyle = '#ffe066';
      ctx.fillRect(n.x - 1, n.y - 44 + Math.sin(this.time * 4) * 1, 3, 4);
      ctx.fillRect(n.x - 2, n.y - 41, 5, 1);
    }
    if (G.state.family.married && n.id === 'leah') {
      ctx.fillStyle = '#ff9ecb'; ctx.fillRect(n.x + 7, n.y - 40, 3, 3); ctx.fillRect(n.x + 5, n.y - 38, 7, 3);
    }
  }
};

G.render.drawEnemy = function (ctx, e) {
  const A = G.art.s;
  let img;
  if (e.type === 'boss') img = A.mon.boss[Math.floor(this.time * 2) % 2];
  else {
    const frames = A.mon[e.type] || A.mon.slime;
    img = frames[Math.floor(e.anim) % frames.length];
  }
  const w = img.width, h = img.height;
  this.drawShadow(ctx, e.x, e.y + 1, Math.max(10, w * 0.6));
  ctx.save();
  if (e.dir < 0) { ctx.translate(e.x + w / 2, e.y - h + (e.def.flying ? 8 : 0)); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); }
  else ctx.drawImage(img, Math.round(e.x - w / 2), Math.round(e.y - h + (e.def.flying ? 8 : 0)));
  ctx.restore();
  if (e.hitT > 0) {
    const tinted = G.art.tint(img, '#ffffff');
    ctx.globalAlpha = Math.min(0.8, e.hitT * 4);
    ctx.drawImage(tinted, Math.round(e.x - w / 2), Math.round(e.y - h + (e.def.flying ? 8 : 0)), w, h);
    ctx.globalAlpha = 1;
  }
  // 血条
  if (e.hp < e.maxHp && !e.boss) {
    ctx.fillStyle = 'rgba(20,14,20,0.7)'; ctx.fillRect(e.x - 9, e.y - h - 4, 18, 3);
    ctx.fillStyle = '#d9534f'; ctx.fillRect(e.x - 9, e.y - h - 4, 18 * (e.hp / e.maxHp), 3);
  }
  if (e.boss) {
    ctx.fillStyle = 'rgba(20,14,20,0.8)'; ctx.fillRect(e.x - 32, e.y - h - 10, 64, 5);
    ctx.fillStyle = '#c9689a'; ctx.fillRect(e.x - 32, e.y - h - 10, 64 * (e.hp / e.maxHp), 5);
    ctx.fillStyle = '#f4e7c0'; ctx.font = '7px sans-serif';
    const nm = e.def.name; ctx.fillText(nm, e.x - ctx.measureText(nm).width / 2, e.y - h - 14);
  }
};

G.render.drawDrop = function (ctx, d) {
  const bob = Math.sin(this.time * 4 + (d.bob || 0)) * 1.5;
  this.drawShadow(ctx, d.x, d.y + 1, 8);
  if (d.gold) {
    const img = G.art.iconCoin;
    ctx.drawImage(img, Math.round(d.x - 7), Math.round(d.y - 12 + bob));
    if (d.n >= 20) { ctx.fillStyle = '#f2c14e'; ctx.font = '6px sans-serif'; ctx.fillText(String(d.n), d.x + 6, d.y - 10); }
  } else {
    const icon = G.art.icons[d.id];
    if (icon) ctx.drawImage(icon, Math.round(d.x - 7), Math.round(d.y - 13 + bob));
  }
};

G.render.drawProjectile = function (ctx, pr) {
  if (pr.kind === 'rock') {
    ctx.fillStyle = '#8a8178'; ctx.beginPath(); ctx.arc(pr.x, pr.y, 4, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#b5bdc4'; ctx.fillRect(pr.x - 1, pr.y - 1, 2, 2);
  } else if (pr.kind === 'bone') {
    ctx.fillStyle = '#e8e2d0'; ctx.fillRect(pr.x - 3, pr.y - 1, 6, 2); ctx.fillRect(pr.x - 4, pr.y - 2, 2, 2); ctx.fillRect(pr.x + 2, pr.y - 2, 2, 2);
  } else if (pr.kind === 'wave') {
    ctx.strokeStyle = 'rgba(200,150,255,' + (pr.t) + ')';
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(pr.x, pr.y, 26 * (1 - pr.t), 0, 6.28); ctx.stroke();
  }
};

/* ---------------- 特效 ---------------- */
G.render.drawFx = function (ctx) {
  const fx = G.fx;
  fx.particles.forEach((p) => {
    ctx.fillStyle = p.col;
    const s = p.size || 1;
    ctx.globalAlpha = Math.min(1, p.life / (p.max || 1) * 1.6);
    ctx.fillRect(Math.round(p.x), Math.round(p.y), s, s);
  });
  ctx.globalAlpha = 1;
  fx.floats.forEach((f) => {
    ctx.globalAlpha = Math.min(1, f.life / f.max * 1.8);
    ctx.font = (f.crit ? 'bold 9px' : '8px') + ' sans-serif';
    ctx.fillStyle = 'rgba(20,14,20,0.8)';
    ctx.fillText(f.text, Math.round(f.x - ctx.measureText(f.text).width / 2) + 1, Math.round(f.y + 1));
    ctx.fillStyle = f.col;
    ctx.fillText(f.text, Math.round(f.x - ctx.measureText(f.text).width / 2), Math.round(f.y));
  });
  ctx.globalAlpha = 1;
};

/* ---------------- 目标高亮 ---------------- */
G.render.drawTarget = function (ctx, st) {
  if (G.ui.isModalOpen() || st.fishing) return;
  if (st.map.dungeon) return;
  const t = G.sys.targetTile();
  if (!t.fromMouse) return;
  const item = G.sys.selItem();
  if (!item) return;
  const px = t.tx * 16, py = t.ty * 16;
  if (item.tool === 'hoe' || item.tool === 'can' || item.cat === 'seed' || item.cat === 'place') {
    const ok = item.tool === 'hoe' ? G.world.canTill(st.map, t.tx, t.ty) : true;
    ctx.strokeStyle = ok ? 'rgba(255,240,180,0.8)' : 'rgba(217,83,79,0.8)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, 15, 15);
    if (item.cat === 'place') {
      const img = G.render.objSprite({ type: item.place, tx: t.tx, ty: t.ty, def: G.world.DEFS[item.place] || { w: 16, h: 16 } });
      if (img) { ctx.globalAlpha = 0.45; ctx.drawImage(img, t.tx * 16 + 8 - img.width / 2, (t.ty + 1) * 16 - img.height); ctx.globalAlpha = 1; }
    }
  }
};

/* ---------------- 光照 ---------------- */
G.render.drawTint = function (ctx) {
  const st = G.state;
  const season = G.data.seasons[st.season].id;
  const tint = G.data.tint[season];
  if (tint && tint.top) { ctx.fillStyle = tint.top; ctx.fillRect(0, 0, G.W, G.H); }
  const hour = G.time.hour();
  if (hour > 16 && hour < 19.5) {
    const a = Math.min(0.32, (hour - 16) * 0.08);
    ctx.fillStyle = 'rgba(235,140,70,' + a + ')';
    ctx.fillRect(0, 0, G.W, G.H);
  }
};

G.render.drawLighting = function (ctx, map, camX, camY) {
  const st = G.state;
  const alpha = map.dungeon ? 0.68 : G.time.lightAlpha();
  const lights = [];
  if (map.dungeon || alpha > 0.1) {
    lights.push({ x: st.player.x - camX, y: st.player.y - 8 - camY, r: (map.dungeon ? 220 : 62) * (1 + 0.3 * (st.perks.nightOwl ? 1 : 0)) });
    map.lights.forEach((l) => lights.push({ x: l.x - camX, y: l.y - camY, r: l.r }));
  }
  if (alpha <= 0.02 && !map.dungeon) return;
  const lc = this.light, lx = lc.x;
  lx.clearRect(0, 0, G.W, G.H);
  const grad = lx.createLinearGradient(0, 0, 0, G.H);
  if (map.dungeon) {
    lx.fillStyle = 'rgba(6,5,12,0.9)'; lx.fillRect(0, 0, G.W, G.H);
  } else {
    lx.fillStyle = 'rgba(8,12,26,' + Math.min(0.9, alpha) + ')';
    lx.fillRect(0, 0, G.W, G.H);
  }
  lx.globalCompositeOperation = 'destination-out';
  lights.forEach((l) => {
    const r = l.r * (l.flicker ? 0.94 + Math.random() * 0.12 : 1);
    const g = lx.createRadialGradient(l.x, l.y, 2, l.x, l.y, r);
    g.addColorStop(0, 'rgba(0,0,0,0.95)');
    g.addColorStop(0.6, 'rgba(0,0,0,0.6)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    lx.fillStyle = g;
    lx.beginPath(); lx.arc(l.x, l.y, r, 0, 6.28); lx.fill();
  });
  lx.globalCompositeOperation = 'source-over';
  // 洞穴/夜晚的暖色光源
  lights.forEach((l) => {
    if (!l.color) return;
    lx.fillStyle = l.color;
    lx.globalAlpha = 0.08;
    lx.beginPath(); lx.arc(l.x, l.y, l.r * 0.7, 0, 6.28); lx.fill();
    lx.globalAlpha = 1;
  });
  ctx.drawImage(lc.c, 0, 0);
};

G.render.drawWeather = function (ctx) {
  const st = G.state;
  const type = st.weather;
  if (type === 'rain' || type === 'storm') {
    ctx.strokeStyle = 'rgba(170,210,240,0.55)';
    ctx.lineWidth = 1;
    this.weatherP.forEach((p) => {
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 1, p.y + 5); ctx.stroke();
    });
    if (type === 'storm') { ctx.fillStyle = 'rgba(20,25,40,0.12)'; ctx.fillRect(0, 0, G.W, G.H); }
  } else if (type === 'snow') {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    this.weatherP.forEach((p) => { ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size); });
  } else if (type === 'fog') {
    ctx.fillStyle = 'rgba(220,230,235,0.22)'; ctx.fillRect(0, 0, G.W, G.H);
  }
  if (this.lightning > 0) {
    ctx.fillStyle = 'rgba(200,220,255,' + (this.lightning * 1.2) + ')';
    ctx.fillRect(0, 0, G.W, G.H);
  }
};

G.render.drawNightStars = function (ctx) {
  const st = G.state;
  if (st.map && st.map.dungeon) return;
  const a = G.time.lightAlpha();
  if (a < 0.3) return;
  ctx.fillStyle = 'rgba(255,255,240,0.7)';
  this.stars.forEach((s) => {
    if (Math.sin(this.time * 0.7 + s.a * 10) > 0) ctx.fillRect(s.x, s.y, s.s, s.s);
  });
};

G.render.drawFishing = function (ctx) {
  const st = G.state;
  if (!st.fishing) return;
  const f = st.fishing;
  const w = 190, h = 22;
  const x = (G.W - w) / 2, y = G.H - 58;
  ctx.fillStyle = 'rgba(16,12,24,0.86)'; ctx.fillRect(x - 8, y - 20, w + 16, h + 30);
  ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 1; ctx.strokeRect(x - 7.5, y - 19.5, w + 15, h + 29);
  ctx.fillStyle = '#233a52'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(110,200,120,0.6)'; ctx.fillRect(x + (f.zone - f.width) * w, y, f.width * 2 * w, h);
  ctx.fillStyle = '#f4e7c0';
  ctx.fillRect(x + f.pos * w - 1, y - 3, 3, h + 6);
  ctx.font = '8px sans-serif';
  ctx.fillText('抛竿！点击 / 空格 在绿色区域停下', x + 8, y - 7);
  if (f.done) {
    ctx.fillStyle = f.caught ? '#ffe066' : '#ff9d9d';
    ctx.font = 'bold 10px sans-serif';
    const msg = f.caught ? '上钩了！' : '鱼跑掉了…';
    ctx.fillText(msg, x + w / 2 - ctx.measureText(msg).width / 2, y + 14);
  }
};

G.render.drawVignette = function (ctx) {
  const g = ctx.createRadialGradient(G.W / 2, G.H / 2, G.H * 0.35, G.W / 2, G.H / 2, G.H * 0.9);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(10,6,14,0.28)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
};

/* ---------------- 小地图 ---------------- */
G.render.drawMinimap = function (big) {
  const state = G.state;
  if (!state.started || !state.map) return;
  const worldMap = state.map;
  const canvas = big ? this.mapFull : this.minimap;
  const ctx = big ? (this.mapFullCtx = this.mapFull.getContext('2d')) : this.minimapCtx;
  const size = canvas.width;
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = '#17121c';
  ctx.fillRect(0, 0, size, size);
  const r = 26;
  const spanW = big ? worldMap.w : r * 2;
  const spanH = big ? worldMap.h : r * 2;
  const spanX = Math.floor(big ? 0 : G.clamp(state.player.x / 16 - r, 0, Math.max(0, worldMap.w - spanW)));
  const spanY = Math.floor(big ? 0 : G.clamp(state.player.y / 16 - r, 0, Math.max(0, worldMap.h - spanH)));
  const sX = size / spanW, sY = size / spanH;

  const tileColor = (g) => {
    switch (g) {
      case 0: return '#4f7f45';
      case 1: return '#7a5a3c';
      case 2: return '#a08d6d';
      case 3: return '#cdb47a';
      case 4: return '#dbe7ee';
      case 5: return '#77716a';
      case 6: return '#3f6f9f';
      case 7: return '#665a64';
      case 8: return '#3a3139';
      case 9: return '#8c5f3c';
      case 10: return '#9a958f';
      default: return '#4f7f45';
    }
  };
  const step = big ? 2 : 1;
  for (let y = spanY; y < spanY + spanH; y += step) {
    for (let x = spanX; x < spanX + spanW; x += step) {
      if (x < 0 || y < 0 || x >= worldMap.w || y >= worldMap.h) continue;
      if (!worldMap.dungeon && !worldMap.explored[y * worldMap.w + x]) continue;
      ctx.fillStyle = tileColor(worldMap.ground[y * worldMap.w + x]);
      ctx.fillRect((x - spanX) * sX, (y - spanY) * sY, sX * step + 0.6, sY * step + 0.6);
    }
  }

  const mark = (tx, ty, col, s = 3) => {
    const mx = (tx - spanX + 0.5) * sX, my = (ty - spanY + 0.5) * sY;
    ctx.fillStyle = col; ctx.fillRect(mx - s / 2, my - s / 2, s, s);
  };
  (worldMap.objs || []).forEach((o) => {
    if (!worldMap.dungeon && !worldMap.explored[o.ty * worldMap.w + o.tx]) return;
    if (o.type === 'house') mark(o.tx, o.ty, '#f2c14e', 5);
    else if (o.type === 'shopStall') mark(o.tx, o.ty, '#e8843c', 4);
    else if (o.type === 'shrine') mark(o.tx, o.ty, '#8fe6ff', 4);
    else if (o.type === 'entrance') mark(o.tx, o.ty, '#b04a5a', 5);
    else if (o.type === 'hut') mark(o.tx, o.ty, '#d9b36a', 3);
    else if (o.type === 'stairsUp') mark(o.tx, o.ty, '#8fe6ff', 4);
    else if (o.type === 'stairsDown') mark(o.tx, o.ty, '#8fe6ff', 4);
    else if (o.type === 'bossChest') mark(o.tx, o.ty, '#ffe066', 4);
    else if (o.type === 'chest') mark(o.tx, o.ty, '#e8c07a', 2);
  });
  if (worldMap.dungeon && worldMap.bossTile) {
    const boss = (G.ent.enemies || []).find((e) => e.type === 'boss' && e.hp > 0);
    if (boss) mark(worldMap.bossTile.tx, worldMap.bossTile.ty, '#ff6b8a', 5);
  }

  const px = (state.player.x / 16 - spanX) * sX, py = (state.player.y / 16 - spanY) * sY;
  ctx.fillStyle = Math.sin(this.time * 4) > 0 ? '#ffffff' : '#ffe066';
  ctx.fillRect(px - 1.5, py - 1.5, 3, 3);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.strokeRect(px - 3, py - 3, 6, 6);
  ctx.fillStyle = 'rgba(240,230,210,0.5)';
  ctx.font = (size > 300 ? 18 : 8) + 'px sans-serif';
  ctx.fillText('N', size - (size > 300 ? 24 : 11), (size > 300 ? 24 : 11));
  const label = document.getElementById('minimapLabel');
  if (label) label.textContent = worldMap.dungeon ? ('裂谷 ' + (worldMap.floor || 1) + 'F') : '星野谷';
};

/* ===== js/65_title.js ===== */
/* =========================================================
   星野农庄 — 65 标题画面（程序化像素夜景）
   ========================================================= */
G.render.drawTitle = function (t) {
  const ctx = this.ctx;
  const W = G.W, H = G.H;
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0b1020');
  sky.addColorStop(0.42, '#1d2742');
  sky.addColorStop(0.62, '#4a3a5a');
  sky.addColorStop(0.78, '#b06a5a');
  sky.addColorStop(1, '#2a1c26');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 星星
  if (!this.stars.length) return;
  for (let i = 0; i < this.stars.length; i++) {
    const s = this.stars[i];
    const a = 0.35 + 0.45 * Math.abs(Math.sin(t * 0.7 + i));
    ctx.fillStyle = 'rgba(255,250,220,' + a + ')';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  // 月亮
  ctx.fillStyle = '#f4e7c0';
  ctx.beginPath(); ctx.arc(372, 66, 20, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#e2d3a6';
  ctx.fillRect(364, 58, 5, 4); ctx.fillRect(378, 68, 4, 5); ctx.fillRect(370, 74, 3, 3);
  ctx.fillStyle = 'rgba(244,231,192,0.10)';
  ctx.beginPath(); ctx.arc(372, 66, 34, 0, 6.28); ctx.fill();

  // 流星
  const st = (t * 0.12) % 1;
  if (st < 0.28) {
    const p = st / 0.28;
    const x = 40 + p * 260, y = 30 + p * 70;
    ctx.fillStyle = 'rgba(220,240,255,' + (0.85 - p * 0.6) + ')';
    for (let i = 0; i < 9; i++) ctx.fillRect(x - i * 3, y - i * 1.4, 2, 1);
  }

  // 远山
  ctx.fillStyle = '#232b3d';
  for (let i = 0; i < 5; i++) {
    const mx = 20 + i * 110, mh = 70 + (i % 2) * 30;
    ctx.beginPath();
    ctx.moveTo(mx - 60, 168); ctx.lineTo(mx, 168 - mh); ctx.lineTo(mx + 70, 168);
    ctx.closePath(); ctx.fill();
  }
  // 中景丘陵
  ctx.fillStyle = '#1c2a2a';
  ctx.beginPath();
  ctx.moveTo(0, 190);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 176 + Math.sin(x * 0.02) * 9);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  // 农舍与田野
  const house = G.art.s.house[1][1];
  if (house) {
    ctx.fillStyle = '#151a20';
    ctx.fillRect(0, 188, W, 1);
    ctx.drawImage(house, 118, 128);
    // 烟囱烟
    for (let i = 0; i < 8; i++) {
      const yy = 120 - ((t * 14 + i * 9) % 62);
      const xx = 190 + Math.sin((t + i) * 0.8) * 6 + i * 1.5;
      ctx.fillStyle = 'rgba(220,220,230,' + (0.20 * (1 - i / 9)) + ')';
      ctx.fillRect(xx, yy, 3 + (i % 3), 3);
    }
  }
  // 田垄
  ctx.fillStyle = '#3a2f2a';
  for (let i = 0; i < 7; i++) {
    ctx.fillRect(150 + i * 2, 208 + i * 5, 150 - i * 4, 2);
  }
  // 作物剪影
  for (let i = 0; i < 18; i++) {
    const x = 160 + i * 7, y = 208 + (i % 3) * 4;
    ctx.fillStyle = '#1a2a22';
    ctx.fillRect(x, y - 5, 2, 6);
    ctx.fillRect(x - 2, y - 7, 3, 2); ctx.fillRect(x + 2, y - 8, 3, 2);
  }
  // 树
  const tree = G.art.s.tree[1];
  if (tree) {
    ctx.globalAlpha = 0.88;
    ctx.drawImage(G.art.tint(tree, '#101820'), 30, 110);
    ctx.globalAlpha = 1;
    ctx.globalAlpha = 0.75;
    ctx.drawImage(G.art.tint(G.art.s.tree[2], '#101820'), 400, 118);
    ctx.globalAlpha = 1;
  }
  // 栅栏
  ctx.fillStyle = '#2a211d';
  for (let i = 0; i < 9; i++) ctx.fillRect(70 + i * 10, 238, 2, 12);
  ctx.fillRect(60, 241, 100, 2); ctx.fillRect(60, 246, 100, 2);
  // 萤火虫
  for (let i = 0; i < 26; i++) {
    const x = (i * 53 + Math.sin(t * 0.9 + i) * 22) % W;
    const y = 180 + Math.abs(Math.sin(t * 1.2 + i * 2)) * 70;
    const a = 0.3 + 0.6 * Math.abs(Math.sin(t * 2.2 + i));
    ctx.fillStyle = 'rgba(220,255,150,' + a + ')';
    ctx.fillRect(x, y, 1 + (i % 2), 1);
    ctx.fillStyle = 'rgba(200,255,120,0.10)';
    ctx.fillRect(x - 3, y - 3, 7, 7);
  }
  // 前景压暗
  const vg = ctx.createLinearGradient(0, H - 72, 0, H);
  vg.addColorStop(0, 'rgba(8,6,12,0)');
  vg.addColorStop(1, 'rgba(8,6,12,0.85)');
  ctx.fillStyle = vg; ctx.fillRect(0, H - 72, W, 72);
  const top = ctx.createLinearGradient(0, 0, 0, 60);
  top.addColorStop(0, 'rgba(0,0,0,0.5)');
  top.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = top; ctx.fillRect(0, 0, W, 60);
};

/* =========================================================
   星野农庄 — 70 UI：HUD / 物品栏 / 商店 / 任务 / 家庭 / 对话 / 菜单

G.ui = {
  modal: null,
  dialogue: null,
  icons: {},
  toastList: [],
  lastMinimap: 0,
  invSel: -1,
  shopTab: 'buy',
  titleVisible: true,
