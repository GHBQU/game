  deathVisible: false,
  perkChoices: [],
};

/* ---------------- 初始化 ---------------- */
G.ui.init = function () {
  this.el = document.getElementById('ui');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('hotbarWrap').style.display = 'none';
  this.hud = document.getElementById('hud');
  this.hotbarEl = document.getElementById('hotbar');
  this.toastsEl = document.getElementById('toasts');
  this.modalWrap = document.getElementById('modalWrap');
  this.modalTitle = document.getElementById('modalTitle');
  this.modalBody = document.getElementById('modalBody');
  this.dlgEl = document.getElementById('dialogue');
  this.promptEl = document.getElementById('prompt');
  this.tutEl = document.getElementById('tutorial');
  this.titleEl = document.getElementById('titleScreen');
  this.deathEl = document.getElementById('deathScreen');
  this.endingEl = document.getElementById('endingScreen');
  this.buildEl = document.getElementById('buildBanner');
  this.bossEl = document.getElementById('bossBar');
  this.dayEl = document.getElementById('dayBanner');
  this.clockEl = document.getElementById('clock');
  this.dateEl = document.getElementById('dateInfo');
  this.weatherEl = document.getElementById('weatherInfo');
  this.goldEl = document.getElementById('goldInfo');
  this.hpBar = document.getElementById('hpBar');
  this.spBar = document.getElementById('spBar');
  this.hgBar = document.getElementById('hgBar');
  this.hpText = document.getElementById('hpText');
  this.levelEl = document.getElementById('levelInfo');
  this.xpBar = document.getElementById('xpBar');

  // 图标 dataURL
  Object.keys(G.data.items).forEach((id) => {
    const c = G.art.icons[id];
    if (c) this.icons[id] = c.toDataURL();
  });
  this.icons.coin = G.art.iconCoin.toDataURL();

  // 快捷键栏
  this.hotbarEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.i = i;
    slot.innerHTML = '<span class="key">' + (i + 1) + '</span><img class="ic"><span class="num"></span>';
    slot.addEventListener('click', (e) => {
      e.stopPropagation();
      G.state.selected = i;
      G.audio.play('ui');
      G.ui.refresh();
    });
    this.hotbarEl.appendChild(slot);
  }

  document.querySelectorAll('[data-panel]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = btn.dataset.panel;
      if (G.ui.modal === p) G.ui.closePanel(); else G.ui.openPanel(p);
      G.audio.play('ui');
    });
  });
  document.getElementById('modalClose').addEventListener('click', () => this.closePanel());
  this.modalWrap.addEventListener('mousedown', (e) => {
    if (e.target === this.modalWrap) this.closePanel();
  });
  this.dlgEl.addEventListener('mousedown', (e) => { e.stopPropagation(); this.advanceDialogue(); });
  document.getElementById('titleNew').addEventListener('click', () => {
    G.audio.ensure();
    if (G.sys.hasSave()) { if (!confirm('已有存档，开始新游戏会覆盖它。继续？')) return; }
    G.ui.hideTitle();
    G.sys.newGame();
    G.state.started = true;
    G.ui.refresh();
  });
  document.getElementById('titleContinue').addEventListener('click', () => {
    G.audio.ensure();
    if (!G.sys.load()) this.toast('没有找到存档', 'warn');
  });
  document.getElementById('titleHelp').addEventListener('click', () => this.showHelp());
  document.getElementById('deathClose').addEventListener('click', () => this.closeDeath());
  const endCloser = document.getElementById('endingClose');
  if (endCloser) endCloser.addEventListener('click', () => this.hideEnding());
  document.getElementById('buildCancel').addEventListener('click', () => { G.state.build = null; this.refresh(); });
  document.addEventListener('keydown', (e) => this.onKey(e));
  window.addEventListener('resize', () => this.layout());

  this.showTitleIfNeeded();
  this.layout();
  this.refresh();
};

G.ui.layout = function () {
  const wrap = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / G.W, vh / G.H);
  canvas.style.width = Math.floor(G.W * scale) + 'px';
  canvas.style.height = Math.floor(G.H * scale) + 'px';
  wrap.style.width = canvas.style.width;
  wrap.style.height = canvas.style.height;
  // UI 以 480×270 的逻辑尺寸缩放
  this.el.style.width = canvas.style.width;
  this.el.style.height = canvas.style.height;
};

/* ---------------- 标题 ---------------- */
G.ui.openShop = function () { this.shopTab = 'buy'; this.openPanel('shop'); };
G.ui.openCraft = function () { this.openPanel('craft'); };

G.ui.showTitleIfNeeded = function () {
  document.getElementById('hud').style.display = 'none';
  document.getElementById('hotbarWrap').style.display = 'none';
  if (G.sys.hasSave()) {
    document.getElementById('titleContinue').classList.remove('disabled');
    document.getElementById('titleSub').textContent = '存档已找到。继续星野的日子。';
  } else {
    document.getElementById('titleContinue').classList.add('disabled');
    document.getElementById('titleSub').textContent = '种田 · 打怪 · 成家 · 远行';
  }
  this.titleEl.classList.remove('hidden');
  this.titleVisible = true;
};

G.ui.hideTitle = function () {
  this.titleEl.classList.add('hidden');
  this.titleVisible = false;
  document.getElementById('hud').style.display = 'block';
  document.getElementById('hotbarWrap').style.display = 'flex';
};

G.ui.showHelp = function () {
  this.openTextPanel('操作说明', `
    <div class="helpGrid">
      <div><b>WASD / 方向键</b><span>移动</span></div>
      <div><b>Shift</b><span>奔跑（消耗体力）</span></div>
      <div><b>鼠标左键 / 空格</b><span>使用工具、挥剑、播种、放置</span></div>
      <div><b>E</b><span>互动：对话、收获、开箱、进门、睡觉</span></div>
      <div><b>1 - 9</b><span>切换快捷栏</span></div>
      <div><b>I / C / J / F / M / P</b><span>背包 / 制作 / 任务 / 家庭 / 地图 / 天赋</span></div>
      <div><b>B</b><span>建造放置模式</span></div>
      <div><b>R</b><span>吃掉当前食物</span></div>

    </div>
    <p class="small">提示：鼠标位置决定挥锄/挥剑的方向。夜晚野外会出现怪物，记得带剑。作物每天需要浇水才会生长；下雨天自动浇灌。</p>
  `);
};

/* ---------------- HUD 刷新 ---------------- */
G.ui.refresh = function () {
  const st = G.state;
  if (!st || !st.player) return;
  const p = st.player;
  this.hpBar.style.width = Math.max(0, (p.hp / p.maxHp) * 100) + '%';
  this.spBar.style.width = Math.max(0, (p.stamina / p.maxStamina) * 100) + '%';
  this.hgBar.style.width = Math.max(0, p.hunger) + '%';
  this.hpText.textContent = Math.ceil(p.hp) + '/' + p.maxHp;
  this.goldEl.textContent = st.gold;
  this.levelEl.textContent = 'Lv.' + st.level;
  this.xpBar.style.width = Math.min(100, (st.xp / st.xpNeed) * 100) + '%';
  const season = G.data.seasons[st.season];
  this.dateEl.innerHTML = '<b>第 ' + st.day + ' 天</b><span>' + season.name + ' · 第 ' + G.time.dayOfSeason() + ' 日</span>';
  this.weatherEl.innerHTML = '<span class="wicon">' + this.weatherGlyph(st.weather) + '</span>' + G.data.weather[st.weather].name;
  this.clockEl.textContent = G.time.str();
  for (let i = 0; i < 9; i++) {
    const slotEl = this.hotbarEl.children[i];
    const item = st.inv[i];
    const img = slotEl.querySelector('.ic');
    const num = slotEl.querySelector('.num');
    if (item) {
      img.src = this.icons[item.id] || '';
      img.style.visibility = 'visible';
      num.textContent = item.n > 1 ? item.n : '';
    } else {
      img.style.visibility = 'hidden';
      num.textContent = '';
    }
    slotEl.classList.toggle('sel', st.selected === i);
  }
  const sel = st.inv[st.selected];
  document.getElementById('selName').textContent = sel ? G.data.items[sel.id].name : '空手';
  // 教程
  if (!st.tutorial.done && st.started && !(st.map && st.map.dungeon)) {
    const step = G.sys.tutorialSteps[st.tutorial.step];
    this.tutEl.classList.remove('hidden');
    this.tutEl.innerHTML = step ? '<b>新手引导 ' + (st.tutorial.step + 1) + '/' + G.sys.tutorialSteps.length + '</b> ' + step.text : '';
  } else {
    this.tutEl.classList.add('hidden');
  }
  // 建造提示
  if (st.build) {
    this.buildEl.classList.remove('hidden');
    this.buildEl.innerHTML = '<b>放置模式</b> ' + G.data.items[st.build].name + ' · 左键放置 · Esc / B 取消';
  } else {
    this.buildEl.classList.add('hidden');
  }
  // 弹窗内容重绘
  if (this.modal) this.renderPanel();
  this.updateBoss();
};

G.ui.weatherGlyph = function (w) {
  return { sunny: '☀', cloudy: '☁', rain: '🌧', storm: '⛈', snow: '❄', fog: '🌫' }[w] || '☀';
};

G.ui.updateBoss = function () {
  const boss = G.ent.enemies.find((e) => e.type === 'boss');
  if (boss) {
    this.bossEl.classList.remove('hidden');
    this.bossEl.innerHTML = '<div class="bossName">空洞之王</div><div class="bossTrack"><div class="bossFill" style="width:' + Math.max(0, boss.hp / boss.maxHp * 100) + '%"></div></div>';
  } else {
    this.bossEl.classList.add('hidden');
  }
};

/* 每帧调用 */
G.ui.tick = function (dt) {
  const st = G.state;
  if (!st.started || !st.map) return;
  this.clockEl.textContent = G.time.str();
  if (this.dialogue) this.tickDialogue(dt);
  // 交互提示
  if (!this.isModalOpen()) {
    const p = st.player;
    const npc = G.ent.npcs.find((n) => !n.hidden && Math.hypot(n.x - p.x, n.y - p.y) < 42);
    const t = G.sys.targetTile();
    const plot = G.world.farmAt(st.map, t.tx, t.ty);
    let text = '';
    if (npc) text = 'E 与 ' + (G.data.npcs[npc.id] ? G.data.npcs[npc.id].name : '家人') + ' 交谈';
    else if (plot && G.sys.isRipe(plot)) text = 'E 收获 ' + G.data.crops[plot.crop].name;
    else {
      const o = G.sys.findInteractable();
      if (o) text = 'E ' + this.objPrompt(o);
    }
    if (!text && G.sys.selItem() && G.sys.selItem().tool === 'rod') {
      const tx = Math.floor((p.x + p.face.x * 20) / 16), ty = Math.floor((p.y + p.face.y * 20) / 16);
      if (G.world.tileGround(st.map, tx, ty) === G.world.GT.WATER) text = 'E 在岸边钓鱼';
    }
    this.promptEl.textContent = text;
    this.promptEl.classList.toggle('hidden', !text);
  } else {
    this.promptEl.classList.add('hidden');
  }
  // 小地图
  if (performance.now() - this.lastMinimap > 380) {
    this.lastMinimap = performance.now();
    G.render.drawMinimap(false);
    if (this.modal === 'map') G.render.drawMinimap(true);
  }
};

G.ui.objPrompt = function (o) {
  const map = {
    house: '进入农舍', hut: '敲门', shopStall: '打开商店', chest: '打开箱子', bed: '睡觉', kitchen: '做饭',
    campfire: '烹饪', workbench: '制作', shrine: '触摸祭坛', entrance: '进入裂谷', stairsDown: '下一层',
    stairsUp: '上一层', sign: '阅读木牌', bush: '采摘浆果', mushroom: '采蘑菇', forage: '采集', sprinkler: '查看洒水器',
    scarecrow: '查看稻草人', well: '打水', door: '出门', flower: '摘花',
  };
  return map[o.type] || '互动';
};

/* ---------------- 通知 ---------------- */
G.ui.toast = function (text, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = text;
  this.toastsEl.appendChild(el);
  setTimeout(() => { el.classList.add('out'); }, 2600);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
  while (this.toastsEl.children.length > 4) this.toastsEl.removeChild(this.toastsEl.firstChild);
};

G.ui.dayBanner = function () {
  const st = G.state;
  const season = G.data.seasons[st.season];
  this.dayEl.innerHTML = '<small>' + season.name + ' · 第 ' + st.day + ' 天</small><b>' + G.data.weather[st.tomorrow].name + '</b>';
  this.dayEl.classList.remove('hidden');
  this.dayEl.style.animation = 'none';
  void this.dayEl.offsetWidth;
  this.dayEl.style.animation = 'dayIn 2.6s ease forwards';
  setTimeout(() => this.dayEl.classList.add('hidden'), 2600);
};

/* ---------------- 面板 ---------------- */
G.ui.isModalOpen = function () {
  return !!(this.modal || this.dialogue || this.deathVisible || this.endingVisible || this.titleVisible);
};

G.ui.openPanel = function (name) {
  if (this.titleVisible) return;
  this.modal = name;
  this.modalWrap.classList.remove('hidden');
  G.audio.play('ui');
  this.renderPanel();
};

G.ui.closePanel = function () {
  this.modal = null;
  this.invSel = -1;
  this.modalWrap.classList.add('hidden');
  this.modalBody.innerHTML = '';
};

G.ui.openTextPanel = function (title, html) {
  this.modal = 'text';
  this.modalWrap.classList.remove('hidden');
  this.modalTitle.textContent = title;
  this.modalBody.innerHTML = html;
};

G.ui.renderPanel = function () {
  const st = G.state;
  const name = this.modal;
  if (name === 'text' || name === 'perk') return;
  const titles = { inventory: '背包', craft: '制作与烹饪', shop: '老陈的杂货摊', quests: '任务簿', family: '家庭', map: '星野谷地图', skills: '天赋与等级', settings: '菜单' };
  this.modalTitle.textContent = titles[name] || '';
  if (name === 'inventory') this.renderInventory();
  else if (name === 'craft') this.renderCraft();
  else if (name === 'shop') this.renderShop();
  else if (name === 'quests') this.renderQuests();
  else if (name === 'family') this.renderFamily();
  else if (name === 'map') { G.render.drawMinimap(true); this.modalBody.innerHTML = '<canvas id="mapCanvas" width="480" height="480"></canvas>'; G.render.mapFull = document.getElementById('mapCanvas'); G.render.drawMinimap(true); }
  else if (name === 'skills') this.renderSkills();
  else if (name === 'settings') this.renderSettings();
};

/* ---------------- 背包 ---------------- */
G.ui.renderInventory = function () {
  const st = G.state;
  let html = '<div class="invTop"><span>快捷栏 1-9 可直接使用</span><span class="money">' + st.gold + ' g</span></div>';
  html += '<div class="invGrid">';
  for (let i = 0; i < 36; i++) {
    const item = st.inv[i];
    html += '<div class="invSlot' + (i < 9 ? ' hot' : '') + (this.invSel === i ? ' sel' : '') + '" data-inv="' + i + '">' +
      (i < 9 ? '<span class="key">' + (i + 1) + '</span>' : '') +
      (item ? '<img src="' + (this.icons[item.id] || '') + '"><span class="num">' + (item.n > 1 ? item.n : '') + '</span>' : '') +
      '</div>';
  }
  html += '</div>';
  if (this.invSel >= 0 && st.inv[this.invSel]) {
    const item = G.data.items[st.inv[this.invSel].id];
    html += '<div class="itemDetail"><div class="idTop"><img src="' + this.icons[item.id] + '"><div><b>' + item.name + '</b><span>' + (item.desc || '') + '</span></div></div>';
    html += '<div class="idBtns">';
    if (this.invSel >= 9) html += '<button class="btn" data-act="hotbar">放入快捷栏</button>';
    if (item.cat === 'food') html += '<button class="btn" data-act="eat">食用</button>';
    if (item.cat === 'place') html += '<button class="btn" data-act="build">放置</button>';
    html += '</div></div>';
  }
  html += '<div class="invFoot"><button class="btn" data-act="sort">整理背包</button><span class="small">多余的物品可以放进箱子或卖给老陈</span></div>';
  this.modalBody.innerHTML = html;
  this.modalBody.querySelectorAll('[data-inv]').forEach((el) => {
    el.addEventListener('click', () => { this.invSel = +el.dataset.inv; G.audio.play('ui'); this.renderInventory(); });
  });
  this.modalBody.querySelectorAll('[data-act]').forEach((el) => {
    el.addEventListener('click', () => this.invAction(el.dataset.act));
  });
};

G.ui.invAction = function (act) {
  const st = G.state;
  const slot = st.inv[this.invSel];
  if (!slot) return;
  const item = G.data.items[slot.id];
  if (act === 'eat') { G.sys.eat(slot.id); this.invSel = -1; this.renderInventory(); }
  else if (act === 'hotbar') {
    const target = st.selected;
    const old = st.inv[target];
    st.inv[target] = slot; st.inv[this.invSel] = old || null;
    this.invSel = target;
    G.ui.toast(item.name + ' 已放入快捷栏');
    this.refresh();
  } else if (act === 'build') {
    st.build = slot.id;
    this.closePanel();
    this.refresh();
  } else if (act === 'sort') {
    const items = st.inv.slice(0, 9);
    const rest = st.inv.slice(9).filter(Boolean);
    const merged = [];
    rest.forEach((s) => {
      const same = merged.find((m) => m.id === s.id && m.n + s.n <= G.data.items[s.id].stack);
      if (same) same.n += s.n; else merged.push({ id: s.id, n: s.n });
    });
    const out = items;
    for (let i = 9; i < 36; i++) out[i] = merged[i - 9] || null;
    st.inv = out;
    this.refresh();
  }
};

/* ---------------- 制作 ---------------- */
G.ui.hasStation = function (type) {
  const st = G.state;
  if (type === 'any') return true;
  if (st.map.interior) return true;
  const p = st.player;
  return st.map.objs.some((o) => (o.type === (type === 'campfire' ? 'campfire' : 'workbench')) && Math.hypot(o.x - p.x, o.y - p.y) < 70);
};

G.ui.renderCraft = function () {
  const st = G.state;
  let html = '<p class="small">在农舍灶台、篝火或工作台附近可以制作。材料不足时会标红。</p><div class="recipeList">';
  G.data.recipes.forEach((r, idx) => {
    const out = G.data.items[r.out];
    const okStation = this.hasStation(r.station);
    const okMat = Object.keys(r.need).every((k) => G.sys.count(k) >= r.need[k]);
    const builder = st.perks.builder && (r.station === 'workbench') ? 0.75 : 1;
    html += '<div class="recipe ' + (okStation && okMat ? '' : 'dim') + '"><img src="' + this.icons[r.out] + '"><div class="rcMain"><b>' + out.name + (r.n > 1 ? ' ×' + r.n : '') + '</b><div class="needs">';
    Object.keys(r.need).forEach((k) => {
      const need = Math.ceil(r.need[k] * builder);
      const have = G.sys.count(k);
      html += '<span class="' + (have >= need ? 'ok' : 'no') + '">' + G.data.items[k].name + ' ' + have + '/' + need + '</span>';
    });
    html += '</div><div class="rcStation">' + (r.station === 'any' ? '随时' : r.station === 'campfire' ? '需要篝火/灶台' : '需要工作台') + (okStation ? '' : '（不在范围内）') + '</div></div><button class="btn small" data-craft="' + idx + '" ' + (okStation && okMat ? '' : 'disabled') + '>制作</button></div>';
  });
  html += '</div>';
  this.modalBody.innerHTML = html;
  this.modalBody.querySelectorAll('[data-craft]').forEach((el) => {
    el.addEventListener('click', () => this.craft(+el.dataset.craft));
  });
};

G.ui.craft = function (idx) {
  const st = G.state;
  const r = G.data.recipes[idx];
  if (!this.hasStation(r.station)) { this.toast('需要靠近' + (r.station === 'campfire' ? '篝火' : '工作台'), 'warn'); return; }
  const builder = st.perks.builder && r.station === 'workbench' ? 0.75 : 1;
  const needs = {};
  for (const k of Object.keys(r.need)) {
    needs[k] = Math.ceil(r.need[k] * builder);
    if (G.sys.count(k) < needs[k]) { this.toast('材料不够：' + G.data.items[k].name, 'warn'); G.audio.play('error'); return; }
  }
  Object.keys(needs).forEach((k) => G.sys.remove(k, needs[k]));
  const n = r.out === 'bread' && st.perks.chef ? 2 : r.n;
  G.sys.give(r.out, n, true);
  G.audio.play('harvest');
  this.toast('制作了 ' + G.data.items[r.out].name + ' ×' + n, 'gold');
  G.sys.gainXp(4, true);
  st.stats.cooked += (r.station === 'campfire' ? 1 : 0);
  this.renderCraft();
  this.refresh();
};

G.ui.buy = function (i) {
  const st = G.state;
  const s = G.data.shop.stock[i];
  const price = Math.round(s.buy * (st.perks.haggler ? 0.88 : 1));
  if (st.gold < price) { this.toast('金币不够', 'warn'); G.audio.play('error'); return; }
  if (!G.sys.give(s.id, 1, true)) return;
  st.gold -= price;
  G.audio.play('coin');
  this.toast('买入 ' + G.data.items[s.id].name + ' (-' + price + 'g)');
  this.renderShop(); this.refresh();
};

G.ui.sellSlot = function (i, n) {
  const st = G.state;
  const slot = st.inv[i];
  if (!slot) return;
  const it = G.data.items[slot.id];
  const count = Math.min(n, slot.n);
  const price = Math.round(it.sell * count);
  st.gold += price;
  slot.n -= count;
  if (slot.n <= 0) st.inv[i] = null;
  G.audio.play('coin');
  this.toast('卖出 ' + it.name + ' ×' + count + ' (+' + price + 'g)', 'gold');
  this.renderShop(); this.refresh();
};

G.ui.openPerks = function () {
  const st = G.state;
  if (st.perkPoints <= 0) { this.toast('没有可用的天赋点', 'warn'); return; }
  const pool = G.data.perks.filter((p) => !p.hidden && (!st.perks[p.id] || (p.max && st.perks[p.id] < p.max)));
  if (!pool.length) { st.perkPoints = 0; return; }
  this.perkChoices = [];
  const copy = pool.slice();
  for (let i = 0; i < 3 && copy.length; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    this.perkChoices.push(copy.splice(idx, 1)[0]);
  }
  this.modal = 'perk';
  this.modalWrap.classList.remove('hidden');
  this.modalTitle.textContent = '选择天赋';
  this.modalBody.innerHTML = '<p class="small">每次升级获得一个天赋。选择会永久保留。</p><div class="perkChoices">' +
    this.perkChoices.map((p, i) => '<button class="perkCard" data-pick="' + i + '"><i>' + p.icon + '</i><b>' + p.name + '</b><span>' + p.desc + '</span></button>').join('') +
    '</div>';
  this.modalBody.querySelectorAll('[data-pick]').forEach((el) => {
    el.addEventListener('click', () => {
      const p = this.perkChoices[+el.dataset.pick];
      G.sys.learnPerk(p.id);
      this.modal = null;
      this.modalWrap.classList.add('hidden');
      this.refresh();
    });
  });
};

/* ---------------- 对话 ---------------- */
G.ui.openDialogue = function (lines, options, onClose) {
  this.dialogue = { lines, idx: 0, chars: 0, options: options || [], onClose: onClose || null, done: false };
  this.dlgEl.classList.remove('hidden');
  this.dlgEl.innerHTML = '<div class="dlgBox"><div class="dlgName"></div><div class="dlgText"></div><div class="dlgOptions"></div><div class="dlgNext">▼</div></div>';
  this.renderDialogueLine();
};

G.ui.renderDialogueLine = function () {
  const d = this.dialogue;
  if (!d) return;
  const line = d.lines[d.idx] || { speaker: '', text: '' };
  this.dlgEl.querySelector('.dlgName').textContent = line.speaker || '';
  this.dlgEl.querySelector('.dlgName').style.display = line.speaker ? 'block' : 'none';
  this.dlgEl.querySelector('.dlgText').textContent = '';
  this.dlgEl.querySelector('.dlgOptions').innerHTML = '';
  d.chars = 0;
  d.done = false;
};

G.ui.tickDialogue = function (dt) {
  const d = this.dialogue;
  if (!d) return;
  const line = d.lines[d.idx] || { text: '' };
  if (!d.done) {
    d.chars += dt * 26;
    const text = line.text.slice(0, Math.floor(d.chars));
    this.dlgEl.querySelector('.dlgText').textContent = text;
    if (Math.floor(d.chars) >= line.text.length) {
      d.done = true;
      this.showDialogueOptions();
    }
  }
};

G.ui.showDialogueOptions = function () {
  const d = this.dialogue;
  if (!d) return;
  const box = this.dlgEl.querySelector('.dlgOptions');
  box.innerHTML = '';
  if (d.idx >= d.lines.length - 1) {
    d.options.forEach((o) => {
      const b = document.createElement('button');
      b.className = 'btn dlgOpt';
      b.textContent = o.label;
      b.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        this.closeDialogue();
        if (o.action) o.action();
      });
      box.appendChild(b);
    });
  }
  this.dlgEl.querySelector('.dlgNext').style.display = (d.options.length && d.idx >= d.lines.length - 1) ? 'none' : 'block';
};

G.ui.advanceDialogue = function () {
  const d = this.dialogue;
  if (!d) return;
  if (!d.done) {
    d.chars = d.lines[d.idx].text.length + 10;
    this.dlgEl.querySelector('.dlgText').textContent = d.lines[d.idx].text;
    d.done = true;
    this.showDialogueOptions();
    return;
  }
  if (d.idx < d.lines.length - 1) {
    d.idx++;
    this.renderDialogueLine();
  } else if (d.options.length) {
    // 等待选择
  } else {
    this.closeDialogue();
  }
};

G.ui.closeDialogue = function () {
  const onClose = this.dialogue ? this.dialogue.onClose : null;
  this.dialogue = null;
  this.dlgEl.classList.add('hidden');
  this.dlgEl.innerHTML = '';
  if (onClose) onClose();
};

G.ui.openGift = function (npcId) {
  const st = G.state;
  const gifts = st.inv.map((s, i) => ({ s, i })).filter(({ s }) => s && ['crop', 'food', 'forage', 'fish'].includes(G.data.items[s.id].cat));
  let html = '<p class="small">选择一份礼物送给' + G.data.npcs[npcId].name + '。每天只能送一次，喜欢的东西会加更多好感。</p><div class="giftGrid">';
  if (!gifts.length) html += '<p class="empty">背包里没有合适的礼物。作物、鱼、食物和野果都可以送。</p>';
  gifts.forEach(({ s }) => {
    const it = G.data.items[s.id];
    html += '<button class="giftItem" data-gift="' + s.id + '"><img src="' + this.icons[s.id] + '"><span>' + it.name + '</span><b>' + s.n + '</b></button>';
  });
  html += '</div>';
  this.openTextPanel('送礼给 ' + G.data.npcs[npcId].name, html);
  this.modalBody.querySelectorAll('[data-gift]').forEach((el) => el.addEventListener('click', () => {
    G.sys.gift(npcId, el.dataset.gift);
    this.closePanel();
  }));
};

/* ---------------- 睡觉 / 死亡 / 结局 ---------------- */
G.ui.confirmSleep = function () {
  this.dialogue = {
    lines: [{ speaker: '床', text: '要睡到明天早上吗？今天的进度会自动保存。' }],
    idx: 0, chars: 0, done: false,
    options: [
      { label: '睡觉', action: () => G.sys.sleep() },
      { label: '再等等', action: () => { } },
    ], onClose: null,
  };
  this.dlgEl.classList.remove('hidden');
  this.dlgEl.innerHTML = '<div class="dlgBox"><div class="dlgName">床</div><div class="dlgText"></div><div class="dlgOptions"></div><div class="dlgNext">▼</div></div>';
  this.renderDialogueLine();
};

G.ui.deathScreen = function () {
  this.deathVisible = true;
  this.deathEl.classList.remove('hidden');
};

G.ui.closeDeath = function () {
  this.deathVisible = false;
  this.deathEl.classList.add('hidden');
};

G.ui.showEnding = function () {
  this.endingVisible = true;
  const st = G.state;
  this.endingEl.classList.remove('hidden');
  this.endingEl.innerHTML = '<div class="endBox"><div class="endStars">✦ ✧ ✦</div><h1>星 光 长 出 了 麦 田</h1><p>三块星辉碎片在祭坛上合拢。那天夜里，整座山谷都看见一道温柔的光从你的农舍升起，落在每一块耕地上。</p><p>第二天清晨，莉娅在门口等你。她说，今年的麦子会很好。</p><p class="small">你种下的不只是作物。还有家、路、和那些愿意留下来的人。</p><div class="endStats">第 ' + st.day + ' 天 · ' + st.stats.harvests + ' 次收获 · ' + st.stats.kills + ' 次战斗 · 家庭心情 ' + Math.round(st.family.mood) + '</div><button class="btn" id="endBtn">继续星野的生活</button></div>';
  document.getElementById('endBtn').addEventListener('click', () => this.hideEnding());
};

G.ui.hideEnding = function () {
  this.endingVisible = false;
  this.endingEl.classList.add('hidden');
  this.toast('星之祝福已融入你的身体：生命、体力与移动速度提升', 'gold');
};

/* ---------------- 键盘 ---------------- */
G.ui.onKey = function (e) {
  if (!this.el) return;
  const st = G.state;
  const code = e.code;
  if (this.titleVisible) return;
  if (this.dialogue) {
    if (code === 'Space' || code === 'Enter' || code === 'KeyE') { e.preventDefault(); this.advanceDialogue(); }
    if (code === 'Escape') this.closeDialogue();
    return;
  }
  if (this.endingVisible || this.deathVisible) return;
  if (code === 'Escape') {
    if (this.modal) this.closePanel();
    else if (st.build) { st.build = null; this.refresh(); }
    else this.openPanel('settings');
    return;
  }
  if (this.modal) {
    if (code === 'KeyI' && this.modal === 'inventory') this.closePanel();
    return;
  }
  const num = code.match(/^Digit([1-9])$/);
  if (num) { st.selected = +num[1] - 1; G.audio.play('ui'); this.refresh(); return; }
  if (code === 'KeyI') this.openPanel('inventory');
  else if (code === 'KeyC') this.openPanel('craft');
  else if (code === 'KeyJ') this.openPanel('quests');
  else if (code === 'KeyF') this.openPanel('family');
  else if (code === 'KeyM') this.openPanel('map');
  else if (code === 'KeyP') this.openPanel('skills');
  else if (code === 'KeyB') {
    if (st.build) { st.build = null; this.refresh(); }
    else this.openPanel('inventory');
  } else if (code === 'KeyE') { G.sys.interact(); }
  else if (code === 'Space') { e.preventDefault(); G.sys.primaryAction(); }
  else if (code === 'KeyR') {
    const it = G.sys.selItem();
    if (it && it.cat === 'food') G.sys.eat(it.id); else this.toast('当前拿的不是食物', 'warn');
  }
};

/* 画布点击（由主循环调用） */
G.ui.canvasClick = function () {
  if (this.titleVisible) return;
  if (this.dialogue) { this.advanceDialogue(); return; }
  if (this.endingVisible || this.deathVisible) return;
  if (this.modal) return;
  const st = G.state;
  if (st.fishing) { G.sys.fishClick(); return; }
  if (st.build) {
    const t = G.sys.targetTile();
    if (G.sys.placeItem(G.data.items[st.build], t.tx, t.ty)) {
      const s = G.state.inv[G.state.selected];
      if (!(s && s.id === st.build && s.n > 0)) st.build = null;
      this.refresh();
    }
    return;
  }
  G.sys.primaryAction();
};


/* ===== js/80_main.js ===== */
/* =========================================================
   星野农庄 — 80 主循环
   ========================================================= */
G.main = { last: 0, saveTimer: 0, startedOnce: false };

G.main.boot = function () {
  G.art.build();
  G.render.init();
  G.state = { started: false, player: null, inv: [], selected: 0, map: null, npcs: {}, family: {}, quests: {}, story: {}, tutorial: {}, perks: {}, stats: {}, flags: {} };
  G.ui.init();
  this.bind();
  requestAnimationFrame((ts) => this.frame(ts));
};

G.main.bind = function () {
  const canvas = G.render.canvas;
  canvas.addEventListener('mousedown', () => { G.audio.ensure(); });
  window.addEventListener('keydown', () => G.audio.ensure(), { once: true });
  window.addEventListener('resize', () => { G.ui.layout(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state.started) G.sys.save(); });
};

G.main.frame = function (ts) {
  const dt = Math.min(0.05, this.last ? (ts - this.last) / 1000 : 0.016);
  this.last = ts;
  const st = G.state;

  if (!st.started) {
    G.render.drawTitle(ts / 1000);
    G.input.endFrame();
    requestAnimationFrame((t) => this.frame(t));
    return;
  }

  const paused = G.ui.isModalOpen();

  // 鼠标滚轮切换快捷栏
  if (!paused && G.input.mouse.wheel) {
    st.selected = (st.selected + G.input.mouse.wheel + 9) % 9;
    G.ui.refresh();
  }
  // 点击画布：先同步一次鼠标世界坐标，避免快速点击用到上一帧的位置
  if (!paused && G.input.mouse.clicked) {
    st.mouseWorld = { x: G.input.mouse.x + G.render.cam.x, y: G.input.mouse.y + G.render.cam.y };
    G.ui.canvasClick();
  }

  if (!paused) {
    G.time.update(dt);
    if (st.fishing) {
      G.sys.updateFishing(dt);
    } else {
      G.ent.updatePlayer(dt);
    }
    G.ent.updateNpcs(dt);
    G.ent.updateEnemies(dt);
    G.ent.updateSpawn(dt);
    G.ent.updateDrops(dt);
    G.fx.update(dt);
    st.playTime += dt;
    this.saveTimer += dt;
    if (this.saveTimer > 120) { this.saveTimer = 0; G.sys.save(); }
  }

  G.render.update(dt);
  G.render.draw();
  G.ui.tick(dt);
  G.ui.updateBoss();

  // 首次启动时把镜头对准玩家
  if (!this.startedOnce) {
    this.startedOnce = true;
    G.render.snapCamera();
  }

  G.input.endFrame();
  requestAnimationFrame((t) => this.frame(t));
};

window.addEventListener('DOMContentLoaded', () => G.main.boot());

</script>
