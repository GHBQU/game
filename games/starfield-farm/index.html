<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星野农庄 · 像素农场生活</title>
<style>
/* =========================================================
   星野农庄 — 样式表（像素农场 UI）
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #0d0a12;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  color: #f0e6d2;
  user-select: none;
  -webkit-user-select: none;
}
body { display: flex; align-items: center; justify-content: center; }

#stage { position: relative; overflow: hidden; background: #121018; box-shadow: 0 0 60px #000 inset; }
#game {
  display: block; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
  cursor: crosshair;
}

#ui {
  position: absolute; inset: 0;
  font-size: clamp(10px, 1.12vmin, 14px);
  pointer-events: none;
  z-index: 5;
}
#ui button, #ui .panel, #ui .slot, #ui .modal, #ui .dlgBox { pointer-events: auto; }

/* 通用面板 */
.panel {
  background: linear-gradient(180deg, rgba(41,30,49,0.96), rgba(29,21,36,0.96));
  border: 2px solid #6b5a4a;
  box-shadow: 0 0 0 2px #15101c, 0 6px 20px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,235,190,0.14);
  border-radius: 2px;
}
.btn {
  font-family: inherit;
  font-size: 0.95em;
  color: #f6ecd2;
  background: linear-gradient(180deg, #5a4766, #3b2d49);
  border: 2px solid #8a765f;
  box-shadow: 0 2px 0 #1a1320, inset 0 1px 0 rgba(255,240,200,0.25);
  padding: 0.35em 0.8em;
  cursor: pointer;
  border-radius: 1px;
  transition: transform .06s, filter .12s;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.22); }
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 #1a1320; }
.btn:disabled { filter: grayscale(0.7) brightness(0.65); cursor: not-allowed; }
.btn.danger { border-color: #a34a4a; }
.small { font-size: 0.78em; opacity: 0.72; line-height: 1.5; }
.hidden { display: none !important; }
.money { color: #f2c14e; font-weight: 700; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#statusPanel {
  position: absolute; left: 1.1%; top: 1.2%;
  width: 22em; padding: 0.55em 0.8em 0.7em;
  pointer-events: auto;
}
.dateRow { display: flex; align-items: baseline; gap: 0.6em; }
#dateInfo { font-size: 0.95em; display: flex; flex-direction: column; line-height: 1.15; }
#dateInfo b { color: #ffe9b0; font-size: 1.05em; letter-spacing: 0.05em; }
#dateInfo span { font-size: 0.7em; opacity: 0.7; }
#clock {
  margin-left: auto; font-family: "Courier New", monospace; font-weight: 700;
  font-size: 1.25em; color: #f7dfa0; text-shadow: 2px 2px 0 #2a1e12;
}
#weatherInfo { font-size: 0.8em; color: #cfe6f2; display: flex; align-items: center; gap: 0.2em; }
#weatherInfo .wicon { font-size: 1.2em; filter: saturate(0.9); }

.bars { margin-top: 0.45em; display: flex; flex-direction: column; gap: 0.28em; }
.barRow { display: flex; align-items: center; gap: 0.35em; }
.bic { width: 1.1em; font-size: 0.85em; text-align: center; filter: drop-shadow(1px 1px 0 #000); }
.bar { flex: 1; height: 0.72em; background: #16111c; border: 1px solid #4d3f4d; position: relative; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; transition: width .25s; position: relative; }
.bar i::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.12) 0 3px, transparent 3px 6px); }
.bar.hp i { background: linear-gradient(180deg, #ef7d72, #b43d45); }
.bar.sp i { background: linear-gradient(180deg, #ffe082, #d9a02a); }
.bar.hg i { background: linear-gradient(180deg, #b9df8a, #6f9c45); }
.bt { font-size: 0.62em; opacity: 0.75; font-family: "Courier New", monospace; width: 4.4em; text-align: right; }
.lvlRow { display: flex; align-items: center; gap: 0.4em; margin-top: 0.45em; font-size: 0.72em; }
#levelInfo { color: #a8e6ff; font-weight: 700; }
.xpWrap { flex: 1; height: 0.42em; background: #16111c; border: 1px solid #3d4c5c; }
.xpWrap i { display: block; height: 100%; background: linear-gradient(90deg, #6fc3e0, #c9a8ff); width: 0; }
#goldInfo { color: #ffd76b; font-weight: 700; font-family: "Courier New", monospace; }
.coin { color: #f2c14e; font-size: 0.75em; }

#rightHud { position: absolute; right: 1.1%; top: 1.2%; display: flex; flex-direction: column; align-items: flex-end; gap: 0.4em; }
#minimapBox { padding: 0.3em; pointer-events: auto; }
#minimap { display: block; width: 10.5em; height: 10.5em; image-rendering: pixelated; background: #1a1520; }
.mmLabel { text-align: center; font-size: 0.6em; opacity: 0.65; letter-spacing: 0.1em; margin-top: 0.15em; }
#menuBtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3em; width: 15.5em; }
.iconBtn {
  font-family: inherit; font-size: 0.7em; color: #e8dcc0; background: #2b2035;
  border: 1px solid #6b5a4a; padding: 0.35em 0.2em; cursor: pointer;
  box-shadow: 0 2px 0 #140f1a; line-height: 1.1; text-align: center;
}
.iconBtn small { display: block; font-size: 0.55em; opacity: 0.45; }
.iconBtn:hover { background: #3c2d49; border-color: #c9a86a; }

/* 提示 / 教程 */
#toasts {
  position: absolute; left: 50%; top: 1.3%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 0.25em;
  width: 45em; pointer-events: none;
}
.toast {
  background: rgba(25,18,32,0.92); border-left: 3px solid #f2c14e;
  padding: 0.28em 0.8em; font-size: 0.78em; color: #f7ecd2;
  box-shadow: 0 3px 10px rgba(0,0,0,0.4); animation: toastIn .28s ease;
  transition: opacity .5s, transform .5s;
}
.toast.gold { border-left-color: #ffd76b; color: #ffeba8; }
.toast.warn { border-left-color: #d9534f; color: #ffc9c9; }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

#tutorial {
  position: absolute; left: 50%; top: 6.2em; transform: translateX(-50%);
  background: rgba(20,38,32,0.86); border: 1px solid #5f7d4a; border-left: 3px solid #9fd37a;
  padding: 0.35em 0.9em; font-size: 0.74em; color: #d9edbf; max-width: 34em; line-height: 1.4;
}
#tutorial b { color: #b8e986; margin-right: 0.5em; }

#prompt {
  position: absolute; left: 50%; bottom: 7.2em; transform: translateX(-50%);
  background: rgba(20,16,28,0.9); border: 1px solid #8a765f;
  padding: 0.28em 0.9em; font-size: 0.78em; color: #ffe9b0; letter-spacing: 0.03em;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
#prompt::before { content: '◆ '; color: #f2c14e; }

#dayBanner {
  position: absolute; left: 0; right: 0; top: 26%; text-align: center; pointer-events: none;
  opacity: 0;
}
#dayBanner small { display: block; font-size: 0.8em; letter-spacing: 0.3em; color: #cfe6f2; }
#dayBanner b { display: block; font-size: 2em; letter-spacing: 0.2em; color: #ffe9b0; text-shadow: 3px 3px 0 #2a1e12; margin-top: 0.1em; }
@keyframes dayIn { 0% { opacity: 0; transform: translateY(10px); } 15% { opacity: 1; transform: none; } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

#bossBar {
  position: absolute; left: 50%; bottom: 8.6em; transform: translateX(-50%);
  width: 26em; padding: 0.4em 0.6em; background: rgba(20,12,24,0.86);
  border: 1px solid #7a4a5a;
}
.bossName { font-size: 0.75em; color: #e8b0d0; letter-spacing: 0.2em; text-align: center; }
.bossTrack { height: 0.7em; background: #1a1018; border: 1px solid #4a2a38; margin-top: 0.2em; }
.bossFill { height: 100%; background: linear-gradient(90deg, #b04a7a, #ff8fb8); transition: width .2s; }

/* 快捷栏 */
#hotbarWrap {
  position: absolute; left: 50%; bottom: 1.2em; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 0.3em;
}
#selName { font-size: 0.72em; color: #ffe9b0; text-shadow: 1px 1px 0 #000; background: rgba(20,16,28,0.7); padding: 0.12em 0.7em; border: 1px solid #5a4766; }
#hotbar { display: flex; gap: 0.28em; padding: 0.3em; background: rgba(24,18,32,0.85); border: 2px solid #6b5a4a; box-shadow: 0 3px 12px rgba(0,0,0,0.5); }
.slot {
  width: 2.9em; height: 2.9em; background: #241b2c; border: 1px solid #4a3b50;
  position: relative; cursor: pointer;
}
.slot img { width: 100%; height: 100%; image-rendering: pixelated; padding: 0.12em; }
.slot .key { position: absolute; left: 0.1em; top: 0; font-size: 0.5em; color: #8a7a90; }
.slot .num { position: absolute; right: 0.15em; bottom: 0; font-size: 0.58em; color: #ffe9b0; font-family: "Courier New", monospace; text-shadow: 1px 1px 0 #000; }
.slot.sel { border: 2px solid #f2c14e; box-shadow: 0 0 0 1px #2a1e12, 0 0 10px rgba(242,193,78,0.45); transform: translateY(-2px); }

#buildBanner {
  position: absolute; left: 50%; bottom: 8.8em; transform: translateX(-50%);
  background: rgba(30,42,30,0.92); border: 1px solid #9fd37a; padding: 0.3em 0.9em;
  font-size: 0.75em; color: #d9edbf;
}
#buildBanner b { color: #b8e986; margin-right: 0.4em; }
#buildBanner button { margin-left: 0.6em; font-size: 0.9em; }

/* 模态框 */
#modalWrap {
  position: absolute; inset: 0; z-index: 40; background: rgba(8,6,12,0.62);
  display: flex; align-items: center; justify-content: center; pointer-events: auto;
}
#modal {
  width: min(72em, 94%);
  max-height: 84vh;
  display: flex; flex-direction: column;
  padding: 0;
  animation: modalIn .18s ease;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
.modalHead { display: flex; align-items: center; gap: 1em; padding: 0.45em 0.7em; border-bottom: 2px solid #4a3b50; background: rgba(60,45,70,0.5); }
.modalHead h2 { font-size: 1.05em; letter-spacing: 0.15em; color: #ffe9b0; font-weight: 600; }
#modalClose {
  margin-left: auto; width: 1.8em; height: 1.8em; background: #3a2b45; color: #e8dcc0;
  border: 1px solid #8a765f; cursor: pointer; font-size: 0.9em;
}
#modalClose:hover { background: #5a3a45; }
#modalBody { padding: 0.8em 0.9em; overflow-y: auto; font-size: 0.88em; line-height: 1.5; min-height: 0; flex: 1 1 auto; }

/* 背包 */
.invTop { display: flex; justify-content: space-between; font-size: 0.8em; opacity: 0.8; margin-bottom: 0.5em; }
.invGrid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0.3em; }
.invSlot {
  aspect-ratio: 1/1; background: #221a2b; border: 1px solid #4a3b50; position: relative; cursor: pointer;
}
.invSlot.hot { border-color: #8a765f; background: #2b2135; }
.invSlot.sel { border: 2px solid #f2c14e; }
.invSlot img { width: 100%; height: 100%; image-rendering: pixelated; padding: 10%; }
.invSlot .num { position: absolute; right: 0.15em; bottom: 0.05em; font-size: 0.6em; color: #ffe9b0; text-shadow: 1px 1px 0 #000; }
.invSlot .key { position: absolute; left: 0.1em; top: 0; font-size: 0.5em; color: #8a7a90; }
.itemDetail { margin-top: 0.7em; padding: 0.6em; border: 1px solid #4a3b50; background: #1e1728; display: flex; gap: 0.8em; align-items: center; }
.itemDetail .idTop { display: flex; gap: 0.6em; align-items: flex-start; }
.itemDetail img { width: 2.2em; height: 2.2em; image-rendering: pixelated; }
.itemDetail b { display: block; color: #ffe9b0; }
.itemDetail span { font-size: 0.78em; opacity: 0.72; }
.idBtns { margin-left: auto; display: flex; gap: 0.4em; }
.invFoot { display: flex; align-items: center; gap: 0.8em; margin-top: 0.7em; }

/* 制作 */
.recipeList { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35em; align-content: start; }
.recipe { display: flex; align-items: center; gap: 0.6em; padding: 0.4em 0.5em; background: #221a2b; border: 1px solid #3f3048; }
.recipe.dim { opacity: 0.62; }
.recipe img { width: 1.9em; height: 1.9em; image-rendering: pixelated; }
.rcMain { flex: 1; }
.rcMain b { color: #ffe9b0; font-weight: 600; }
.needs { display: flex; gap: 0.6em; flex-wrap: wrap; font-size: 0.75em; margin-top: 0.15em; }
.needs .ok { color: #a9d98a; }
.needs .no { color: #e88b8b; }
.rcStation { font-size: 0.66em; opacity: 0.55; }

/* 商店 */
.shopHead { display: flex; gap: 0.7em; align-items: center; padding-bottom: 0.6em; border-bottom: 1px solid #3f3048; }
.portrait { width: 3.4em; height: 3.4em; display: flex; align-items: center; justify-content: center; background: #3a2b45; border: 2px solid #8a765f; font-size: 0.85em; color: #ffe9b0; text-align: center; line-height: 1.2; }
.portrait.big { width: 4.4em; height: 4.4em; }
.portrait.kid { width: 3em; height: 3em; background: #4a3a2a; }
.shopHead b { display: block; color: #ffe9b0; }
.tabs { display: flex; gap: 0.4em; margin: 0.6em 0; }
.tab { font-family: inherit; font-size: 0.85em; padding: 0.25em 1.2em; background: #2b2035; color: #cbbdae; border: 1px solid #4a3b50; cursor: pointer; }
.tab.on { background: #5a4766; color: #ffe9b0; border-color: #c9a86a; }
.shopList { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3em; align-content: start; }
.shopRow { display: flex; align-items: center; gap: 0.55em; padding: 0.35em 0.4em; background: #221a2b; border: 1px solid #362a3e; }
.shopRow img { width: 1.7em; height: 1.7em; image-rendering: pixelated; }
.srMain { flex: 1; }
.srMain b { display: block; color: #f4e7c0; font-size: 0.9em; }
.srMain span { font-size: 0.8em; opacity: 0.6; }
.srPrice { color: #ffd76b; font-family: "Courier New", monospace; font-size: 0.9em; }

/* 任务 */
.storyBox { background: linear-gradient(135deg, rgba(40,35,62,0.9), rgba(28,22,38,0.9)); border: 1px solid #5f4a72; padding: 0.7em 0.8em; margin-bottom: 0.7em; }
.storyTitle { color: #cbb7ff; letter-spacing: 0.2em; font-size: 0.9em; margin-bottom: 0.3em; }
.storyBox p { font-size: 0.82em; opacity: 0.8; line-height: 1.6; }
.shardRow { display: flex; gap: 0.5em; margin: 0.6em 0; }
.shard { flex: 1; display: flex; align-items: center; gap: 0.35em; padding: 0.35em; background: #1c1626; border: 1px solid #3f3048; }
.shard.got { border-color: #8fe6ff; box-shadow: inset 0 0 12px rgba(143,230,255,0.15); }
.shard img { width: 1.5em; height: 1.5em; image-rendering: pixelated; }
.shard span { font-size: 0.72em; color: #d9cbb0; }
.shard b { margin-left: auto; font-size: 0.65em; color: #8fe6ff; }
.questList { display: flex; flex-direction: column; gap: 0.4em; }
.qHead { color: #ffe9b0; font-size: 0.85em; letter-spacing: 0.15em; margin-bottom: 0.2em; }
.quest { display: flex; align-items: center; gap: 0.6em; padding: 0.45em 0.55em; background: #221a2b; border: 1px solid #3f3048; }
.qMain { flex: 1; }
.qMain b { font-size: 0.85em; color: #f4e7c0; font-weight: 500; }
.qBarWrap { height: 0.45em; background: #16111c; border: 1px solid #3d4a4f; margin: 0.3em 0 0.15em; }
.qBar { height: 100%; background: linear-gradient(90deg, #7fae5a, #c9e88a); }
.qReward { text-align: right; font-size: 0.75em; color: #ffd76b; line-height: 1.3; }
.statGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.3em; margin-top: 0.7em; }
.statGrid div { background: #1c1626; border: 1px solid #362a3e; text-align: center; padding: 0.3em; }
.statGrid span { display: block; font-size: 0.65em; opacity: 0.6; }
.statGrid b { color: #ffe9b0; }

/* 家庭 */
.familyTop { display: flex; gap: 0.8em; align-items: center; padding-bottom: 0.6em; border-bottom: 1px solid #3f3048; }
.famInfo b { font-size: 1em; color: #ffe9b0; display: block; }
.famInfo span { font-size: 0.78em; opacity: 0.7; display: block; margin-top: 0.2em; }
.hearts { display: flex; gap: 0.1em; margin: 0.35em 0; }
.hearts i { font-style: normal; color: #4a3040; font-size: 0.9em; }
.hearts i.on { color: #ff8fb8; text-shadow: 0 0 6px rgba(255,143,184,0.6); }
.famStats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4em; margin: 0.7em 0; }
.famStats div { background: #221a2b; border: 1px solid #3f3048; padding: 0.4em; }
.famStats span { display: block; font-size: 0.68em; opacity: 0.65; }
.famStats b { color: #ffe9b0; font-size: 0.95em; }
.miniBar { height: 0.35em; background: #16111c; margin-top: 0.3em; border: 1px solid #3d2a35; }
.miniBar div { height: 100%; background: #ff8fb8; }
.childBox { display: flex; gap: 0.7em; align-items: center; padding: 0.5em; border: 1px solid #3f3048; background: #1e1828; }
.childBox b { display: block; color: #ffe9b0; }
.houseBlock { display: flex; align-items: center; gap: 1em; justify-content: space-between; margin-top: 0.7em; padding: 0.55em; background: #221a2b; border: 1px solid #3f3048; }
.houseBlock b { display: block; color: #ffe9b0; }
.familyList { margin-top: 0.6em; display: flex; flex-direction: column; gap: 0.3em; }
.famRow { display: flex; gap: 0.5em; align-items: center; font-size: 0.8em; }
.famRow img { width: 1.3em; height: 1.3em; image-rendering: pixelated; }
.famRow b { color: #d9cbb0; display: block; }

/* 技能 */
.levelBox { display: flex; gap: 0.9em; align-items: center; padding: 0.6em; background: #221a2b; border: 1px solid #3f3048; }
.lvlCircle { width: 3em; height: 3em; border-radius: 50%; border: 2px solid #8fe6ff; display: flex; align-items: center; justify-content: center; color: #a8e6ff; font-weight: 700; box-shadow: 0 0 12px rgba(143,230,255,0.25); }
.levelBox b { color: #ffe9b0; }
.xpWrap.big { height: 0.55em; background: #16111c; border: 1px solid #3d4a5c; margin: 0.3em 0; width: 18em; }
.xpFill { height: 100%; background: linear-gradient(90deg, #6fc3e0, #c9a8ff); }
.perkGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.35em; margin-top: 0.6em; }
.perk { display: flex; gap: 0.4em; align-items: center; padding: 0.4em; background: #1e1828; border: 1px solid #362a3e; opacity: 0.55; }
.perk.on { opacity: 1; border-color: #8fe6ff; background: #202230; }
.perk i { font-style: normal; font-size: 1.2em; }
.perk b { font-size: 0.8em; color: #f4e7c0; display: block; }
.perk span { font-size: 0.68em; opacity: 0.65; }
.perkChoices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6em; margin-top: 0.5em; }
.perkCard { font-family: inherit; text-align: left; background: linear-gradient(180deg, #3a2b45, #241b2c); border: 2px solid #8a765f; padding: 0.7em; cursor: pointer; color: #f4e7c0; }
.perkCard:hover { border-color: #f2c14e; background: linear-gradient(180deg, #4a3757, #2b2035); }
.perkCard i { font-style: normal; font-size: 1.7em; display: block; margin-bottom: 0.3em; }
.perkCard b { display: block; color: #ffe9b0; margin-bottom: 0.25em; }
.perkCard span { font-size: 0.8em; opacity: 0.75; line-height: 1.5; }

/* 地图 */
#mapCanvas { display: block; width: 100%; max-width: 32em; aspect-ratio: 1/1; margin: 0 auto; image-rendering: pixelated; border: 1px solid #4a3b50; }

/* 菜单 */
.menuList { display: flex; flex-direction: column; gap: 0.35em; }
.menuBtn { font-family: inherit; text-align: left; padding: 0.5em 0.9em; background: #2b2035; border: 1px solid #4a3b50; color: #e8dcc0; cursor: pointer; font-size: 0.9em; }
.menuBtn:hover { background: #3c2d49; border-color: #8a765f; }
.menuBtn.danger { color: #e88b8b; border-color: #6a3a3a; }
.credits { margin-top: 1em; font-size: 0.7em; opacity: 0.45; line-height: 1.7; text-align: center; }

/* 对话 */
#dialogue { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: auto; padding: 0 8%; }
.dlgBox {
  position: relative;
  background: linear-gradient(180deg, rgba(38,28,48,0.97), rgba(22,17,30,0.97));

<script>
/* ===== js/00_core.js ===== */
/* =========================================================
   星野农庄 — 00 核心：常量 / 工具 / 随机 / 噪声 / 输入 / 音频
   ========================================================= */
const G = (window.G = {});

G.VERSION = '1.0';
G.TILE = 16;
G.W = 480;          // 内部分辨率
G.H = 270;
G.SCALE = 3;

G.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
G.lerp = (a, b, t) => a + (b - a) * t;
G.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
G.rand = (a = 1, b = 0) => b + Math.random() * (a - b);
G.pick = (arr) => arr[(Math.random() * arr.length) | 0];
G.chance = (p) => Math.random() < p;
G.sign = (v) => (v < 0 ? -1 : 1);
G.fmtNum = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n));
G.pad = (n, l = 2) => String(n).padStart(l, '0');

/* 确定性随机 */
G.mulberry32 = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

/* 2D 值噪声 + 分形 */
G.makeNoise = function (seed) {
  const rnd = G.mulberry32(seed);
  const perm = new Uint8Array(512);
  const base = new Uint8Array(256);
  for (let i = 0; i < 256; i++) base[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    const t = base[i]; base[i] = base[j]; base[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = base[i & 255];
  const grad = (h, x, y) => {
    const a = perm[h] & 1 ? -1 : 1;
    const b = perm[h + 1] & 1 ? -1 : 1;
    return a * x + b * y;
  };
  function noise(x, y) {
    const X = Math.floor(x), Y = Math.floor(y);
    const fx = x - X, fy = y - Y;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const h = perm[(perm[X & 255] + (Y & 255)) & 511];
    const v00 = (perm[(perm[X & 255] + (Y & 255)) & 255] / 255) * 2 - 1;
    const v10 = (perm[(perm[(X + 1) & 255] + (Y & 255)) & 255] / 255) * 2 - 1;
    const v01 = (perm[(perm[X & 255] + ((Y + 1) & 255)) & 255] / 255) * 2 - 1;
    const v11 = (perm[(perm[(X + 1) & 255] + ((Y + 1) & 255)) & 255] / 255) * 2 - 1;
    return G.lerp(G.lerp(v00, v10, u), G.lerp(v01, v11, u), v);
  }
  function fbm(x, y, oct = 4, lac = 2, gain = 0.5) {
    let amp = 1, freq = 1, sum = 0, norm = 0;
    for (let i = 0; i < oct; i++) {
      sum += noise(x * freq, y * freq) * amp;
      norm += amp; amp *= gain; freq *= lac;
    }
    return sum / norm;
  }
  return { noise, fbm };
};

/* 网格索引 */
G.idx = (x, y, w) => y * w + x;

/* ---------------- 输入 ---------------- */
G.input = {
  keys: {},
  pressed: {},
  mouse: { x: 0, y: 0, wx: 0, wy: 0, down: false, clicked: false, rclicked: false, wheel: 0 },
  touch: { active: false, dx: 0, dy: 0, using: false },
  init(canvas) {
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
      if (!this.keys[e.code]) this.pressed[e.code] = true;
      this.keys[e.code] = true;
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      this.mouse.x = ((e.clientX - r.left) / r.width) * G.W;
      this.mouse.y = ((e.clientY - r.top) / r.height) * G.H;
    });
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) { this.mouse.down = true; this.mouse.clicked = true; }
      if (e.button === 2) this.mouse.rclicked = true;
      G.audio.ensure();
    });
    window.addEventListener('mouseup', () => { this.mouse.down = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('wheel', (e) => { this.mouse.wheel = Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchstart', () => { this.touch.active = true; }, { passive: true });
  },
  endFrame() {
    this.pressed = {};
    this.mouse.clicked = false;
    this.mouse.rclicked = false;
    this.mouse.wheel = 0;
  },
  key(code) { return !!this.keys[code]; },
  hit(code) { return !!this.pressed[code]; },
  axis() {
    let x = 0, y = 0;
    if (this.key('KeyA') || this.key('ArrowLeft')) x -= 1;
    if (this.key('KeyD') || this.key('ArrowRight')) x += 1;
    if (this.key('KeyW') || this.key('ArrowUp')) y -= 1;
    if (this.key('KeyS') || this.key('ArrowDown')) y += 1;
    if (this.touch.using) { x += this.touch.dx; y += this.touch.dy; }
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    return { x, y };
  },
};

/* ---------------- 音频 ---------------- */
G.audio = {
  ctx: null,
  master: null,
  musicGain: null,
  sfxGain: null,
  muted: false,
  musicTimer: null,
  step: 0,
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.16;
      this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.8;
      this.sfxGain.connect(this.master);
      this.startMusic();
    } catch (e) { console.warn('audio off', e); }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.55;
  },
  tone(freq, dur, type = 'square', vol = 0.5, dest = null, slide = 0, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(dest || this.sfxGain);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  noise(dur, vol = 0.4, dest = null, filterFreq = 1200) {
    if (!this.ctx || this.muted) return;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = filterFreq;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(dest || this.sfxGain);
    src.start();
  },
  play(name) {
    this.ensure();
    if (!this.ctx || this.muted) return;
    switch (name) {
      case 'swing': this.noise(0.12, 0.25, null, 3000); this.tone(520, 0.08, 'square', 0.18, null, -200); break;
      case 'hit': this.noise(0.1, 0.4, null, 900); this.tone(160, 0.1, 'square', 0.3, null, -60); break;
      case 'crit': this.tone(880, 0.08, 'square', 0.3); this.tone(1200, 0.1, 'square', 0.2, null, 0, 0.06); this.noise(0.14, 0.35, null, 700); break;
      case 'chop': this.noise(0.16, 0.45, null, 600); this.tone(220, 0.1, 'triangle', 0.3, null, -100); break;
      case 'mine': this.noise(0.1, 0.35, null, 2400); this.tone(700, 0.08, 'square', 0.22, null, -300); break;
      case 'till': this.noise(0.14, 0.3, null, 500); break;
      case 'water': this.noise(0.26, 0.22, null, 1800); break;
      case 'plant': this.tone(520, 0.08, 'triangle', 0.12, null, 140); break;
      case 'harvest': this.tone(660, 0.08, 'square', 0.18, null, 120); this.tone(990, 0.1, 'square', 0.14, null, 0, 0.07); break;
      case 'pickup': this.tone(880, 0.06, 'triangle', 0.22, null, 300); break;
      case 'coin': this.tone(1040, 0.07, 'square', 0.2); this.tone(1560, 0.09, 'square', 0.15, null, 0, 0.05); break;
      case 'eat': this.noise(0.12, 0.2, null, 350); this.tone(300, 0.06, 'triangle', 0.15, null, -100); break;
      case 'sleep': this.tone(260, 0.5, 'sine', 0.2, null, -100); this.tone(180, 0.6, 'sine', 0.14, null, -40, 0.2); break;
      case 'level': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, 'square', 0.16, null, 0, i * 0.09)); break;
      case 'ui': this.tone(620, 0.04, 'square', 0.12); break;
      case 'error': this.tone(180, 0.12, 'square', 0.16, null, -40); break;
      case 'splash': this.noise(0.3, 0.35, null, 900); this.tone(420, 0.2, 'sine', 0.1, null, -220); break;
      case 'fishbite': this.tone(760, 0.06, 'square', 0.18); this.tone(500, 0.1, 'square', 0.16, null, 0, 0.08); break;
      case 'hurt': this.tone(220, 0.2, 'square', 0.3, null, -120); this.noise(0.16, 0.3, null, 500); break;
      case 'roar': this.tone(80, 0.8, 'sawtooth', 0.35, null, 40); this.noise(0.7, 0.4, null, 300); break;
      case 'bell': this.tone(880, 0.4, 'sine', 0.2); this.tone(1320, 0.5, 'sine', 0.1, null, 0, 0.1); break;
      case 'door': this.tone(300, 0.12, 'triangle', 0.2, null, 80); break;
    }
  },
  startMusic() {
    if (this.musicTimer) return;
    const themes = {
      day: [0, 4, 7, 12, 7, 4, 2, 7, 9, 12, 16, 12, 9, 7, 4, 0],
      night: [0, 3, 7, 10, 7, 3, -2, 3, 5, 7, 12, 10, 7, 5, 3, 0],
      cave: [0, 0, 5, 3, 0, -2, 0, 5, 7, 5, 3, 0, -2, 0, 3, 5],
    };
    const base = { day: 261.6, night: 220, cave: 174 };
    const tick = () => {
      if (!this.ctx || this.muted) { this.musicTimer = setTimeout(tick, 900); return; }
      const mode = G.state && G.state.map && G.state.map.dungeon ? 'cave' : (G.time && G.time.isNight && G.time.isNight() ? 'night' : 'day');
      const seq = themes[mode];
      const n = seq[this.step % seq.length];
      const freq = base[mode] * Math.pow(2, n / 12);
      this.tone(freq, 0.5, 'triangle', 0.14, this.musicGain);
      this.tone(freq * 1.5, 0.4, 'sine', 0.06, this.musicGain);
      if (this.step % 8 === 0) this.tone(base[mode] * 0.5 * Math.pow(2, (seq[(this.step + 5) % seq.length]) / 12), 1.4, 'sine', 0.07, this.musicGain);
      this.step++;
      this.musicTimer = setTimeout(tick, mode === 'cave' ? 620 : 480);
    };
    tick();
  },
};


/* ===== js/10_sprites.js ===== */
/* =========================================================
   星野农庄 — 10 像素美术：程序化生成所有精灵，无外部素材
   ========================================================= */
G.art = { s: {}, tiles: {}, icons: {}, built: false };

G.art.newCanvas = function (w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return { c, x };
};

G.art.px = (x, px, py, col) => { x.fillStyle = col; x.fillRect(Math.floor(px), Math.floor(py), 1, 1); };

G.art.rect = function (x, rx, ry, rw, rh, col) {
  x.fillStyle = col; x.fillRect(Math.floor(rx), Math.floor(ry), Math.floor(rw), Math.floor(rh));
};

G.art.ellipse = function (x, cx, cy, rx, ry, col) {
  x.fillStyle = col;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    for (let xx = Math.floor(cx - rx); xx <= Math.ceil(cx + rx); xx++) {
      const dx = (xx - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy <= 1) x.fillRect(xx, y, 1, 1);
    }
  }
};

G.art.line = function (x, x1, y1, x2, y2, col) {
  x.fillStyle = col;
  const dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1);
  const sx = x1 < x2 ? 1 : -1, sy = y1 < y2 ? 1 : -1;
  let err = dx - dy, px = x1, py = y1;
  for (let i = 0; i < 400; i++) {
    x.fillRect(px, py, 1, 1);
    if (px === x2 && py === y2) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; px += sx; }
    if (e2 < dx) { err += dx; py += sy; }
  }
};

/* 给精灵描一圈深色轮廓（像素风味的关键） */
G.art.outline = function (canvas, color = '#251b2a') {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0, 0, w, h).data;
  const out = ctx.createImageData(w, h);
  const od = out.data;
  const rgb = [parseInt(color.slice(1, 3), 16), parseInt(color.slice(3, 5), 16), parseInt(color.slice(5, 7), 16)];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      od[i] = img[i]; od[i + 1] = img[i + 1]; od[i + 2] = img[i + 2]; od[i + 3] = img[i + 3];
      if (img[i + 3] === 0) {
        let solid = false;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          if (img[(ny * w + nx) * 4 + 3] > 12) { solid = true; break; }
        }
        if (solid) { od[i] = rgb[0]; od[i + 1] = rgb[1]; od[i + 2] = rgb[2]; od[i + 3] = 255; }
      }
    }
  }
  ctx.putImageData(out, 0, 0);
  return canvas;
};

/* ASCII 精灵 */
G.art.fromRows = function (rows, pal) {
  const w = Math.max(...rows.map((r) => r.length));
  const h = rows.length;
  const { c, x } = G.art.newCanvas(w, h);
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let xx = 0; xx < row.length; xx++) {
      const ch = row[xx];
      if (ch !== '.' && ch !== ' ' && pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(xx, y, 1, 1); }
    }
  }
  return c;
};

    G.art.rect(x, 5, headY, 7, 7, hair);

    G.art.rect(x, 9, headY + 2, 2, 3, skin);
    G.art.rect(x, 10, headY + 3, 1, 1, '#2a1d20');

  G.art.outline(c);
  if (o.small) {

    out.x.imageSmoothingEnabled = false;
    out.x.drawImage(c, 2, 2, 12, 18, 0, 0, 12, 18);
    return out.c;

  return c;

})();

G.world.newMap = function (w, h, id) {
  const map = {
    id, w, h,
    ground: new Uint8Array(w * h),
    solid: new Uint8Array(w * h),
    biome: new Uint8Array(w * h),
    objs: [],
    objAt: new Map(),
    deco: [],
    farm: new Map(),
    dungeon: false, floor: 0, seed: 0,
    spawn: { x: w / 2 * 16, y: h / 2 * 16 },
    explored: new Uint8Array(w * h),
    lights: [],
  };
  return map;
};

G.world.tileGround = (map, tx, ty) => {
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return -1;
  return map.ground[ty * map.w + tx];
};

G.world.isSolid = function (map, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return true;
  return map.solid[ty * map.w + tx] === 1;
};

G.world.setGround = function (map, tx, ty, g) {
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return;
  map.ground[ty * map.w + tx] = g;
};

G.world.setSolid = function (map, tx, ty, v) {
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return;
  map.solid[ty * map.w + tx] = v ? 1 : 0;
};

G.world.addObj = function (map, type, tx, ty, extra) {
  const def = G.world.DEFS[type];
  if (!def) { console.warn('unknown obj', type); return null; }
  const o = Object.assign({
    type, tx, ty, def,
    x: tx * 16 + 8, y: (ty + 1) * 16,
    hp: def.hp || 1, variant: 0, age: 0,
  }, extra || {});
  map.objs.push(o);
  map.objAt.set(ty * map.w + tx, o);
  // 占格
  if (def.solid) {
    const half = Math.floor((def.sw - 1) / 2);
    const x0 = def.sw === 1 ? tx : tx - half;
    const y0 = ty - def.sh + 1;
    for (let yy = 0; yy < def.sh; yy++) for (let xx = 0; xx < def.sw; xx++) {
      G.world.setSolid(map, x0 + xx, y0 + yy, 1);
    }
    o.footprint = { x0, y0, w: def.sw, h: def.sh };
  }
  return o;
};

G.world.removeObj = function (map, o) {
  const i = map.objs.indexOf(o);
  if (i >= 0) map.objs.splice(i, 1);
  const key = o.ty * map.w + o.tx;
  if (map.objAt.get(key) === o) map.objAt.delete(key);
  if (o.def.solid && o.footprint) {
    for (let yy = 0; yy < o.footprint.h; yy++) for (let xx = 0; xx < o.footprint.w; xx++) {
      const tx = o.footprint.x0 + xx, ty = o.footprint.y0 + yy;
      // 其他对象仍占格？
      let occupied = false;
      for (const other of map.objs) {
        if (!other.def.solid || !other.footprint) continue;
        if (other === o) continue;
        if (tx >= other.footprint.x0 && tx < other.footprint.x0 + other.footprint.w &&
          ty >= other.footprint.y0 && ty < other.footprint.y0 + other.footprint.h) { occupied = true; break; }
      }
      if (!occupied) G.world.setSolid(map, tx, ty, 0);
    }
  }
};

G.world.objAt = function (map, tx, ty) {
  return map.objAt.get(ty * map.w + tx) || null;
};

/* 地形上能否站立 */
G.world.walkable = function (map, tx, ty) {
  const g = G.world.tileGround(map, tx, ty);
  if (g < 0) return false;
  if (g === G.world.GT.WATER || g === G.world.GT.WALL) return false;
  return !G.world.isSolid(map, tx, ty);
};

/* ---------------- 地表生成 ---------------- */
G.world.genOverworld = function (seed) {
  const w = 240, h = 240;
  const map = G.world.newMap(w, h, 'over');
  map.seed = seed;
  const noise = G.makeNoise(seed);
  const noise2 = G.makeNoise(seed + 99);
  const noise3 = G.makeNoise(seed + 1717);
  const GT = G.world.GT, BI = G.world.BIOME;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      let e = 0.5 + 0.5 * noise.fbm(x * 0.032, y * 0.032, 4, 2, 0.55);
      // 边缘隆起成为屏障
      const edge = Math.min(x, y, w - 1 - x, h - 1 - y);
      if (edge < 14) e += (14 - edge) * 0.035;
      const moist = 0.5 + 0.5 * noise2.fbm(x * 0.045, y * 0.045, 3);
      const temp = 0.86 - (y / h) * 0.78 + 0.12 * noise3.fbm(x * 0.03, y * 0.03, 2);
      let g, b;
      if (e < 0.305) { g = GT.WATER; b = BI.WATER; }
      else if (e > 0.775 || edge < 3) { g = GT.ROCK; b = BI.ROCK; }
      else if (temp < 0.20) { g = GT.SNOW; b = BI.SNOW; }
      else if (temp > 0.72 && moist < 0.40) { g = GT.SAND; b = BI.DESERT; }
      else if (moist > 0.58) { g = GT.GRASS; b = BI.FOREST; }
      else { g = GT.GRASS; b = BI.MEADOW; }
      map.ground[i] = g;
      map.biome[i] = b;
      map.solid[i] = (g === GT.WATER || g === GT.ROCK) ? 1 : 0;
    }
  }

  // 沙漠 / 雪原大区，保证地标在对应生态
  for (let y = 150; y < h - 12; y++) for (let x = 168; x < w - 12; x++) {
    if (map.ground[y * w + x] !== GT.WATER) {
      map.ground[y * w + x] = GT.SAND; map.biome[y * w + x] = BI.DESERT;
      map.solid[y * w + x] = 0;
    }
  }
  for (let y = 12; y < 52; y++) for (let x = 90; x < 160; x++) {
    if (map.ground[y * w + x] !== GT.WATER) {
      map.ground[y * w + x] = GT.SNOW; map.biome[y * w + x] = BI.SNOW;
      map.solid[y * w + x] = 0;
    }
  }

  const rnd = G.mulberry32(seed + 5);

  function clearing(cx, cy, rx, ry, ground) {
    for (let y = cy - ry; y <= cy + ry; y++) for (let x = cx - rx; x <= cx + rx; x++) {
      if (x < 1 || y < 1 || x >= w - 1 || y >= h - 1) continue;
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy > 1) continue;
      const i = y * w + x;
      if (ground !== undefined) map.ground[i] = ground;
      map.solid[i] = 0;
      map.biome[i] = ground === GT.SAND ? BI.DESERT : ground === GT.SNOW ? BI.SNOW : BI.MEADOW;
      // 移除已有对象
      const o = map.objAt.get(i);
      if (o) G.world.removeObj(map, o);
    }
  }

  // 庄园空地
  clearing(60, 122, 21, 15, GT.GRASS);
  clearing(90, 138, 7, 6, GT.GRASS);

  // 小溪 / 湖
  for (let y = 146; y < 166; y++) for (let x = 36; x < 57; x++) {
    const dx = (x - 46) / 10, dy = (y - 156) / 7;
    if (dx * dx + dy * dy < 1) {
      const i = y * w + x;
      map.ground[i] = GT.WATER; map.solid[i] = 1; map.biome[i] = BI.WATER;
    }
  }

  // 小路（逐格 Bresenham，避免出现整块广场）
  function path(x1, y1, x2, y2, width = 0) {
    let x = x1, y = y1;
    for (let guard = 0; guard < 400; guard++) {
      for (let dy = -width; dy <= width; dy++) for (let dx = -width; dx <= width; dx++) {
        const tx = x + dx, ty = y + dy;
        if (tx < 1 || ty < 1 || tx >= w - 1 || ty >= h - 1) continue;
        const i = ty * w + tx;
        if (map.ground[i] === GT.WATER) continue;
        map.ground[i] = GT.PATH; map.solid[i] = 0;
        const o = map.objAt.get(i);
        if (o && !['house', 'hut', 'shopStall', 'well', 'shrine'].includes(o.type)) G.world.removeObj(map, o);
      }
      if (x === x2 && y === y2) break;
      const dx = Math.abs(x2 - x), dy = Math.abs(y2 - y);
      if (dx >= dy) x += G.sign(x2 - x); else y += G.sign(y2 - y);
    }
  }
  path(60, 121, 60, 128, 0);
  path(60, 120, 72, 126, 0);
  path(72, 126, 90, 136, 0);
  path(63, 121, 69, 119, 0);
  path(56, 121, 52, 121, 0);
  path(90, 136, 118, 127, 0);
  path(118, 127, 150, 118, 0);

  // 地标
  const home = G.world.addObj(map, 'house', 60, 118, { level: 1, door: true, name: '农舍' });
  map.home = home;
  G.world.addObj(map, 'well', 52, 120, {});
  G.world.addObj(map, 'shrine', 60, 110, { shards: [] });
  G.world.addObj(map, 'hut', 70, 117, { npc: 'leah', name: '莉娅的小屋' });
  G.world.addObj(map, 'shopStall', 90, 140, { shop: true });
  G.world.addObj(map, 'sign', 63, 121, { text: '星野农庄 · 向下的路通往裂谷' });
  G.world.addObj(map, 'sign', 88, 141, { text: '老陈的货摊 · 09:00-17:00' });

  // 农场初始菜畦（整片开垦，周围留出空地）
  clearing(58, 125, 6, 4, GT.GRASS);
  // 先给一小块熟地，其余留作可开垦的草地
  for (let y = 123; y <= 125; y++) for (let x = 56; x <= 59; x++) {
    const i = y * w + x;
    if (map.ground[i] !== GT.WATER) {
      map.farm.set(i, { tilled: true, wet: false, growth: 0, crop: null, regrow: 0 });
    }
  }

  // 渔屋
  clearing(50, 146, 4, 3, GT.GRASS);
  G.world.addObj(map, 'hut', 50, 147, { npc: 'fisher' });
  G.world.addObj(map, 'sign', 47, 148, { text: '小心水边的夜鳗' });

  // 裂谷入口
  clearing(150, 118, 6, 5, GT.ROCK);
  G.world.addObj(map, 'entrance', 150, 118, { dungeon: true });
  G.world.addObj(map, 'sign', 146, 120, { text: '裂谷 · 深处的骨头会醒来' });
  for (let i = 0; i < 5; i++) G.world.addObj(map, 'rock', 144 + ((rnd() * 12) | 0), 112 + ((rnd() * 8) | 0), { variant: (rnd() * 3) | 0 });

  // 沙漠旧城遗迹
  clearing(196, 178, 12, 9, GT.SAND);
  for (let i = 0; i < 7; i++) G.world.addObj(map, 'pillar', 186 + i * 3 + ((rnd() * 2) | 0), 170 + ((rnd() * 3) | 0), {});
  G.world.addObj(map, 'chest', 196, 174, { loot: [{ id: 'shard2', n: 1 }, { id: 'gold', n: 4 }, { id: 'crystal', n: 2 }], opened: false, special: true });
  G.world.addObj(map, 'sign', 202, 180, { text: '沙丘之下，旧城的钟还在响' });
  for (let i = 0; i < 6; i++) G.world.addObj(map, 'cactus', 188 + ((rnd() * 18) | 0), 177 + ((rnd() * 8) | 0), {});

  // 雪线宝箱
  clearing(120, 26, 6, 5, GT.SNOW);
  G.world.addObj(map, 'chest', 120, 28, { loot: [{ id: 'shard3', n: 1 }, { id: 'crystal', n: 3 }, { id: 'gold', n: 2 }], opened: false, special: true });
  G.world.addObj(map, 'sign', 116, 30, { text: '雪线之上，星光更近' });

  // 守林人
  clearing(34, 72, 5, 4, GT.GRASS);
  G.world.addObj(map, 'hut', 34, 74, { npc: 'hermit' });
  G.world.addObj(map, 'campfire', 37, 73, {});

  // 地表植被与物件
  for (let y = 2; y < h - 2; y++) {
    for (let x = 2; x < w - 2; x++) {
      const i = y * w + x;
      if (map.objAt.has(i)) continue;
      if (map.farm.has(i)) continue;
      const g = map.ground[i], b = map.biome[i];
      if (g === GT.WATER || g === GT.ROCK || g === GT.WALL) continue;
      if (map.solid[i]) continue;
      if (g === GT.PATH) continue;
      const r = rnd();
      if (b === BI.FOREST) {
        if (r < 0.30) G.world.addObj(map, 'tree', x, y, { variant: (rnd() * 3) | 0, hp: 4 });
        else if (r < 0.345) G.world.addObj(map, 'bush', x, y, { ready: true });
        else if (r < 0.39) G.world.addObj(map, 'flower', x, y, { variant: (rnd() * 4) | 0 });
        else if (r < 0.415) G.world.addObj(map, 'mushroom', x, y, {});
        else if (r < 0.435) G.world.addObj(map, 'rock', x, y, { variant: (rnd() * 3) | 0 });
        else if (r < 0.46) map.deco.push({ x, y, s: 'tuft', o: (rnd() * 6) | 0 });
      } else if (b === BI.MEADOW) {
        if (r < 0.055) G.world.addObj(map, 'tree', x, y, { variant: (rnd() * 3) | 0 });
        else if (r < 0.085) G.world.addObj(map, 'bush', x, y, { ready: true });
        else if (r < 0.19) G.world.addObj(map, 'flower', x, y, { variant: (rnd() * 4) | 0 });
        else if (r < 0.215) G.world.addObj(map, 'rock', x, y, { variant: (rnd() * 3) | 0 });
        else if (r < 0.32) map.deco.push({ x, y, s: 'tuft', o: (rnd() * 6) | 0 });
        else if (r < 0.335) map.deco.push({ x, y, s: 'pebble', o: 0 });
        else if (r < 0.35) G.world.addObj(map, 'forage', x, y, { item: rnd() < 0.6 ? 'berry' : 'honey', ready: true });
      } else if (b === BI.SNOW) {
        if (r < 0.16) G.world.addObj(map, 'pine', x, y, { variant: (rnd() * 2) | 0 });
        else if (r < 0.20) G.world.addObj(map, 'rock', x, y, { variant: (rnd() * 3) | 0 });
        else if (r < 0.29) map.deco.push({ x, y, s: 'snowPuff', o: 0 });
      } else if (b === BI.DESERT) {
        if (r < 0.05) G.world.addObj(map, 'cactus', x, y, {});
        else if (r < 0.12) G.world.addObj(map, 'rock', x, y, { variant: 2 });
        else if (r < 0.14) map.deco.push({ x, y, s: 'pebble', o: 0 });
      } else if (b === BI.ROCK) {
        if (r < 0.10) G.world.addObj(map, 'rock', x, y, { variant: (rnd() * 3) | 0 });
      }
    }
  }

  // 矿区矿脉
  for (let i = 0; i < 170; i++) {
    const x = 130 + ((rnd() * 60) | 0), y = 82 + ((rnd() * 70) | 0);
    const idx = y * w + x;
    if (map.ground[idx] === GT.ROCK || map.biome[idx] === BI.ROCK) {
      if (!map.objAt.has(idx)) G.world.addObj(map, 'ore', x, y, { ore: rnd() < 0.55 ? 'copper' : rnd() < 0.8 ? 'iron' : 'gold', hp: 4 });
    }
  }
  for (let i = 0; i < 70; i++) {
    const x = 10 + ((rnd() * 220) | 0), y = 10 + ((rnd() * 220) | 0);
    const idx = y * w + x;
    if (map.ground[idx] === GT.ROCK && !map.objAt.has(idx)) {
      G.world.addObj(map, 'ore', x, y, { ore: rnd() < 0.4 ? 'iron' : rnd() < 0.7 ? 'gold' : 'crystal', hp: 5 });
    }
  }

  // 边界用岩石封住
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (x < 2 || y < 2 || x >= w - 2 || y >= h - 2) { map.ground[y * w + x] = GT.ROCK; map.solid[y * w + x] = 1; }
  }

  // 农庄周边留出干净的场院，避免树冠遮住菜畦
  const keepTypes = ['house', 'hut', 'shopStall', 'well', 'shrine', 'sign', 'entrance', 'chest', 'door', 'bed', 'kitchen', 'table', 'rug', 'pot'];
  const cleanRect = (x0, y0, x1, y1) => {
    map.objs = map.objs.filter((o) => {
      const inside = o.tx >= x0 && o.tx <= x1 && o.ty >= y0 && o.ty <= y1;
      if (!inside || keepTypes.includes(o.type)) return true;
      if (map.objAt.get(o.ty * w + o.tx) === o) map.objAt.delete(o.ty * w + o.tx);
      if (o.footprint) {
        for (let yy = 0; yy < o.footprint.h; yy++) for (let xx = 0; xx < o.footprint.w; xx++) {
          map.solid[(o.footprint.y0 + yy) * w + (o.footprint.x0 + xx)] = 0;
        }
      }
      return false;
    });
    map.deco = map.deco.filter((d) => !(d.x >= x0 && d.x <= x1 && d.y >= y0 && d.y <= y1));
  };
  cleanRect(50, 112, 68, 133);
  cleanRect(69, 114, 75, 122);

  map.spawn = { x: 60 * 16 + 8, y: 121 * 16 + 8 };
  return map;
};

/* ---------------- 地牢生成 ---------------- */
G.world.genDungeon = function (seed, floor) {
  const w = 64, h = 46;
  const map = G.world.newMap(w, h, 'dungeon' + floor);
  map.dungeon = true; map.floor = floor; map.seed = seed;
  const GT = G.world.GT;
  for (let i = 0; i < w * h; i++) { map.ground[i] = GT.WALL; map.solid[i] = 1; }
  const rnd = G.mulberry32(seed + floor * 7919 + 13);

  function carve(cx, cy, r) {
    for (let y = Math.max(2, cy - r); y <= Math.min(h - 3, cy + r); y++) {
      for (let x = Math.max(2, cx - r); x <= Math.min(w - 3, cx + r); x++) {
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy <= r * r + rnd() * 1.5) {
          const i = y * w + x;
          map.ground[i] = GT.CAVE; map.solid[i] = 0;
        }
      }
    }
  }
  const sx = 32, sy = 38;
  carve(sx, sy, 5);
  let walkers = [];
  for (let i = 0; i < 7; i++) walkers.push({ x: sx + (rnd() * 4 | 0) - 2, y: sy - 3 });
  for (let step = 0; step < 1400; step++) {
    walkers.forEach((wl) => {
      if (rnd() < 0.25) wl.dir = (rnd() * 4) | 0;
      const dx = wl.dir === 0 ? 1 : wl.dir === 1 ? -1 : 0;
      const dy = wl.dir === 2 ? 1 : wl.dir === 3 ? -1 : 0;
      wl.x = G.clamp(wl.x + dx, 4, w - 5);
      wl.y = G.clamp(wl.y + dy, 4, h - 6);
      carve(wl.x, wl.y, 1 + ((rnd() * 2) | 0));
    });
  }
  // 再开几个大洞厅
  for (let i = 0; i < 5; i++) carve(6 + ((rnd() * (w - 12)) | 0), 5 + ((rnd() * (h - 12)) | 0), 3 + ((rnd() * 3) | 0));

  // 起点与终点
  carve(32, 38, 4);
  map.stairsUpTile = { tx: 32, ty: 38 };
  G.world.addObj(map, 'stairsUp', 32, 38, { up: true });

  // 找最远可行走点放向下的阶梯
  let far = { x: 32, y: 10 }, best = -1;
  for (let y = 5; y < h - 5; y++) for (let x = 5; x < w - 5; x++) {
    if (map.ground[y * w + x] === GT.CAVE) {
      const d = Math.abs(x - 32) + Math.abs(y - 38) + rnd() * 8;
      if (d > best) { best = d; far = { x, y }; }
    }
  }
  G.world.addObj(map, 'stairsDown', far.x, far.y, {});
  map.stairsDownTile = { tx: far.x, ty: far.y };

  // 宝箱
  const chestCount = floor === 8 ? 2 : 1 + (floor % 2);
  for (let i = 0; i < chestCount; i++) {
    let tx, ty, tries = 0;
    do { tx = 6 + ((rnd() * (w - 12)) | 0); ty = 6 + ((rnd() * (h - 12)) | 0); tries++; }
    while ((map.ground[ty * w + tx] !== GT.CAVE || map.objAt.has(ty * w + tx)) && tries < 200);
    const loot = [];
    loot.push({ id: rnd() < 0.5 ? 'copper' : 'iron', n: 2 + ((rnd() * 3) | 0) });
    if (floor >= 3) loot.push({ id: 'gold', n: 1 + ((rnd() * 2) | 0) });
    if (floor >= 5) loot.push({ id: 'crystal', n: 1 });
    if (rnd() < 0.35) loot.push({ id: 'salve', n: 1 });
    G.world.addObj(map, 'chest', tx, ty, { loot, opened: false, tier: floor });
  }
  // 火把
  for (let i = 0; i < 12; i++) {
    const tx = 4 + ((rnd() * (w - 8)) | 0), ty = 4 + ((rnd() * (h - 8)) | 0);
    if (map.ground[ty * w + tx] === GT.CAVE && !map.objAt.has(ty * w + tx)) {
      G.world.addObj(map, 'torch', tx, ty, {});
    }
  }
  // 矿点
  for (let i = 0; i < 12 + floor * 3; i++) {
    const tx = 4 + ((rnd() * (w - 8)) | 0), ty = 4 + ((rnd() * (h - 8)) | 0);
    if (map.ground[ty * w + tx] === GT.CAVE && !map.objAt.has(ty * w + tx)) {
      G.world.addObj(map, 'ore', tx, ty, { ore: rnd() < 0.45 ? 'iron' : rnd() < 0.8 ? 'gold' : 'crystal' });
    }
  }

  if (floor === 8) {
    // BOSS 竞技场：重新铺设
    for (let y = 8; y < 36; y++) for (let x = 8; x < 56; x++) {
      const i = y * w + x;
      map.ground[i] = GT.CAVE; map.solid[i] = 0;
    }
    map.objs = []; map.objAt = new Map();
    for (let i = 0; i < w * h; i++) if (map.ground[i] === GT.CAVE) map.solid[i] = 0;
    map.stairsUpTile = { tx: 32, ty: 34 };
    G.world.addObj(map, 'stairsUp', 32, 34, { up: true });
    map.bossTile = { tx: 32, ty: 12 };
    map.stairsDownTile = null;
    for (let i = 0; i < 4; i++) G.world.addObj(map, 'torch', 12 + i * 12, 9, {});
    G.world.addObj(map, 'chest', 32, 30, { loot: [{ id: 'shard1', n: 1 }, { id: 'crystal', n: 3 }, { id: 'gold', n: 3 }], opened: false, special: true, bossChest: true });
  }
  map.spawn = { x: 32 * 16 + 8, y: 38 * 16 + 8 };
  return map;
};

/* ---------------- 农舍内部 ---------------- */
G.world.genInterior = function (level) {
  const w = 30, h = 17;
  const map = G.world.newMap(w, h, 'home');
  map.interior = true;
  const GT = G.world.GT;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    const border = x < 2 || y < 2 || x >= w - 2 || y >= h - 2;
    map.ground[i] = border ? GT.WALL : GT.WOOD;
    map.solid[i] = border ? 1 : 0;
  }
  for (let x = 2; x < w - 2; x++) { map.ground[(h - 2) * w + x] = GT.WALL; map.solid[(h - 2) * w + x] = 1; }
  G.world.addObj(map, 'rug', 15, 11, {});
  G.world.addObj(map, 'bed', 5, 5, {});
  G.world.addObj(map, 'kitchen', 24, 4, {});
  G.world.addObj(map, 'table', 15, 8, {});
  G.world.addObj(map, 'pot', 8, 5, {});
  G.world.addObj(map, 'pot', 27, 9, {});
  G.world.addObj(map, 'chest', 3, 13, { loot: [], opened: false });
  G.world.addObj(map, 'crate', 26, 13, {});
  G.world.addObj(map, 'torch', 10, 2, {});
  G.world.addObj(map, 'torch', 20, 2, {});
  G.world.addObj(map, 'door', 15, 15, { exit: true, to: 'over' });
  map.spawn = { x: 15 * 16 + 8, y: 14 * 16 + 8 };
  map.level = level;
  return map;
};

/* ---------------- 农场辅助 ---------------- */
G.world.farmAt = (map, tx, ty) => map.farm.get(ty * map.w + tx) || null;

G.world.canTill = function (map, tx, ty) {
  if (map.dungeon || map.interior) return false;
  const g = G.world.tileGround(map, tx, ty);
  if (!(g === G.world.GT.GRASS || g === G.world.GT.DIRT || g === G.world.GT.PATH || g === G.world.GT.SAND)) return false;
  if (G.world.isSolid(map, tx, ty)) return false;
  if (G.world.objAt(map, tx, ty)) return false;
  return true;
};

/* 找到玩家附近可交互对象 */
G.world.findInteract = function (map, x, y, dirx, diry, range = 30) {
  let best = null, bestScore = 1e9;
  for (const o of map.objs) {
    if (!o.def.interact) continue;
    const dx = o.x - x, dy = (o.y - 8) - y;
    const d = Math.hypot(dx, dy);
    if (d > range + Math.max(o.def.sw, o.def.sh) * 8) continue;
    const dot = (dx * dirx + dy * diry) / (d || 1);
    const score = d - dot * 14;
    if (score < bestScore) { bestScore = score; best = o; }
  }
  return best;
};

/* ---------------- 存档 ---------------- */
G.world.serialize = function (map) {
  const objs = map.objs.map((o) => {
    const out = { t: o.type, tx: o.tx, ty: o.ty, v: o.variant, hp: o.hp };
    if (o.level) out.level = o.level;
    if (o.ore) out.ore = o.ore;
    if (o.ready === false) out.ready = false;
    if (o.opened) out.opened = true;
    if (o.loot) out.loot = o.loot;
    if (o.text) out.text = o.text;
    if (o.special) out.special = true;
    if (o.items) out.items = o.items;
    if (o.growth !== undefined) out.growth = o.growth;
    if (o.regrow !== undefined) out.regrow = o.regrow;
    return out;
  });
  const farm = [];
  map.farm.forEach((p, i) => {
    if (!p.crop && !p.tilled) return;
    farm.push([i, p.tilled ? 1 : 0, p.wet ? 1 : 0, p.crop || null, p.growth || 0, p.regrow || 0]);
  });
  return { objs, farm };
};

G.world.applySave = function (map, data) {
  if (!data) return;
  map.objs = [];
  map.objAt = new Map();
  map.solid.fill(0);
  map.farm = new Map();
  // 地面水体/墙体重新标记
  for (let i = 0; i < map.w * map.h; i++) {
    const g = map.ground[i];
    if (g === G.world.GT.WATER || g === G.world.GT.ROCK || g === G.world.GT.WALL) map.solid[i] = 1;
  }
  (data.objs || []).forEach((s) => {
    const extra = { variant: s.v || 0, hp: s.hp };
    if (s.level) extra.level = s.level;
    if (s.ore) extra.ore = s.ore;
    if (s.ready === false) extra.ready = false;
    if (s.opened) extra.opened = true;
    if (s.loot) extra.loot = s.loot;
    if (s.text) extra.text = s.text;
    if (s.special) extra.special = true;
    if (s.items) extra.items = s.items;
    G.world.addObj(map, s.t, s.tx, s.ty, extra);
  });
  (data.farm || []).forEach(([i, tilled, wet, crop, growth, regrow]) => {
    map.farm.set(i, { tilled: !!tilled, wet: !!wet, crop: crop || null, growth: growth || 0, regrow: regrow || 0 });
  });
  map.home = map.objs.find((o) => o.type === 'house') || null;
};

/* 探索迷雾 RLE */
G.world.reveal = function (map, tx, ty, r) {
  if (!map || map.dungeon) return;
  const x0 = Math.max(0, tx - r), x1 = Math.min(map.w - 1, tx + r);
  const y0 = Math.max(0, ty - r), y1 = Math.min(map.h - 1, ty + r);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if ((x - tx) * (x - tx) + (y - ty) * (y - ty) <= r * r) map.explored[y * map.w + x] = 1;
  }
};

G.world.rleEncode = function (arr) {
  const out = [];
  let cur = arr[0], run = 1;
  for (let i = 1; i < arr.length; i++) {
    if (arr[i] === cur) run++;
    else { out.push(run, cur); cur = arr[i]; run = 1; }
  }
  out.push(run, cur);
  return out;
};
G.world.rleDecode = function (out, len) {
  const arr = new Uint8Array(len);
  let i = 0;
  for (let k = 0; k < out.length; k += 2) {
    const run = out[k], val = out[k + 1];
    for (let j = 0; j < run && i < len; j++) arr[i++] = val;
  }
  return arr;
};


/* ===== js/40_entities.js ===== */
/* =========================================================
   星野农庄 — 40 实体：玩家 / 怪物 / NPC / 掉落 / 投射物
   ========================================================= */
G.ent = {};

G.ent.newPlayer = function (x, y) {
  return {
    x, y, r: 5.5,
    dir: 'down', face: { x: 0, y: 1 },
    moving: false, animT: 0, animFrame: 0,
    hp: 100, maxHp: 100,
    stamina: 100, maxStamina: 100,
    hunger: 100,
    inv: 0, swing: 0, swingAng: 0, atkCd: 0,
    useCd: 0, hurtT: 0, dead: false, actionLock: 0,
    bob: 0,
  };
};

G.ent.resetPlayerStats = function (p) {
  p.maxHp = 100;
  p.maxStamina = 100;
  p.hp = p.maxHp; p.stamina = p.maxStamina; p.hunger = 100;
};

/* 圆 vs 地块碰撞 */
G.ent.collideMove = function (map, x, y, dx, dy, r) {
  function blocked(nx, ny) {
    const pts = [[nx - r, ny - r], [nx + r, ny - r], [nx - r, ny + r + 2], [nx + r, ny + r + 2]];
    for (const [px, py] of pts) {
      const tx = Math.floor(px / 16), ty = Math.floor(py / 16);
      if (G.world.isSolid(map, tx, ty)) return true;
    }
    return false;
  }
  let nx = x + dx;
  if (!blocked(nx, y)) x = nx; else if (!blocked(x + Math.sign(dx) * 1, y)) x += Math.sign(dx);
  let ny = y + dy;
  if (!blocked(x, ny)) y = ny; else if (!blocked(x, y + Math.sign(dy) * 1)) y += Math.sign(dy);
  return { x, y };
};

G.ent.updatePlayer = function (dt) {
  const st = G.state, p = st.player, inn = G.input;
  if (p.dead) return;
  p.atkCd = Math.max(0, p.atkCd - dt);
  p.useCd = Math.max(0, p.useCd - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);
  p.actionLock = Math.max(0, p.actionLock - dt);
  if (p.swing > 0) p.swing -= dt;

  let ax = 0, ay = 0, moving = false;
  if (p.actionLock <= 0) {
    const a = inn.axis();
    ax = a.x; ay = a.y;
    moving = Math.hypot(ax, ay) > 0.1;
  }
  const running = inn.key('ShiftLeft') || inn.key('ShiftRight');
  const speedMul = 1 + 0.12 * (st.perks.runner || 0) + (st.perks.starBlessed ? 0.1 : 0);
  const baseSpeed = running && p.stamina > 1 ? 108 : 72;
  const speed = baseSpeed * speedMul;
  if (moving) {
    const len = Math.hypot(ax, ay);
    const dx = (ax / len) * speed * dt;
    const dy = (ay / len) * speed * dt;
    const res = G.ent.collideMove(st.map, p.x, p.y, dx, dy, p.r);
    p.x = G.clamp(res.x, 8, st.map.w * 16 - 8);
    p.y = G.clamp(res.y, 8, st.map.h * 16 - 8);
    if (Math.abs(ax) > Math.abs(ay) * 1.2) p.dir = ax > 0 ? 'right' : 'left';
    else if (Math.abs(ay) > 0.2) p.dir = ay > 0 ? 'down' : 'up';
    p.face.x = Math.abs(ax) > Math.abs(ay) ? G.sign(ax) : 0;
    p.face.y = Math.abs(ay) >= Math.abs(ax) ? G.sign(ay) : 0;
    if (p.face.x === 0 && p.face.y === 0) p.face.y = 1;
    p.animT += dt * (running ? 9 : 7);
    p.animFrame = moving ? Math.floor(p.animT) % 3 : 0;
    if (running && p.stamina > 0) {
      p.stamina = Math.max(0, p.stamina - 12 * dt);
      if (Math.random() < dt * 8) G.fx.dust(p.x, p.y);
    }
  } else {
    p.animFrame = 0;
    p.animT = 0;
  }
  // 饥饿与体力
  st.hungerTimer = (st.hungerTimer || 0) + dt;
  if (st.hungerTimer > 18) {
    st.hungerTimer = 0;
    p.hunger = Math.max(0, p.hunger - 1);
    if (p.hunger <= 0) p.hp = Math.max(0, p.hp - 1.2);
  }
  if (p.stamina < p.maxStamina && !moving) {
    p.stamina = Math.min(p.maxStamina, p.stamina + (p.hunger > 25 ? 7 : 3) * dt);
  }
  if (p.hunger > 60 && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + 0.25 * dt);
  if (st.perks.healer) { st.healTimer = (st.healTimer || 0) + dt; if (st.healTimer > 6) { st.healTimer = 0; p.hp = Math.min(p.maxHp, p.hp + 1); } }

  // 探索迷雾
  G.world.reveal && G.world.reveal(st.map, p.x / 16, p.y / 16, 12);
};

/* ---------------- 伤害 ---------------- */
G.ent.hurtPlayer = function (dmg, sx, sy) {
  const st = G.state, p = st.player;
  if (p.dead || st.godMode) return;
  if (p.hurtT > 0) return;
  let d = dmg;
  p.hp -= d;
  p.hurtT = 0.75;
  p.stamina = Math.max(0, p.stamina - 8);
  G.audio.play('hurt');
  G.fx.float(p.x, p.y - 20, '-' + Math.round(d), '#ff7b7b');
  G.fx.shake = 6;
  const dx = p.x - sx, dy = p.y - sy;
  const len = Math.hypot(dx, dy) || 1;
  const res = G.ent.collideMove(st.map, p.x, p.y, (dx / len) * 10, (dy / len) * 10, p.r);
  p.x = res.x; p.y = res.y;
  if (p.hp <= 0) G.sys.onPlayerDeath();
};

G.ent.damageEnemy = function (e, dmg, kx = 0, ky = 0, crit = false) {
  const st = G.state;
  e.hp -= dmg;
  e.hitT = 0.22;
  e.aggro = true;
  e.vx += kx; e.vy += ky;
  G.fx.float(e.x, e.y - 16, Math.round(dmg), crit ? '#ffe066' : '#fff1d0', crit);
  G.fx.blood(e.x, e.y - 6, e.def.flying ? '#8a7f9f' : '#d94a5c');
  G.audio.play(crit ? 'crit' : 'hit');
  G.fx.shake = crit ? 6 : 3;
  if (e.hp <= 0) G.ent.killEnemy(e);
};

G.ent.killEnemy = function (e) {
  const st = G.state;
  const def = e.def;
  st.stats.kills++;
  st.quests.kills[e.type] = (st.quests.kills[e.type] || 0) + 1;
  st.quests.totalKills++;
  G.sys.tutorial('kill');
  G.sys.gainXp(def.xp);
  G.audio.play('hit');
  G.fx.burst(e.x, e.y - 6, '#d94a5c', 10);
  // 掉落
  const drops = [];
  def.drops.forEach((d) => {
    let chance = d.p * (1 + 0.25 * (st.perks.lucky ? 1 : 0));
    if (Math.random() < chance) drops.push({ id: d.id, n: d.n || 1 });
  });
  const gold = def.gold ? def.gold[0] + Math.floor(Math.random() * (def.gold[1] - def.gold[0] + 1)) : 0;
  drops.forEach((d) => G.fx.dropItem(e.x + G.rand(10, -10), e.y, d.id, d.n));
  if (gold) G.fx.dropGold(e.x, e.y, gold);
  if (st.perks.secondWind) st.player.hp = Math.min(st.player.maxHp, st.player.hp + 2);
  if (e.type === 'boss') G.sys.onBossDefeated(e);
  const idx = G.ent.enemies.indexOf(e);
  if (idx >= 0) G.ent.enemies.splice(idx, 1);
};

/* ---------------- 敌人 ---------------- */
G.ent.enemies = [];
G.ent.projectiles = [];
G.ent.spawnTimer = 0;
G.ent.bossSpawned = false;

G.ent.makeEnemy = function (type, x, y) {
  const def = G.data.enemies[type];
  const map = G.state.map;
  const scale = map.dungeon ? 1 + (map.floor || 0) * 0.06 : 1;
  return {
    type, def, x, y, vx: 0, vy: 0,
    hp: def.hp * scale, maxHp: def.hp * scale, radius: def.radius,
    dir: 1, anim: Math.random() * 4, state: 'idle', timer: Math.random() * 2,
    hitT: 0, atkCd: 0, aggro: false, home: { x, y }, level: map.dungeon ? map.floor : 0,
    boss: !!def.boss, phase: 0, phaseT: 0, summonCd: 0,
  };
};

G.ent.spawnEnemyNear = function (type, dist = 260) {
  const st = G.state, p = st.player, map = st.map;
  for (let tries = 0; tries < 25; tries++) {
    const ang = Math.random() * Math.PI * 2;
    const d = dist * (0.55 + Math.random() * 0.6);
    const tx = Math.floor((p.x + Math.cos(ang) * d) / 16);
    const ty = Math.floor((p.y + Math.sin(ang) * d) / 16);
    if (!G.world.walkable(map, tx, ty)) continue;
    if (!map.dungeon) {
      const b = map.biome[ty * map.w + tx];
      const allowed = G.data.enemies[type].biomes;
      const names = ['meadow', 'forest', 'desert', 'snow', 'rock', 'water'];
      if (!allowed.includes(names[b])) continue;
      if (G.ent.nearSafeZone(tx, ty)) continue;
    } else {
      if (map.ground[ty * map.w + tx] !== G.world.GT.CAVE) continue;
    }
    return G.ent.makeEnemy(type, tx * 16 + 8, ty * 16 + 8);
  }
  return null;
};

G.ent.nearSafeZone = function (tx, ty) {
  const map = G.state.map;
  if (!map.home) return false;
  const hx = map.home.tx, hy = map.home.ty;
  if (Math.abs(tx - hx) < 9 && Math.abs(ty - hy) < 8) return true;
  return false;
};

G.ent.updateSpawn = function (dt) {
  const st = G.state, map = st.map, night = G.time.isNight();
  if (map.interior) return;
  G.ent.spawnTimer -= dt;
  const max = map.dungeon ? 5 + (map.floor || 0) * 2 : (night ? 14 : 7);
  if (G.ent.spawnTimer > 0 || G.ent.enemies.length >= max) return;
  G.ent.spawnTimer = map.dungeon ? 2.4 : 3.2;
  if (map.dungeon) {
    const pool = (map.floor || 0) >= 4 ? ['skeleton', 'goblin', 'bat', 'slime'] : ['slime', 'bat', 'goblin'];
    const t = G.pick(pool);
    const e = G.ent.spawnEnemyNear(t, 230);
    if (e) G.ent.enemies.push(e);
    return;
  }
  const hour = G.time.hour();
  if (hour < 7 || hour > 19) {
    for (let i = 0; i < 2; i++) {
      const t = G.pick(['slime', 'bat', 'wolf', 'goblin']);
      const e = G.ent.spawnEnemyNear(t, 260);
      if (e) G.ent.enemies.push(e);
    }
  } else if (st.player.x > map.w * 16 * 0.4) {
    if (Math.random() < 0.5) {
      const e = G.ent.spawnEnemyNear(G.pick(['slime', 'goblin']), 300);
      if (e) G.ent.enemies.push(e);
    }
  }
};

G.ent.updateEnemies = function (dt) {
  const st = G.state, p = st.player, map = st.map;
  G.ent.enemies.forEach((e) => {
    e.hitT = Math.max(0, e.hitT - dt);
    e.atkCd = Math.max(0, e.atkCd - dt);
    e.anim += dt * (2 + e.def.speed * 0.02);
    const dx = p.x - e.x, dy = p.y - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist > 460) { e.x = e.home.x; e.y = e.home.y; e.aggro = false; }
    if (!e.aggro && dist < 130) e.aggro = true;
    if (e.aggro && dist > 230 && !e.boss) e.aggro = false;

    // 物理
    let ax = 0, ay = 0;
    if (e.aggro) {
      if (e.type === 'slime') {
        e.timer -= dt;
        if (e.timer <= 0) {
          e.timer = 1.15;
          e.vx = (dx / dist) * 95; e.vy = (dy / dist) * 95;
          if (dist < 40) G.ent.hurtPlayer(e.def.dmg, e.x, e.y);
        }
      } else if (e.type === 'bat') {
        const t = e.anim * 2;
        e.vx = (dx / dist) * e.def.speed + Math.cos(t) * 30;
        e.vy = (dy / dist) * e.def.speed + Math.sin(t) * 26;
        if (dist < 16) G.ent.hurtPlayer(e.def.dmg, e.x, e.y);
      } else if (e.type === 'goblin') {
        if (dist > 26) { e.vx = (dx / dist) * e.def.speed; e.vy = (dy / dist) * e.def.speed; }
        if (dist < 130 && dist > 45 && e.atkCd <= 0 && Math.random() < 0.6) {
          e.atkCd = 2.6;
          G.ent.projectiles.push({ x: e.x, y: e.y - 10, vx: (dx / dist) * 120, vy: (dy / dist) * 120, t: 2, dmg: e.def.dmg * 0.6, kind: 'rock', r: 4 });
        } else if (dist <= 30 && e.atkCd <= 0) { e.atkCd = 1.1; G.ent.hurtPlayer(e.def.dmg, e.x, e.y); }
      } else if (e.type === 'skeleton') {
        if (dist > 24) { e.vx = (dx / dist) * e.def.speed; e.vy = (dy / dist) * e.def.speed; }
        else if (e.atkCd <= 0) { e.atkCd = 1.4; G.ent.hurtPlayer(e.def.dmg, e.x, e.y); G.fx.bone(e.x, e.y - 10); }
        if (dist > 60 && dist < 180 && e.atkCd <= 0 && Math.random() < 0.25) {
          e.atkCd = 2.4;
          G.ent.projectiles.push({ x: e.x, y: e.y - 12, vx: (dx / dist) * 100, vy: (dy / dist) * 100, t: 2, dmg: e.def.dmg * 0.5, kind: 'bone', r: 3 });
        }
      } else if (e.type === 'wolf') {
        e.timer -= dt;
        if (e.timer <= 0) { e.timer = 2.4; e.vx = (dx / dist) * 175; e.vy = (dy / dist) * 175; }
        if (dist < 28) G.ent.hurtPlayer(e.def.dmg, e.x, e.y);
      } else if (e.type === 'boss') {
        G.ent.updateBoss(e, dt, dx, dy, dist);
      }
    } else {
      e.timer -= dt;
      if (e.timer <= 0) { e.timer = 1 + Math.random() * 2; e.vx = G.rand(24, -24); e.vy = G.rand(24, -24); }
    }
    if (e.type !== 'bat' && e.type !== 'boss') { e.vx *= 0.86; e.vy *= 0.86; }
    if (e.type === 'bat') { e.vx *= 0.92; e.vy *= 0.92; }
    const res = G.ent.collideMove(map, e.x, e.y, e.vx * dt, e.vy * dt, e.radius * 0.6);
    e.x = res.x; e.y = res.y;
    if (Math.abs(e.vx) > 3) e.dir = G.sign(e.vx);
  });

  // 投射物
  G.ent.projectiles.forEach((pr) => {
    pr.t -= dt;
    const res = G.ent.collideMove(map, pr.x, pr.y, pr.vx * dt, pr.vy * dt, pr.r);
    if (res.x === pr.x && res.y === pr.y && pr.t > 0.05) { /* 撞墙 */ pr.t = 0.05; }
    pr.x = res.x; pr.y = res.y;
    if (Math.hypot(pr.x - p.x, pr.y - p.y) < 12) {
      G.ent.hurtPlayer(pr.dmg, pr.x, pr.y);
      pr.t = 0;
    }
  });
  G.ent.projectiles = G.ent.projectiles.filter((pr) => pr.t > 0);
};

G.ent.updateBoss = function (e, dt, dx, dy, dist) {
  const st = G.state;
  e.phaseT += dt;
  if (e.phase === 0) {
    if (dist > 80) { e.vx = (dx / dist) * e.def.speed; e.vy = (dy / dist) * e.def.speed; }
    else if (e.atkCd <= 0) { e.atkCd = 2.4; G.ent.hurtPlayer(e.def.dmg, e.x, e.y); G.fx.shockwave(e.x, e.y); G.audio.play('roar'); e.phaseT = 0; }
    if (e.phaseT > 9) { e.phase = 1; e.phaseT = 0; G.audio.play('roar'); G.fx.shake = 10; }
  } else if (e.phase === 1) {
    // 召唤
    if (e.phaseT < 0.2 && !e.summoned) { e.summoned = true; for (let i = 0; i < 3; i++) { const en = G.ent.makeEnemy('slime', e.x + G.rand(40, -40), e.y + G.rand(30, -30)); en.aggro = true; G.ent.enemies.push(en); } }
    if (e.phaseT > 2.4) { e.phase = 2; e.phaseT = 0; e.summoned = false; }
  } else {
    if (e.phaseT > 2) { e.phase = 0; e.phaseT = 0; }
    if (dist > 8) { e.vx = (dx / dist) * 70; e.vy = (dy / dist) * 70; }
    if (e.atkCd <= 0) { e.atkCd = 3; G.ent.projectiles.push({ x: e.x, y: e.y, vx: 0, vy: 0, t: 0.9, dmg: 18, kind: 'wave', r: 24, radius: 0 }); G.fx.shockwave(e.x, e.y); }
  }
  // 二阶段加速
  if (e.hp < e.maxHp * 0.5) e.def_speedBoost = true;
};

G.ent.clearEnemies = function () {
  G.ent.enemies = [];
  G.ent.projectiles = [];
  G.ent.bossSpawned = false;
};

/* ---------------- NPC ---------------- */
G.ent.npcs = [];
G.ent.buildNpcs = function () {
  const map = G.state.map;
  G.ent.npcs = [];
  if (map.dungeon) return;
  if (!map.interior) {
    const leahHut = map.objs.find((o) => o.type === 'hut' && o.npc === 'leah');
    const shop = map.objs.find((o) => o.type === 'shopStall');
    const herm = map.objs.find((o) => o.type === 'hut' && o.npc === 'hermit');
    if (leahHut && !G.state.family.married) {
      G.ent.npcs.push({ id: 'leah', x: leahHut.x, y: leahHut.y + 10, homeX: leahHut.x, homeY: leahHut.y + 10, tx: leahHut.tx, ty: leahHut.ty + 1, dir: 'down', t: 0 });
    }
    if (shop) G.ent.npcs.push({ id: 'chen', x: shop.x + 24, y: shop.y - 6, homeX: shop.x + 24, homeY: shop.y - 6, dir: 'down', t: 0 });
    if (herm) G.ent.npcs.push({ id: 'hermit', x: herm.x, y: herm.y + 10, homeX: herm.x, homeY: herm.y + 10, dir: 'down', t: 0 });
    if (G.state.family.married) {
      const home = map.objs.find((o) => o.type === 'house');
      if (home) {
        G.ent.npcs.push({ id: 'leah', x: home.x - 22, y: home.y + 26, homeX: home.x - 22, homeY: home.y + 26, dir: 'down', t: 0 });
        if (G.state.family.child) G.ent.npcs.push({ id: 'kid', x: home.x + 26, y: home.y + 30, homeX: home.x + 26, homeY: home.y + 30, dir: 'down', t: 0 });
      }
    }
  } else {
    if (G.state.family.married) G.ent.npcs.push({ id: 'leah', x: 8 * 16, y: 10 * 16, homeX: 8 * 16, homeY: 10 * 16, dir: 'down', t: 0 });
    if (G.state.family.child) G.ent.npcs.push({ id: 'kid', x: 14 * 16, y: 11 * 16, homeX: 14 * 16, homeY: 11 * 16, dir: 'down', t: 0 });
  }
};

G.ent.updateNpcs = function (dt) {
  const hour = G.time.hour();
  G.ent.npcs.forEach((n) => {
    n.t -= dt;
    if (n.t <= 0) {
      n.t = 1.5 + Math.random() * 3;
      n.target = { x: n.homeX + G.rand(18, -18), y: n.homeY + G.rand(14, -14) };
      if (Math.random() < 0.3) n.dir = G.pick(['down', 'up', 'left', 'right']);
    }
    if (n.target) {
      const dx = n.target.x - n.x, dy = n.target.y - n.y;
      const d = Math.hypot(dx, dy);
      if (d > 2) {
        n.x += (dx / d) * Math.min(d, 10 * dt); n.y += (dy / d) * Math.min(d, 10 * dt);
        n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        n.animT = (n.animT || 0) + dt * 4.5;
      } else {
        n.animT = 0;
      }
    }
    // 商人营业时间
    n.hidden = n.id === 'chen' && (hour < 9 || hour >= 17);
    if (n.id === 'leah' && !G.state.family.married) {
      n.hidden = hour >= 19 || hour < 7;
    }
    if (n.id === 'leah' && G.state.family.married) {
      n.hidden = hour >= 19 || hour < 7;
    }
    if (n.id === 'kid') n.hidden = hour < 9 || hour >= 18;
  });
};

G.ent.npcByName = (id) => G.ent.npcs.find((n) => n.id === id && !n.hidden);

/* ---------------- 掉落物 ---------------- */
G.ent.drops = [];

G.ent.updateDrops = function (dt) {
  const p = G.state.player;
  G.ent.drops.forEach((d) => {
    d.life -= dt;
    d.vy += 380 * dt;
    d.y += d.vy * dt;
    d.x += d.vx * dt;
    d.vx *= 0.92;
    if (d.vy > 0) { d.vy = 0; }
    d.bob += dt * 3;
    if (d.gold) {
      const dist = Math.hypot(d.x - p.x, d.y - p.y);
      if (dist < 46) {
        const dd = Math.max(1, dist);
        d.x += ((p.x - d.x) / dd) * 110 * dt;
        d.y += ((p.y - d.y) / dd) * 110 * dt;
      }
      if (dist < 12) { G.state.gold += d.n; G.audio.play('coin'); G.fx.float(p.x, p.y - 24, '+' + d.n + 'g', '#f2c14e'); d.life = 0; G.ui.refresh(); }
    } else {
      d.bobT = (d.bobT || 0) + dt;
      const dist = Math.hypot(d.x - p.x, d.y - p.y);
      if (dist < 60) {
        const dd = Math.max(1, dist);
        d.x += ((p.x - d.x) / dd) * 70 * dt;
        d.y += ((p.y - d.y) / dd) * 70 * dt;
      }
      if (dist < 11) {
        G.sys.give(d.id, d.n, true);
        G.audio.play('pickup');
        d.life = 0;
      }
    }
  });
  G.ent.drops = G.ent.drops.filter((d) => d.life > 0);
};

G.fx = {
  particles: [], floats: [], shake: 0, flash: 0,
  dust(x, y) { this.particles.push({ x: x + G.rand(4, -4), y: y + G.rand(2, -2), vx: G.rand(20, -20), vy: G.rand(-8, -22), life: 0.5, max: 0.4, col: '#d9cba8', size: 1 }); },
  blood(x, y, col) {
    for (let i = 0; i < 5; i++) this.particles.push({ x, y, vx: G.rand(50, -50), vy: G.rand(-20, -60), g: 220, life: 0.5, max: 0.5, col, size: 2 });
  },
  burst(x, y, col, n = 8) {
    for (let i = 0; i < n; i++) this.particles.push({ x, y, vx: G.rand(80, -80), vy: G.rand(-20, -90), g: 180, life: 0.7, max: 0.7, col, size: 2 });
  },
  bones(x, y) {
    for (let i = 0; i < 3; i++) this.particles.push({ x, y, vx: G.rand(30, -30), vy: G.rand(-20, -50), g: 200, life: 0.6, max: 0.6, col: '#e8e2d0', size: 1 });
  },
  float(x, y, text, col = '#fff', crit = false) { this.floats.push({ x, y, text: String(text), col, life: 0.9, max: 0.9, crit, vy: -26 }); },
  dropItem(x, y, id, n) {
    if (!G.ent.drops) return;
    for (let i = 0; i < n; i++) {
      G.ent.drops.push({ id, n: 1, x: x + G.rand(12, -12), y: y + G.rand(8, -8), vx: G.rand(40, -40), vy: -60, life: 45, bob: Math.random() * 6, bobT: 0 });
    }
  },
  dropGold(x, y, n) {
    if (!G.ent.drops) return;
    const coins = Math.min(6, Math.max(1, Math.floor(n / 8) + 1));
    for (let i = 0; i < coins; i++) {
      G.ent.drops.push({ gold: true, n: Math.floor(n / coins), x: x + G.rand(10, -10), y: y + G.rand(6, -6), vx: G.rand(70, -70), vy: -70, life: 30, bob: Math.random() * 6 });
    }
  },
  update(dt) {
    this.particles.forEach((p) => {
      p.life -= dt;
      p.vy += (p.g || 0) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    });
    this.particles = this.particles.filter((p) => p.life > 0);
    this.floats.forEach((f) => { f.life -= dt; f.y += f.vy * dt; f.vy *= 0.94; });
    this.floats = this.floats.filter((f) => f.life > 0);
    this.shake = Math.max(0, this.shake - dt * 30);
    this.flash = Math.max(0, this.flash - dt * 2);
  },
};

G.sys = {};

G.sys.SEASON_DAYS = 8;
G.sys.SAVE_KEY = 'xingye_nongzhuang_save_v1';

G.sys.makeState = function () {
  return {
    started: false,
    seed: 0,
    map: null, maps: {}, dungeons: {}, homeMap: null,
    player: null,
    inv: new Array(36).fill(null),
    selected: 0,
    gold: 150,
    minute: 6 * 60,
    day: 1, season: 0, year: 1,
    weather: 'sunny', tomorrow: 'sunny',
    hungerTimer: 0,
    stats: { kills: 0, harvests: 0, fish: 0, wood: 0, mined: 0, days: 0, gifts: 0, cooked: 0, questsDone: 0 },
    npcs: {
      leah: { affection: 0, talked: false, gifted: false, met: false },
      chen: { affection: 5, talked: false, gifted: false, met: false },
      hermit: { affection: 0, talked: false, gifted: false, met: false },
    },
    family: { married: false, spouse: 'leah', child: null, childAge: 0, mood: 85, loveDays: 0, houseLevel: 1, fedToday: 0 },
    quests: { list: [], kills: {}, goldEarned: 0, totalKills: 0, harvested: 0, fished: 0, nextId: 1 },
    story: { shards: 0, restored: false, shardList: [] },

    level: 1, xp: 0, xpNeed: 80, perks: {}, perkPoints: 0, pendingPerks: [],
    flags: { intro: false, bossDead: false, dungeonFloor: 0, deepest: 0, endSeen: false },
    build: null, fishing: null, fade: 0, godMode: false,
